<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cozy Coloring</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #f6f1e7;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #3d4351;
  }
  #app {
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ── Home (gallery) ── */
  #home { background: linear-gradient(180deg, #fdf8ee 0%, #f3ead9 100%); }
  #home-head { padding: max(14px, env(safe-area-inset-top)) 20px 6px; text-align: center; }
  #home-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  #home-head p { font-size: 14px; color: #8b8fa0; margin-top: 3px; }
  #grid {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
    align-content: start;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 10px 10px 12px;
    box-shadow: 0 3px 14px rgba(90, 70, 40, 0.10);
    text-align: center;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  .card.done { border-color: #ffc94d; }
  .card .thumb { width: 100%; border-radius: 12px; overflow: hidden; background: #fafbfc; }
  .card .thumb svg { display: block; width: 100%; height: auto; }
  .card .nm { font-size: 14px; font-weight: 700; margin-top: 8px; }
  .card .pg { font-size: 12px; color: #9aa0ae; margin-top: 2px; }
  .card.done .pg { color: #d99b1f; font-weight: 700; }

  /* ── Play screen ── */
  #play { background: #fdf9f0; }
  #play-head {
    display: flex; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 12px 8px;
  }
  #btn-back {
    width: 40px; height: 40px; border: none; border-radius: 12px;
    background: #fff; box-shadow: 0 2px 8px rgba(90,70,40,0.12);
    font-size: 20px; color: #3d4351; flex: none;
  }
  #btn-back:active { transform: scale(0.94); }
  #head-mid { flex: 1; min-width: 0; }
  #pic-name { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pbar { height: 7px; background: #ece5d6; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fc46a, #ffc94d); border-radius: 4px; transition: width 0.25s ease; }
  #pct { font-size: 14px; font-weight: 800; color: #8b8fa0; min-width: 44px; text-align: right; flex: none; }

  #art-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 4px 10px; }
  #art-wrap svg { display: block; background: #fff; border-radius: 16px; box-shadow: 0 4px 18px rgba(90,70,40,0.12); }

  .region { stroke: #ccd3da; stroke-width: 1.4; fill: #fff; }
  .region.filled { stroke: none; }
  .region.hl { animation: hlp 1.3s ease-in-out infinite; }
  @keyframes hlp { 0%, 100% { fill: #fff; } 50% { fill: var(--tint); } }
  .region.shake { animation: shk 0.35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes shk { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .lbl {
    fill: #98a2b3; font-weight: 700; text-anchor: middle;
    pointer-events: none; font-family: -apple-system, Arial, sans-serif;
  }
  .lbl.on { fill: #4a5468; }
  .lbl.flash { animation: lfl 0.5s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes lfl { 0%,100% { transform: scale(1); } 40% { transform: scale(1.9); } }
  .deco { pointer-events: none; }

  /* ── Palette ── */
  #palette {
    flex: none;
    display: flex; gap: 10px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #palette::-webkit-scrollbar { display: none; }
  .sw {
    flex: none;
    width: 52px; height: 52px; border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(90,70,40,0.18), inset 0 -2px 4px rgba(0,0,0,0.08);
    position: relative;
    transition: transform 0.15s ease;
  }
  .sw.sel { transform: scale(1.16); outline: 3.5px solid #3d4351; outline-offset: 2.5px; }
  .sw.done { opacity: 0.45; box-shadow: none; }
  .sw .cnt {
    position: absolute; right: -3px; top: -3px;
    min-width: 19px; height: 19px; padding: 0 4px;
    border-radius: 10px; background: #3d4351; color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Completion ── */
  #done-panel {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(330px, 88vw);
    background: rgba(46, 38, 24, 0.95); color: #fff;
    border-radius: 18px; padding: 16px 16px 14px; text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  @keyframes rise { from { transform: translateX(-50%) translateY(60px); opacity: 0; } }
  #done-panel h2 { font-size: 22px; font-weight: 800; }
  #done-panel p { font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 3px; }
  #done-panel .row { display: flex; gap: 10px; margin-top: 13px; }
  #done-panel button {
    flex: 1; border: none; border-radius: 12px; padding: 12px 0;
    font-size: 15px; font-weight: 800;
  }
  #btn-gallery { background: #ffc94d; color: #3a2c10; }
  #btn-again { background: rgba(255,255,255,0.14); color: #fff; }
  #done-panel button:active { transform: scale(0.96); }
  #confetti { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <!-- Home / gallery -->
  <div class="screen" id="home">
    <div id="home-head">
      <h1>🎨 Cozy Coloring</h1>
      <p>Pick a picture and tap to color</p>
    </div>
    <div id="grid"></div>
  </div>

  <!-- Coloring screen -->
  <div class="screen hidden" id="play">
    <div id="play-head">
      <button id="btn-back">←</button>
      <div id="head-mid">
        <div id="pic-name"></div>
        <div id="pbar"><div id="pbar-fill"></div></div>
      </div>
      <div id="pct">0%</div>
    </div>
    <div id="art-wrap"></div>
    <div id="palette"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

  // ── 저장 ────────────────────────────────────────────────────
  var SAVE_KEY = 'coloringbook-v1';
  function loadSave() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; }
  }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {}
  }
  var saveData = loadSave();

  // 탭 판정 헬퍼: 완충지대 스크롤 드래그와 구분 (12px 이내 + 600ms 이내)
  function onTap(el, fn) {
    var d = null;
    el.addEventListener('pointerdown', function (e) {
      d = { x: e.clientX, y: e.clientY, t: Date.now() };
    });
    el.addEventListener('pointerup', function (e) {
      if (!d) return;
      var dx = e.clientX - d.x, dy = e.clientY - d.y;
      var ok = Date.now() - d.t < 600 && dx * dx + dy * dy <= 144;
      d = null;
      if (ok) fn(e);
    });
  }

  // ── 색 유틸 ─────────────────────────────────────────────────
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function tint(h, f) { // 흰색과 섞기 (f = 원색 비율)
    var c = hexRGB(h);
    return 'rgb(' + c.map(function (v) { return Math.round(255 - (255 - v) * f); }).join(',') + ')';
  }
  function isLight(h) {
    var c = hexRGB(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) > 165;
  }

  // ── 사운드 ──────────────────────────────────────────────────
  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function beep(freq, dur, type, vol, when) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sndPop()   { beep(660, 0.09, 'triangle', 0.14); beep(990, 0.07, 'sine', 0.07, 0.02); }

  // ── SVG 빌드 ────────────────────────────────────────────────
  function makeShape(rg) {
    var el;
    if (rg.t === 'c') {
      el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', rg.cx); el.setAttribute('cy', rg.cy); el.setAttribute('r', rg.r);
    } else if (rg.t === 'e') {
      el = document.createElementNS(NS, 'ellipse');
      el.setAttribute('cx', rg.cx); el.setAttribute('cy', rg.cy);
      el.setAttribute('rx', rg.rx); el.setAttribute('ry', rg.ry);
      if (rg.rot) el.setAttribute('transform', 'rotate(' + rg.rot + ' ' + rg.cx + ' ' + rg.cy + ')');
    } else if (rg.t === 'r') {
      el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', rg.x); el.setAttribute('y', rg.y);
      el.setAttribute('width', rg.w); el.setAttribute('height', rg.h);
    } else {
      el = document.createElementNS(NS, 'path');
      el.setAttribute('d', rg.d);
    }
    return el;
  }

  function buildSVG(pic, filled, withLabels) {
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + pic.w + ' ' + pic.h);
    var defs = document.createElementNS(NS, 'defs');
    svg.appendChild(defs);
    var els = [], labels = [];
    pic.rg.forEach(function (rg, i) {
      var el = makeShape(rg);
      el.setAttribute('class', 'region');
      el.setAttribute('data-i', i);
      if (filled.has(i)) {
        el.classList.add('filled');
        el.style.fill = pic.pal[rg.c - 1];
      }
      svg.appendChild(el);
      els.push(el);
    });
    (pic.deco || []).forEach(function (d) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d.d);
      p.setAttribute('class', 'deco');
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', d.s);
      p.setAttribute('stroke-width', d.w);
      p.setAttribute('stroke-linecap', 'round');
      svg.appendChild(p);
    });
    if (withLabels) {
      pic.rg.forEach(function (rg, i) {
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'lbl');
        t.textContent = rg.c;
        if (filled.has(i)) t.style.display = 'none';
        svg.appendChild(t);
        labels.push(t);
      });
    }
    return { svg: svg, defs: defs, els: els, labels: labels };
  }

  // 라벨 위치/크기: DOM 부착 후 bbox 기준
  function placeLabels(pic, view) {
    pic.rg.forEach(function (rg, i) {
      var lbl = view.labels[i];
      var bb = view.els[i].getBBox();
      var fs = Math.max(11, Math.min(19, Math.sqrt(bb.width * bb.height) * 0.2));
      lbl.setAttribute('font-size', fs);
      lbl.setAttribute('x', rg.lx != null ? rg.lx : bb.x + bb.width / 2);
      lbl.setAttribute('y', (rg.ly != null ? rg.ly : bb.y + bb.height / 2) + fs * 0.36);
    });
  }

  // ── 상태 ────────────────────────────────────────────────────
  var cur = null; // { pic, filled:Set, view, sel, counts[] }
  var homeEl = document.getElementById('home');
  var playEl = document.getElementById('play');
  var gridEl = document.getElementById('grid');
  var artWrap = document.getElementById('art-wrap');
  var paletteEl = document.getElementById('palette');
  var pbarFill = document.getElementById('pbar-fill');
  var pctEl = document.getElementById('pct');
  var donePanel = null;

  function getFilledSet(pic) {
    return new Set((saveData[pic.id] || []).filter(function (i) { return i >= 0 && i < pic.rg.length; }));
  }

  // ── 홈 갤러리 ───────────────────────────────────────────────
  function renderHome() {
    gridEl.innerHTML = '';
    PICS.forEach(function (pic) {
      var filled = getFilledSet(pic);
      var card = document.createElement('div');
      card.className = 'card' + (filled.size === pic.rg.length ? ' done' : '');
      var th = document.createElement('div');
      th.className = 'thumb';
      th.appendChild(buildSVG(pic, filled, false).svg);
      card.appendChild(th);
      var nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = pic.name;
      card.appendChild(nm);
      var pg = document.createElement('div');
      pg.className = 'pg';
      pg.textContent = filled.size === pic.rg.length ? '✓ Done — tap to admire'
        : filled.size ? Math.round(filled.size / pic.rg.length * 100) + '% colored'
        : pic.rg.length + ' pieces';
      card.appendChild(pg);
      onTap(card, function () { openPic(pic); });
      gridEl.appendChild(card);
    });
  }

  // ── 플레이 ──────────────────────────────────────────────────
  function openPic(pic) {
    var filled = getFilledSet(pic);
    cur = { pic: pic, filled: filled, sel: -1, counts: [] };
    pic.pal.forEach(function (_, ci) {
      cur.counts[ci] = pic.rg.filter(function (rg, i) { return rg.c === ci + 1 && !filled.has(i); }).length;
    });

    document.getElementById('pic-name').textContent = pic.name;

    // 먼저 화면을 보이게 한 뒤 크기/라벨을 측정한다 (숨긴 채 getBBox는 0을 돌려줌)
    homeEl.classList.add('hidden');
    playEl.classList.remove('hidden');
    hideDonePanel();

    artWrap.innerHTML = '';
    var view = buildSVG(pic, filled, true);
    cur.view = view;
    artWrap.appendChild(view.svg);
    sizeArt();
    placeLabels(pic, view);

    view.svg.addEventListener('pointerdown', onArtDown);
    view.svg.addEventListener('pointerup', onArtUp);

    buildPalette();
    // 첫 미완성 색 자동 선택
    var first = cur.counts.findIndex(function (n) { return n > 0; });
    selectColor(first >= 0 ? first : 0);
    updateProgress();
    if (filled.size === pic.rg.length) showDonePanel(false);
  }

  function sizeArt() {
    if (!cur) return;
    var availW = Math.min(window.innerWidth - 20, 520);
    var availH = artWrap.clientHeight - 8 || (window.innerHeight - 170);
    var s = Math.min(availW / cur.pic.w, availH / cur.pic.h);
    cur.view.svg.setAttribute('width', Math.floor(cur.pic.w * s));
    cur.view.svg.setAttribute('height', Math.floor(cur.pic.h * s));
  }
  window.addEventListener('resize', function () { setTimeout(sizeArt, 60); });

  function buildPalette() {
    paletteEl.innerHTML = '';
    cur.pic.pal.forEach(function (hex, ci) {
      var b = document.createElement('button');
      b.className = 'sw';
      b.style.background = hex;
      b.style.color = isLight(hex) ? '#3d4351' : '#fff';
      b.textContent = ci + 1;
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      b.appendChild(cnt);
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        selectColor(ci);
        sndTick();
      });
      paletteEl.appendChild(b);
    });
    refreshPalette();
  }
  function sndTick() { beep(520, 0.05, 'sine', 0.06); }

  function refreshPalette() {
    var sws = paletteEl.children;
    cur.pic.pal.forEach(function (_, ci) {
      var b = sws[ci];
      var left = cur.counts[ci];
      b.classList.toggle('sel', ci === cur.sel);
      b.classList.toggle('done', left === 0);
      var cnt = b.querySelector('.cnt');
      if (left === 0) {
        b.childNodes[0].textContent = '✓';
        cnt.style.display = 'none';
      } else {
        b.childNodes[0].textContent = ci + 1;
        cnt.style.display = '';
        cnt.textContent = left;
      }
    });
  }

  function selectColor(ci) {
    if (!cur) return;
    cur.sel = ci;
    var hex = cur.pic.pal[ci];
    cur.pic.rg.forEach(function (rg, i) {
      var el = cur.view.els[i];
      var lbl = cur.view.labels[i];
      var on = rg.c === ci + 1 && !cur.filled.has(i);
      el.classList.toggle('hl', on);
      if (on) el.style.setProperty('--tint', tint(hex, 0.38));
      if (lbl) lbl.classList.toggle('on', on);
    });
    refreshPalette();
    // 선택 스와치 보이게 스크롤
    var sw = paletteEl.children[ci];
    if (sw && sw.scrollIntoView) sw.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  // 탭 판정: 드래그(완충지대 스크롤)와 구분
  var downPt = null;
  function onArtDown(e) {
    downPt = { x: e.clientX, y: e.clientY, t: Date.now() };
  }
  function onArtUp(e) {
    if (!downPt) return;
    var dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    var quick = Date.now() - downPt.t < 600;
    downPt = null;
    if (!quick || dx * dx + dy * dy > 144) return; // 12px 이상 움직이면 스크롤로 간주
    var t = e.target.closest ? e.target.closest('[data-i]') : null;
    if (!t) return;
    tapRegion(parseInt(t.getAttribute('data-i'), 10), e);
  }

  function tapRegion(i, e) {
    if (!cur || cur.filled.has(i)) return;
    var rg = cur.pic.rg[i];
    if (rg.c !== cur.sel + 1) {
      // 다른 번호: 숫자를 크게 깜빡여 힌트
      var lbl = cur.view.labels[i];
      var el = cur.view.els[i];
      lbl.classList.remove('flash'); void lbl.getBoundingClientRect(); lbl.classList.add('flash');
      el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake');
      setTimeout(function () { lbl.classList.remove('flash'); el.classList.remove('shake'); }, 520);
      sndWrong();
      return;
    }
    fillRegion(i, e);
  }

  function fillRegion(i, e) {
    var pic = cur.pic, rg = pic.rg[i];
    var hex = pic.pal[rg.c - 1];
    var el = cur.view.els[i];
    var lbl = cur.view.labels[i];

    cur.filled.add(i);
    saveData[pic.id] = Array.from(cur.filled);
    persist();
    cur.counts[cur.sel]--;

    // 리플(물감 퍼짐) 애니메이션
    var bb = el.getBBox();
    var pt = { x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 };
    if (e) {
      var svgPt = cur.view.svg.createSVGPoint();
      svgPt.x = e.clientX; svgPt.y = e.clientY;
      var m = cur.view.svg.getScreenCTM();
      if (m) { var p2 = svgPt.matrixTransform(m.inverse()); pt = { x: p2.x, y: p2.y }; }
    }
    var clipId = 'cb-clip-' + i + '-' + Date.now();
    var clip = document.createElementNS(NS, 'clipPath');
    clip.setAttribute('id', clipId);
    var shape = makeShape(rg);
    clip.appendChild(shape);
    cur.view.defs.appendChild(clip);
    var rip = document.createElementNS(NS, 'circle');
    rip.setAttribute('cx', pt.x); rip.setAttribute('cy', pt.y); rip.setAttribute('r', 0);
    rip.setAttribute('fill', hex);
    rip.setAttribute('clip-path', 'url(#' + clipId + ')');
    rip.setAttribute('pointer-events', 'none');
    el.parentNode.insertBefore(rip, el.nextSibling);
    var corners = [
      [bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]
    ];
    var maxR = 0;
    corners.forEach(function (c) {
      maxR = Math.max(maxR, Math.hypot(c[0] - pt.x, c[1] - pt.y));
    });
    var t0 = performance.now(), dur = 260;
    (function step(now) {
      var k = Math.min(1, Math.max(0, (now - t0) / dur));
      rip.setAttribute('r', maxR * (1 - Math.pow(1 - k, 2)));
      if (k < 1) { requestAnimationFrame(step); return; }
      el.classList.add('filled');
      el.classList.remove('hl');
      el.style.fill = hex;
      rip.remove(); clip.remove();
    })(t0);

    el.classList.remove('hl');
    lbl.style.display = 'none';
    sndPop(); buzz(8);
    updateProgress();

    if (cur.counts[cur.sel] === 0) {
      refreshPalette();
      if (cur.filled.size === pic.rg.length) {
        setTimeout(showComplete, 420);
      } else {
        // 다음 미완성 색으로 자동 이동
        var n = pic.pal.length;
        for (var k2 = 1; k2 <= n; k2++) {
          var ci = (cur.sel + k2) % n;
          if (cur.counts[ci] > 0) { sndColor(); setTimeout(function () { selectColor(ci); }, 240); break; }
        }
      }
    } else {
      refreshPalette();
    }
  }

  function updateProgress() {
    var p = Math.round(cur.filled.size / cur.pic.rg.length * 100);
    pbarFill.style.width = p + '%';
    pctEl.textContent = p + '%';
  }

  // ── 완성 ────────────────────────────────────────────────────
  function showComplete() {
    sndDone(); buzz([30, 40, 30]);
    confettiBurst();
    showDonePanel(true);
  }

  function showDonePanel(fresh) {
    hideDonePanel();
    donePanel = document.createElement('div');
    donePanel.id = 'done-panel';
    donePanel.innerHTML =
      '<h2>' + (fresh ? '🎉 Beautiful!' : '⭐ All done!') + '</h2>' +
      '<p>' + cur.pic.name + ' is complete</p>' +
      '<div class="row"><button id="btn-again">Color again</button><button id="btn-gallery">Gallery</button></div>';
    document.body.appendChild(donePanel);
    onTap(donePanel.querySelector('#btn-gallery'), goHome);
    onTap(donePanel.querySelector('#btn-again'), function () {
      delete saveData[cur.pic.id];
      persist();
      var pic = cur.pic;
      hideDonePanel();
      openPic(pic);
    });
  }
  function hideDonePanel() {
    if (donePanel) { donePanel.remove(); donePanel = null; }
  }

  function goHome() {
    hideDonePanel();
    cur = null;
    playEl.classList.add('hidden');
    homeEl.classList.remove('hidden');
    renderHome();
  }
  onTap(document.getElementById('btn-back'), goHome);

  // ── 컨페티 ──────────────────────────────────────────────────
  var cvs = document.getElementById('confetti');
  var ctx = cvs.getContext('2d');
  var parts = [], confOn = false;
  function confettiBurst() {
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    var colors = ['#ffc94d', '#f58fb0', '#7fc46a', '#74b8e8', '#f0715c', '#9b7ede'];
    for (var i = 0; i < 120; i++) {
      parts.push({
        x: Math.random() * cvs.width,
        y: -20 - Math.random() * cvs.height * 0.5,
        vy: 130 + Math.random() * 180,
        vx: (Math.random() - 0.5) * 60,
        s: 5 + Math.random() * 6,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 6,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!confOn) { confOn = true; requestAnimationFrame(confStep); }
  }
  var confLast = 0;
  function confStep(now) {
    var dt = confLast ? Math.min((now - confLast) / 1000, 0.05) : 0.016;
    confLast = now;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    parts = parts.filter(function (p) { return p.y < cvs.height + 30; });
    parts.forEach(function (p) {
      p.y += p.vy * dt; p.x += p.vx * dt; p.r += p.vr * dt;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (parts.length) { requestAnimationFrame(confStep); }
    else { confOn = false; confLast = 0; ctx.clearRect(0, 0, cvs.width, cvs.height); }
  }

  // ── 인앱 브라우저 시트 닫힘 방지: 스크롤을 완충지대 중간에 걸어 둔다 ──
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  renderHome();

  // 헤드리스 테스트용 훅 (해시에 debug가 있을 때만)
  if ((location.hash || '').indexOf('debug') >= 0) {
    window.__app = {
      PICS: PICS,
      get cur() { return cur; },
      open: function (id) { openPic(PICS.find(function (p) { return p.id === id; })); },
      select: selectColor,
      tap: function (i) { tapRegion(i, null); },
      fillAll: function () {
        var pic = cur.pic;
        pic.rg.forEach(function (rg, i) {
          if (cur.filled.has(i)) return;
          selectColor(rg.c - 1);
          tapRegion(i, null);
        });
      },
      home: goHome
    };
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cozy Coloring</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #f6f1e7;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #3d4351;
  }
  #app {
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ── Home (gallery) — Modernist: 헤어라인 그리드, 빨간 포인트, 종이 배경 ── */
  #home { background: #f4f1e9; color: #1c1a16; }
  #home-head { padding: max(16px, env(safe-area-inset-top)) 18px 12px; }
  #kicker {
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    color: #d6391b; text-transform: uppercase;
  }
  #home-head h1 { font-size: 34px; font-weight: 900; letter-spacing: -1px; margin-top: 2px; }

  #cont-row {
    display: flex; align-items: center; gap: 12px;
    margin: 0 18px; padding: 12px 0;
    border-top: 1px solid #1c1a16; border-bottom: 1px solid #ddd7c9;
  }
  #cont-row .cthumb {
    width: 56px; height: 62px; flex: none;
    border: 1px solid #ddd7c9; background: #fdfcf9; padding: 2px;
  }
  #cont-row .cthumb svg { display: block; width: 100%; height: 100%; }
  #cont-row .cmid { flex: 1; min-width: 0; }
  #cont-row .clabel { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #d6391b; }
  #cont-row .cname { font-size: 16px; font-weight: 800; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cont-row .ctrack { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  #cont-row .cbar { flex: 1; height: 2px; background: #ddd7c9; position: relative; }
  #cont-row .cbar i { position: absolute; left: 0; top: -0.5px; height: 3px; background: #d6391b; }
  #cont-row .cpct { font-size: 12px; font-weight: 700; color: #7d7568; }
  #btn-resume {
    flex: none; border: none; border-radius: 0;
    background: #d6391b; color: #fff;
    font-size: 14px; font-weight: 800;
    padding: 12px 18px;
  }
  #btn-resume:active { background: #b32d12; }

  #filter {
    display: flex; align-items: center;
    margin: 12px 18px 0; gap: 0;
  }
  #filter button {
    border: 1px solid #ddd7c9; border-left: none; border-radius: 0;
    background: #fdfcf9; color: #1c1a16;
    font-size: 13px; font-weight: 700;
    padding: 8px 14px;
  }
  #filter button:first-child { border-left: 1px solid #ddd7c9; }
  #filter button.sel { background: #d6391b; border-color: #d6391b; color: #fff; }

  #grid {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    align-content: start;
    background: #ddd7c9;
    border-top: 1px solid #ddd7c9; border-bottom: 1px solid #ddd7c9;
    margin: 12px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .card {
    background: #fdfcf9;
    padding: 10px 10px 12px;
    position: relative;
    cursor: pointer;
  }
  .card:active { background: #f6f2e8; }
  .card .thumb { border: 1px solid #e4dfd2; background: #fff; padding: 3px; }
  .card .thumb svg { display: block; width: 100%; height: auto; }
  .card .crow { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .card .nm { font-size: 14px; font-weight: 800; flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .chip {
    flex: none; font-size: 10px; font-weight: 800; color: #d6391b;
    background: #fbeae4; border: 1px solid #f0cec2;
    padding: 2px 7px 3px;
  }
  .card .meta { font-size: 11.5px; color: #8a8172; margin-top: 3px; text-align: left; }
  .card .pgline { position: absolute; left: 0; bottom: 0; height: 3px; background: #d6391b; }
  .empty {
    grid-column: 1 / -1; background: #fdfcf9;
    padding: 36px 0; text-align: center;
    font-size: 13px; color: #8a8172;
  }

  /* ── Play screen ── */
  #play { background: #fdf9f0; }
  #play-head {
    display: flex; align-items: center; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 12px 8px;
  }
  #btn-back {
    width: 40px; height: 40px; border: none; border-radius: 12px;
    background: #fff; box-shadow: 0 2px 8px rgba(90,70,40,0.12);
    font-size: 20px; color: #3d4351; flex: none;
  }
  #btn-back:active { transform: scale(0.94); }
  #head-mid { flex: 1; min-width: 0; }
  #pic-name { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pbar { height: 7px; background: #ece5d6; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #pbar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fc46a, #ffc94d); border-radius: 4px; transition: width 0.25s ease; }
  #pct { font-size: 14px; font-weight: 800; color: #8b8fa0; min-width: 44px; text-align: right; flex: none; }

  #art-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 4px 10px; }
  #art-wrap svg { display: block; background: #fff; border-radius: 16px; box-shadow: 0 4px 18px rgba(90,70,40,0.12); }

  .region { stroke: #ccd3da; stroke-width: 1.4; fill: #fff; }
  .region.filled { stroke: none; }
  .region.hl { animation: hlp 1.3s ease-in-out infinite; }
  @keyframes hlp { 0%, 100% { fill: #fff; } 50% { fill: var(--tint); } }
  .region.shake { animation: shk 0.35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes shk { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .lbl {
    fill: #98a2b3; font-weight: 700; text-anchor: middle;
    pointer-events: none; font-family: -apple-system, Arial, sans-serif;
  }
  .lbl.on { fill: #4a5468; }
  .lbl.flash { animation: lfl 0.5s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes lfl { 0%,100% { transform: scale(1); } 40% { transform: scale(1.9); } }
  .deco { pointer-events: none; }

  /* ── Palette ── */
  #palette {
    flex: none;
    display: flex; gap: 10px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #palette::-webkit-scrollbar { display: none; }
  .sw {
    flex: none;
    width: 52px; height: 52px; border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(90,70,40,0.18), inset 0 -2px 4px rgba(0,0,0,0.08);
    position: relative;
    transition: transform 0.15s ease;
  }
  .sw.sel { transform: scale(1.16); outline: 3.5px solid #3d4351; outline-offset: 2.5px; }
  .sw.done { opacity: 0.45; box-shadow: none; }
  .sw .cnt {
    position: absolute; right: -3px; top: -3px;
    min-width: 19px; height: 19px; padding: 0 4px;
    border-radius: 10px; background: #3d4351; color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Completion ── */
  #done-panel {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(330px, 88vw);
    background: rgba(46, 38, 24, 0.95); color: #fff;
    border-radius: 18px; padding: 16px 16px 14px; text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  @keyframes rise { from { transform: translateX(-50%) translateY(60px); opacity: 0; } }
  #done-panel h2 { font-size: 22px; font-weight: 800; }
  #done-panel p { font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 3px; }
  #done-panel .row { display: flex; gap: 10px; margin-top: 13px; }
  #done-panel button {
    flex: 1; border: none; border-radius: 12px; padding: 12px 0;
    font-size: 15px; font-weight: 800;
  }
  #btn-gallery { background: #ffc94d; color: #3a2c10; }
  #btn-again { background: rgba(255,255,255,0.14); color: #fff; }
  #done-panel button:active { transform: scale(0.96); }
  #confetti { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <!-- Home / gallery -->
  <div class="screen" id="home">
    <div id="home-head">
      <div id="kicker"></div>
      <h1>Cozy Coloring</h1>
    </div>
    <div id="cont-row" class="hidden"></div>
    <div id="filter"></div>
    <div id="grid"></div>
  </div>

  <!-- Coloring screen -->
  <div class="screen hidden" id="play">
    <div id="play-head">
      <button id="btn-back">←</button>
      <div id="head-mid">
        <div id="pic-name"></div>
        <div id="pbar"><div id="pbar-fill"></div></div>
      </div>
      <div id="pct">0%</div>
    </div>
    <div id="art-wrap"></div>
    <div id="palette"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';

  // ── 그림 데이터 ─────────────────────────────────────────────
  // t: c=circle e=ellipse r=rect p=path / c: 팔레트 색 번호(1-base)
  // lx,ly: 숫자 라벨 위치 강제(겹침 회피용), rot: 회전(중심 기준)
  function C(cx, cy, r, c, o)      { return Object.assign({ t: 'c', cx: cx, cy: cy, r: r, c: c }, o); }
  function E(cx, cy, rx, ry, c, o) { return Object.assign({ t: 'e', cx: cx, cy: cy, rx: rx, ry: ry, c: c }, o); }
  function R(x, y, w, h, c, o)     { return Object.assign({ t: 'r', x: x, y: y, w: w, h: h, c: c }, o); }
  function P(d, c, o)              { return Object.assign({ t: 'p', d: d, c: c }, o); }

  // ── 조각 생성기 ─────────────────────────────────────────────
  function rad(a) { return a * Math.PI / 180; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 지터를 준 격자 모자이크 — 시드 고정이라 로드마다 같은 조각(저장 인덱스 안정)
  function mosaic(x0, y0, x1, y1, nx, ny, shades, seed, opt) {
    opt = opt || {};
    var r = rng(seed), pts = [], i, j;
    for (j = 0; j <= ny; j++) {
      pts.push([]);
      for (i = 0; i <= nx; i++) {
        var px = x0 + (x1 - x0) * i / nx, py = y0 + (y1 - y0) * j / ny;
        if (i > 0 && i < nx) px += (r() - 0.5) * (x1 - x0) / nx * 0.5;
        if (j > 0 && j < ny) py += (r() - 0.5) * (y1 - y0) / ny * 0.5;
        pts[j].push([Math.round(px * 10) / 10, Math.round(py * 10) / 10]);
      }
    }
    var out = [];
    for (j = 0; j < ny; j++) {
      for (i = 0; i < nx; i++) {
        var pick;
        if (opt.rows) {
          var rj = j;
          if (r() < 0.25) rj = Math.min(opt.rows.length - 1, Math.max(0, j + (r() < 0.5 ? -1 : 1)));
          pick = opt.rows[rj];
        } else {
          pick = shades[(i + 2 * j + ((r() * 2) | 0)) % shades.length];
        }
        var ccx = x0 + (x1 - x0) * (i + 0.5) / nx, ccy = y0 + (y1 - y0) * (j + 0.5) / ny;
        if (opt.skip && opt.skip(ccx, ccy)) continue;
        var a = pts[j][i], b = pts[j][i + 1], c2 = pts[j + 1][i + 1], d2 = pts[j + 1][i];
        out.push(P('M' + a + ' L' + b + ' L' + c2 + ' L' + d2 + ' Z', pick));
      }
    }
    return out;
  }

  // 중심을 도는 꽃잎 링 (긴 축이 바깥을 향하게 회전)
  function ringPetals(cx, cy, n, dist, rx, ry, c, rot0) {
    var out = [];
    for (var k = 0; k < n; k++) {
      var a = (rot0 || 0) + k * 360 / n;
      var px = Math.round((cx + dist * Math.cos(rad(a))) * 10) / 10;
      var py = Math.round((cy + dist * Math.sin(rad(a))) * 10) / 10;
      out.push(E(px, py, rx, ry, c, { rot: Math.round(a + 90) }));
    }
    return out;
  }

  // 도넛 조각 (무지개 띠)
  function arcBand(cx, cy, r0, r1, a0, a1, c, o) {
    function pt(a, r) {
      return (cx + r * Math.cos(rad(a))).toFixed(1) + ',' + (cy + r * Math.sin(rad(a))).toFixed(1);
    }
    var la = (a1 - a0) > 180 ? 1 : 0;
    return P('M' + pt(a0, r1) + ' A' + r1 + ',' + r1 + ' 0 ' + la + ',1 ' + pt(a1, r1) +
      ' L' + pt(a1, r0) + ' A' + r0 + ',' + r0 + ' 0 ' + la + ',0 ' + pt(a0, r0) + ' Z', c, o);
  }

  // 열기구 세로 고어(줄무늬) — 위/아래 극점에서 만나는 볼록 곡선 조각
  function gores(cx, ty, by, xs, cols) {
    var out = [], y1 = ty + (by - ty) * 0.18, y2 = by - (by - ty) * 0.18;
    for (var i = 0; i < xs.length - 1; i++) {
      var xa = Math.round((cx + 1.34 * xs[i]) * 10) / 10;
      var xb = Math.round((cx + 1.34 * xs[i + 1]) * 10) / 10;
      out.push(P('M' + cx + ',' + ty +
        ' C' + xa + ',' + y1 + ' ' + xa + ',' + y2 + ' ' + cx + ',' + by +
        ' C' + xb + ',' + y2 + ' ' + xb + ',' + y1 + ' ' + cx + ',' + ty + ' Z',
        cols[i % cols.length],
        { lx: cx + (xs[i] + xs[i + 1]) / 2, ly: (ty + by) / 2 }));
    }
    return out;
  }

  // 뭉게구름 블롭
  function cloud(cx, cy, c, s) {
    s = s || 1;
    var q = [[-42, 14], [-44, -8], [-22, -12], [-16, -30], [6, -28], [28, -32], [34, -14],
      [54, -12], [52, 4], [50, 16], [32, 16], [-30, 16], [-42, 16]];
    function p(k) { return (cx + q[k][0] * s) + ',' + (cy + q[k][1] * s); }
    return P('M' + p(0) + ' Q' + p(1) + ' ' + p(2) + ' Q' + p(3) + ' ' + p(4) +
      ' Q' + p(5) + ' ' + p(6) + ' Q' + p(7) + ' ' + p(8) + ' Q' + p(9) + ' ' + p(10) +
      ' L' + p(11) + ' Q' + p(12) + ' ' + p(0) + ' Z', c);
  }

  // 햇살 (부채꼴 삼각형들)
  function rays(cx, cy, r0, r1, as, hw, c) {
    return as.map(function (a) {
      function pt(ang, r) {
        return (cx + r * Math.cos(rad(ang))).toFixed(1) + ',' + (cy + r * Math.sin(rad(ang))).toFixed(1);
      }
      return P('M' + pt(a - hw, r0) + ' L' + pt(a, r1) + ' L' + pt(a + hw, r0) + ' Z', c);
    });
  }

  var PICS = [
    {
      id: 'peacock', name: 'Royal Peacock', w: 360, h: 440,
      pal: ['#F7EFDD', '#EFE3C8', '#FCF7EA', '#1E6B58', '#2F9270', '#37A08C', '#FFD35C',
        '#8FD07C', '#2C6FBF', '#5FA8DC', '#FFA94D', '#8F6A4F', '#F2A0C4'],
      rg: [].concat(
        mosaic(0, 0, 360, 440, 4, 5, [1, 2, 3], 51, {
          // 꼬리 원판(r150)에 완전히 덮이는 칸만 건너뛴다
          skip: function (cx, cy) {
            var hw = 45, hh = 44, r2 = 150 * 150;
            for (var sx = -1; sx <= 1; sx += 2) for (var sy = -1; sy <= 1; sy += 2) {
              var dx = cx + sx * hw - 180, dy = cy + sy * hh - 205;
              if (dx * dx + dy * dy > r2) return false;
            }
            return true;
          }
        }),
        // 바깥 금색 점 12개 (원판 밖 장식 링)
        [
          C(28, 260, 9, 7), C(18, 205, 9, 7), C(28, 150, 9, 7), C(56, 101, 9, 7),
          C(99, 65, 9, 7), C(152, 45, 9, 7), C(208, 45, 9, 7), C(261, 65, 9, 7),
          C(304, 101, 9, 7), C(332, 150, 9, 7), C(342, 205, 9, 7), C(332, 260, 9, 7)
        ],
        // 꼬리 원판 + 깃털 링들 (바깥→안쪽)
        [C(180, 205, 150, 4, { lx: 206, ly: 108 })],
        ringPetals(180, 205, 16, 145, 8, 22, 8, -90),
        ringPetals(180, 205, 12, 118, 20, 34, 5, -90),
        ringPetals(180, 205, 12, 118, 15, 15, 9, -90),
        ringPetals(180, 205, 12, 118, 8, 8, 7, -90),
        ringPetals(180, 205, 10, 78, 16, 26, 6, -90),
        ringPetals(180, 205, 10, 78, 9, 9, 7, -90),
        // 안쪽 주황 점 6개 (몸통을 피해서 위쪽 호에만)
        [
          C(128, 205, 9, 11), C(135, 179, 9, 11), C(154, 160, 9, 11),
          C(206, 160, 9, 11), C(225, 179, 9, 11), C(232, 205, 9, 11)
        ],
        // 몸통 (목 → 몸통 → 가슴 → 날개 → 머리 → 부리 → 볏)
        [E(180, 192, 13, 28, 10)],
        [E(180, 236, 28, 46, 9)],
        [C(180, 238, 16, 10)],
        [E(158, 242, 10, 22, 10, { rot: 25 }), E(202, 242, 10, 22, 10, { rot: -25 })],
        [C(180, 160, 16, 9)],
        [P('M172,172 L188,172 L180,184 Z', 11)],
        [C(166, 136, 8, 7), C(180, 128, 8, 7), C(194, 136, 8, 7)],
        // 나뭇가지 + 잎 + 열매
        [P('M0,364 Q90,352 180,362 Q270,370 360,358 L360,396 Q270,406 180,398 Q90,390 0,400 Z', 12)],
        [
          E(55, 370, 10, 18, 5, { rot: 60 }), E(105, 380, 10, 18, 8, { rot: -60 }),
          E(150, 360, 10, 18, 5, { rot: 55 }), E(210, 382, 10, 18, 8, { rot: -55 }),
          E(255, 368, 10, 18, 5, { rot: 60 }), E(305, 376, 10, 18, 8, { rot: -60 })
        ],
        [C(80, 388, 9, 11), C(180, 378, 9, 11), C(280, 390, 9, 11)],
        // 네 모서리 꽃
        ringPetals(34, 44, 5, 16, 9, 14, 13, -90), [C(34, 44, 9, 7)],
        ringPetals(326, 44, 5, 16, 9, 14, 13, -90), [C(326, 44, 9, 7)],
        ringPetals(30, 414, 5, 16, 9, 14, 13, -90), [C(30, 414, 9, 7)],
        ringPetals(330, 414, 5, 16, 9, 14, 13, -90), [C(330, 414, 9, 7)]
      ),
      deco: [
        { d: 'M172,280 L168,362', s: '#8F6A4F', w: 3 },
        { d: 'M188,280 L192,362', s: '#8F6A4F', w: 3 },
        { d: 'M166,144 L162,138', s: '#2C6FBF', w: 2 },
        { d: 'M180,144 L180,136', s: '#2C6FBF', w: 2 },

  // ── 저장 ────────────────────────────────────────────────────
  var SAVE_KEY = 'coloringbook-v2';
  function loadSave() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; }
  }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {}
  }
  var saveData = loadSave();

  // 탭 판정 헬퍼: 완충지대 스크롤 드래그와 구분 (12px 이내 + 600ms 이내)
  function onTap(el, fn) {
    var d = null;
    el.addEventListener('pointerdown', function (e) {
      d = { x: e.clientX, y: e.clientY, t: Date.now() };
    });
    el.addEventListener('pointerup', function (e) {
      if (!d) return;
      var dx = e.clientX - d.x, dy = e.clientY - d.y;
      var ok = Date.now() - d.t < 600 && dx * dx + dy * dy <= 144;
      d = null;
      if (ok) fn(e);
    });
  }

  // ── 색 유틸 ─────────────────────────────────────────────────
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function tint(h, f) { // 흰색과 섞기 (f = 원색 비율)
    var c = hexRGB(h);
    return 'rgb(' + c.map(function (v) { return Math.round(255 - (255 - v) * f); }).join(',') + ')';
  }
  function isLight(h) {
    var c = hexRGB(h);
    return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) > 165;
  }

  // ── 사운드 ──────────────────────────────────────────────────
  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function beep(freq, dur, type, vol, when) {
    var a = ac(); if (!a) return;
    var t = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sndPop()   { beep(660, 0.09, 'triangle', 0.14); beep(990, 0.07, 'sine', 0.07, 0.02); }
  function sndWrong() { beep(190, 0.12, 'sine', 0.10); }
  function sndColor() { beep(587, 0.1, 'triangle', 0.12); beep(880, 0.14, 'triangle', 0.12, 0.09); }
  function sndDone()  { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, 0.22, 'triangle', 0.13, i * 0.13); }); }
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ── SVG 빌드 ────────────────────────────────────────────────
  function makeShape(rg) {
    var el;
    if (rg.t === 'c') {
      el = document.createElementNS(NS, 'circle');
      el.setAttribute('cx', rg.cx); el.setAttribute('cy', rg.cy); el.setAttribute('r', rg.r);
    } else if (rg.t === 'e') {
      el = document.createElementNS(NS, 'ellipse');
      el.setAttribute('cx', rg.cx); el.setAttribute('cy', rg.cy);
      el.setAttribute('rx', rg.rx); el.setAttribute('ry', rg.ry);
      if (rg.rot) el.setAttribute('transform', 'rotate(' + rg.rot + ' ' + rg.cx + ' ' + rg.cy + ')');
    } else if (rg.t === 'r') {
      el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', rg.x); el.setAttribute('y', rg.y);
      el.setAttribute('width', rg.w); el.setAttribute('height', rg.h);
    } else {
      el = document.createElementNS(NS, 'path');
      el.setAttribute('d', rg.d);
    }
    return el;
  }

  // filled: Set(index) / withLabels: 플레이 화면용 숫자 표시
  function buildSVG(pic, filled, withLabels) {
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + pic.w + ' ' + pic.h);
    var defs = document.createElementNS(NS, 'defs');
    svg.appendChild(defs);
    var els = [], labels = [];
    pic.rg.forEach(function (rg, i) {
      var el = makeShape(rg);
      el.setAttribute('class', 'region');
      el.setAttribute('data-i', i);
      if (filled.has(i)) {
        el.classList.add('filled');
        el.style.fill = pic.pal[rg.c - 1];
      }
      svg.appendChild(el);
      els.push(el);
    });
    (pic.deco || []).forEach(function (d) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d.d);
      p.setAttribute('class', 'deco');
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', d.s);
      p.setAttribute('stroke-width', d.w);
      p.setAttribute('stroke-linecap', 'round');
      svg.appendChild(p);
    });
    if (withLabels) {
      pic.rg.forEach(function (rg, i) {
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'lbl');
        t.textContent = rg.c;
        if (filled.has(i)) t.style.display = 'none';
        svg.appendChild(t);
        labels.push(t);
      });
    }
    return { svg: svg, defs: defs, els: els, labels: labels };
  }

  // 라벨 위치/크기: DOM 부착 후 bbox 기준.
  // 겹겹이 쌓인 조각에서 기본 위치(중심)가 나중에 그려진 조각에 가려지면
  // 조각 안의 보이는 지점을 격자 탐색으로 찾아 옮긴다.
  function placeLabels(pic, view) {
    var els = view.els;
    var bbs = els.map(function (el, i) {
      var bb = el.getBBox();
      var rg = pic.rg[i];
      if (rg.rot) {
        // getBBox는 회전 전 로컬 박스 — 회전 타원은 max(rx,ry) 정사각으로 보정
        var m = Math.max(rg.rx, rg.ry);
        return { x: rg.cx - m, y: rg.cy - m, width: 2 * m, height: 2 * m };
      }
      return bb;
    });

    function inFill(idx, x, y) {
      var rg = pic.rg[idx];
      try {
        if (rg.rot) { // 회전 타원: 점을 역회전시켜 로컬 좌표로
          var a = -rg.rot * Math.PI / 180, dx = x - rg.cx, dy = y - rg.cy;
          x = rg.cx + dx * Math.cos(a) - dy * Math.sin(a);
          y = rg.cy + dx * Math.sin(a) + dy * Math.cos(a);
        }
        var p = view.svg.createSVGPoint();
        p.x = x; p.y = y;
        return els[idx].isPointInFill(p);
      } catch (e) { return true; } // 미지원 브라우저: 기본 위치 유지
    }
    function visibleAt(i, x, y) {
      if (!inFill(i, x, y)) return false;
      for (var j = i + 1; j < els.length; j++) {
        var b = bbs[j];
        if (x < b.x || x > b.x + b.width || y < b.y || y > b.y + b.height) continue;
        if (inFill(j, x, y)) return false;
      }
      return true;
    }

    pic.rg.forEach(function (rg, i) {
      var lbl = view.labels[i];
      var bb = bbs[i];
      var fs = Math.max(11, Math.min(19, Math.sqrt(bb.width * bb.height) * 0.2));
      var x = rg.lx != null ? rg.lx : bb.x + bb.width / 2;
      var y = rg.ly != null ? rg.ly : bb.y + bb.height / 2;
      if (rg.lx == null && !visibleAt(i, x, y)) {
        var cands = [], N = 6;
        for (var gy = 1; gy <= N; gy++) {
          for (var gx = 1; gx <= N; gx++) {
            cands.push([bb.x + bb.width * gx / (N + 1), bb.y + bb.height * gy / (N + 1)]);
          }
        }
        var cx0 = x, cy0 = y;
        cands.sort(function (a, b) {
          return (Math.pow(a[0] - cx0, 2) + Math.pow(a[1] - cy0, 2)) -
                 (Math.pow(b[0] - cx0, 2) + Math.pow(b[1] - cy0, 2));
        });
        var found = null;
        for (var k = 0; k < cands.length; k++) {
          if (visibleAt(i, cands[k][0], cands[k][1])) { found = cands[k]; break; }
        }
        if (found) {
          x = found[0]; y = found[1];
          fs = Math.min(fs, 13); // 옮긴 라벨은 좁은 틈일 수 있으니 작게
        } else {
          console.error('coloring: label hidden for ' + pic.id + ' region ' + i);
        }
      }
      lbl.setAttribute('font-size', fs);
      lbl.setAttribute('x', x);
      lbl.setAttribute('y', y + fs * 0.36);
    });
  }

  var filterEl = document.getElementById('filter');
  var homeFilter = 'all'; // all | prog | done
  document.getElementById('kicker').textContent = 'Gallery \u00b7 ' + PICS.length + ' Pictures';

  function diffOf(pic) {
    var n = pic.rg.length;
    return n >= 120 ? 'Hard' : n >= 60 ? 'Medium' : 'Easy';
  }
  function lastOf(id) { return (saveData._last || {})[id] || 0; }

  function renderHome() {
    // 이어하기 행: 진행 중(0 < 채움 < 전체) 그림 중 최근에 칠한 것
    var cont = null;
    PICS.forEach(function (pic) {
      var n = getFilledSet(pic).size;
      if (n > 0 && n < pic.rg.length && (!cont || lastOf(pic.id) > lastOf(cont.id))) cont = pic;
    });
    contEl.innerHTML = '';
    contEl.classList.toggle('hidden', !cont);
    if (cont) {
      var cf = getFilledSet(cont);
      var pctv = Math.round(cf.size / cont.rg.length * 100);
      var th = document.createElement('div');
      th.className = 'cthumb';
      th.appendChild(buildSVG(cont, cf, false).svg);
      contEl.appendChild(th);
      var mid = document.createElement('div');
      mid.className = 'cmid';
      mid.innerHTML = '<div class="clabel">CONTINUE</div><div class="cname"></div>' +
        '<div class="ctrack"><div class="cbar"><i style="width:' + pctv + '%"></i></div>' +
        '<span class="cpct">' + pctv + '%</span></div>';
      mid.querySelector('.cname').textContent = cont.name;
      contEl.appendChild(mid);
      var rb = document.createElement('button');
      rb.id = 'btn-resume';
      rb.textContent = 'Resume';
      contEl.appendChild(rb);
      var openCont = function () { openPic(cont); };
      onTap(rb, openCont);
      onTap(th, openCont);
      onTap(mid, openCont);
    }

    // 필터 세그먼트
    filterEl.innerHTML = '';
    [['all', 'All'], ['prog', 'In progress'], ['done', 'Done']].forEach(function (f) {
      var b = document.createElement('button');
      b.textContent = f[1];
      b.classList.toggle('sel', homeFilter === f[0]);
      onTap(b, function () { homeFilter = f[0]; renderHome(); });
      filterEl.appendChild(b);
    });

    // 카드 그리드
    gridEl.innerHTML = '';
    var shown = 0;
    PICS.forEach(function (pic) {
      var filled = getFilledSet(pic);
      var n = filled.size, total = pic.rg.length;
      var isDone = n === total, inProg = n > 0 && !isDone;
      if (homeFilter === 'prog' && !inProg) return;
      if (homeFilter === 'done' && !isDone) return;
      shown++;
      var card = document.createElement('div');
      card.className = 'card' + (isDone ? ' done' : '');
      var th = document.createElement('div');
      th.className = 'thumb';
      th.appendChild(buildSVG(pic, filled, false).svg);
      card.appendChild(th);
      var crow = document.createElement('div');
      crow.className = 'crow';
      var nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = pic.name;
      crow.appendChild(nm);
      if (isDone) {
        var chip = document.createElement('span');
        chip.className = 'chip'; chip.textContent = 'Done';
        crow.appendChild(chip);
      }
      card.appendChild(crow);
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = total + ' pieces \u00b7 ' + diffOf(pic);
      card.appendChild(meta);
      if (inProg) {
        var pl = document.createElement('div');
        pl.className = 'pgline';
        pl.style.width = Math.round(n / total * 100) + '%';
        card.appendChild(pl);
      }
      onTap(card, function () { openPic(pic); });
      gridEl.appendChild(card);
    });
    if (!shown) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = homeFilter === 'done' ? 'No finished pictures yet.' : 'Nothing in progress yet.';
      gridEl.appendChild(em);
    }
  }

  // ── 플레이 ──────────────────────────────────────────────────
  function openPic(pic) {
    var filled = getFilledSet(pic);
    cur = { pic: pic, filled: filled, sel: -1, counts: [] };
    pic.pal.forEach(function (_, ci) {
      cur.counts[ci] = pic.rg.filter(function (rg, i) { return rg.c === ci + 1 && !filled.has(i); }).length;
    });

    document.getElementById('pic-name').textContent = pic.name;

    // 먼저 화면을 보이게 한 뒤 크기/라벨을 측정한다 (숨긴 채 getBBox는 0을 돌려줌)
    homeEl.classList.add('hidden');
    playEl.classList.remove('hidden');
    hideDonePanel();

    artWrap.innerHTML = '';
    var view = buildSVG(pic, filled, true);
    cur.view = view;
    artWrap.appendChild(view.svg);
    sizeArt();
    placeLabels(pic, view);

    view.svg.addEventListener('pointerdown', onArtDown);
    view.svg.addEventListener('pointerup', onArtUp);

    buildPalette();
    // 첫 미완성 색 자동 선택
    var first = cur.counts.findIndex(function (n) { return n > 0; });
    selectColor(first >= 0 ? first : 0);
    updateProgress();
    if (filled.size === pic.rg.length) showDonePanel(false);
  }

  function sizeArt() {
    if (!cur) return;
    var availW = Math.min(window.innerWidth - 20, 520);
    var availH = artWrap.clientHeight - 8 || (window.innerHeight - 170);
    var s = Math.min(availW / cur.pic.w, availH / cur.pic.h);
    cur.view.svg.setAttribute('width', Math.floor(cur.pic.w * s));
    cur.view.svg.setAttribute('height', Math.floor(cur.pic.h * s));
  }
  window.addEventListener('resize', function () { setTimeout(sizeArt, 60); });

  function buildPalette() {
    paletteEl.innerHTML = '';
    cur.pic.pal.forEach(function (hex, ci) {
      var b = document.createElement('button');
      b.className = 'sw';
      b.style.background = hex;
      b.style.color = isLight(hex) ? '#3d4351' : '#fff';
      b.textContent = ci + 1;
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      b.appendChild(cnt);
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        selectColor(ci);
        sndTick();
      });
      paletteEl.appendChild(b);
    });
    refreshPalette();
  }
  function sndTick() { beep(520, 0.05, 'sine', 0.06); }

  function refreshPalette() {
    var sws = paletteEl.children;
    cur.pic.pal.forEach(function (_, ci) {
      var b = sws[ci];
      var left = cur.counts[ci];
      b.classList.toggle('sel', ci === cur.sel);
      b.classList.toggle('done', left === 0);
      var cnt = b.querySelector('.cnt');
      if (left === 0) {
        b.childNodes[0].textContent = '✓';
        cnt.style.display = 'none';
      } else {
        b.childNodes[0].textContent = ci + 1;
        cnt.style.display = '';
        cnt.textContent = left;
      }
    });
  }

  function selectColor(ci) {
    if (!cur) return;
    cur.sel = ci;
    var hex = cur.pic.pal[ci];
    cur.pic.rg.forEach(function (rg, i) {
      var el = cur.view.els[i];
      var lbl = cur.view.labels[i];
      var on = rg.c === ci + 1 && !cur.filled.has(i);
      el.classList.toggle('hl', on);
      if (on) el.style.setProperty('--tint', tint(hex, 0.38));
      if (lbl) lbl.classList.toggle('on', on);
    });
    refreshPalette();
    // 선택 스와치 보이게 스크롤
    var sw = paletteEl.children[ci];
    if (sw && sw.scrollIntoView) sw.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  // 탭 판정: 드래그(완충지대 스크롤)와 구분
  var downPt = null;
  function onArtDown(e) {
    downPt = { x: e.clientX, y: e.clientY, t: Date.now() };
  }
  function onArtUp(e) {
    if (!downPt) return;
    var dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    var quick = Date.now() - downPt.t < 600;
    downPt = null;
    if (!quick || dx * dx + dy * dy > 144) return; // 12px 이상 움직이면 스크롤로 간주
    var t = e.target.closest ? e.target.closest('[data-i]') : null;
    if (!t) return;
    tapRegion(parseInt(t.getAttribute('data-i'), 10), e);
  }

  function tapRegion(i, e) {
    if (!cur || cur.filled.has(i)) return;
    var rg = cur.pic.rg[i];
    if (rg.c !== cur.sel + 1) {
      // 다른 번호: 숫자를 크게 깜빡여 힌트
      var lbl = cur.view.labels[i];
      var el = cur.view.els[i];
      lbl.classList.remove('flash'); void lbl.getBoundingClientRect(); lbl.classList.add('flash');
      el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake');
      setTimeout(function () { lbl.classList.remove('flash'); el.classList.remove('shake'); }, 520);
      sndWrong();
      return;
    }
    fillRegion(i, e);
  }

  function fillRegion(i, e) {
    var pic = cur.pic, rg = pic.rg[i];
    var hex = pic.pal[rg.c - 1];
    var el = cur.view.els[i];
    var lbl = cur.view.labels[i];

    cur.filled.add(i);
    saveData[pic.id] = Array.from(cur.filled);
    (saveData._last = saveData._last || {})[pic.id] = Date.now();
    persist();
    cur.counts[cur.sel]--;

    // 리플(물감 퍼짐) 애니메이션
    var bb = el.getBBox();
    var pt = { x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 };
    if (e) {
      var svgPt = cur.view.svg.createSVGPoint();
      svgPt.x = e.clientX; svgPt.y = e.clientY;
      var m = cur.view.svg.getScreenCTM();
      if (m) { var p2 = svgPt.matrixTransform(m.inverse()); pt = { x: p2.x, y: p2.y }; }
    }
    var clipId = 'cb-clip-' + i + '-' + Date.now();
    var clip = document.createElementNS(NS, 'clipPath');
    clip.setAttribute('id', clipId);
    var shape = makeShape(rg);
    clip.appendChild(shape);
    cur.view.defs.appendChild(clip);
    var rip = document.createElementNS(NS, 'circle');
    rip.setAttribute('cx', pt.x); rip.setAttribute('cy', pt.y); rip.setAttribute('r', 0);
    rip.setAttribute('fill', hex);
    rip.setAttribute('clip-path', 'url(#' + clipId + ')');
    rip.setAttribute('pointer-events', 'none');
    el.parentNode.insertBefore(rip, el.nextSibling);
    var corners = [
      [bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]
    ];
    var maxR = 0;
    corners.forEach(function (c) {
      maxR = Math.max(maxR, Math.hypot(c[0] - pt.x, c[1] - pt.y));
    });
    var t0 = performance.now(), dur = 260;
    (function step(now) {
      var k = Math.min(1, Math.max(0, (now - t0) / dur));
      rip.setAttribute('r', maxR * (1 - Math.pow(1 - k, 2)));
      if (k < 1) { requestAnimationFrame(step); return; }
      el.classList.add('filled');
      el.classList.remove('hl');
      el.style.fill = hex;
      rip.remove(); clip.remove();
    })(t0);

    el.classList.remove('hl');
    lbl.style.display = 'none';
    sndPop(); buzz(8);
    updateProgress();

    if (cur.counts[cur.sel] === 0) {
      refreshPalette();
      if (cur.filled.size === pic.rg.length) {
        setTimeout(showComplete, 420);
      } else {
        // 다음 미완성 색으로 자동 이동
        var n = pic.pal.length;
        for (var k2 = 1; k2 <= n; k2++) {
          var ci = (cur.sel + k2) % n;
          if (cur.counts[ci] > 0) { sndColor(); setTimeout(function () { selectColor(ci); }, 240); break; }
        }
      }
    } else {
      refreshPalette();
    }
  }

  function updateProgress() {
    var p = Math.round(cur.filled.size / cur.pic.rg.length * 100);
    pbarFill.style.width = p + '%';
    pctEl.textContent = p + '%';
  }

  // ── 완성 ────────────────────────────────────────────────────
  function showComplete() {
    sndDone(); buzz([30, 40, 30]);
    confettiBurst();
    showDonePanel(true);
  }

  function showDonePanel(fresh) {
    hideDonePanel();
    donePanel = document.createElement('div');
    donePanel.id = 'done-panel';
    donePanel.innerHTML =
      '<h2>' + (fresh ? '🎉 Beautiful!' : '⭐ All done!') + '</h2>' +
      '<p>' + cur.pic.name + ' is complete</p>' +
      '<div class="row"><button id="btn-again">Color again</button><button id="btn-gallery">Gallery</button></div>';
    document.body.appendChild(donePanel);
    onTap(donePanel.querySelector('#btn-gallery'), goHome);
    onTap(donePanel.querySelector('#btn-again'), function () {
      delete saveData[cur.pic.id];
      if (saveData._last) delete saveData._last[cur.pic.id];
      persist();
      var pic = cur.pic;
      hideDonePanel();
      openPic(pic);
    });
  }
  function hideDonePanel() {
    if (donePanel) { donePanel.remove(); donePanel = null; }
  }

  function goHome() {
    hideDonePanel();
    cur = null;
    playEl.classList.add('hidden');
    homeEl.classList.remove('hidden');
    renderHome();
  }
  onTap(document.getElementById('btn-back'), goHome);

  // ── 컨페티 ──────────────────────────────────────────────────
  var cvs = document.getElementById('confetti');
  var ctx = cvs.getContext('2d');
  var parts = [], confOn = false;
  function confettiBurst() {
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    var colors = ['#ffc94d', '#f58fb0', '#7fc46a', '#74b8e8', '#f0715c', '#9b7ede'];
    for (var i = 0; i < 120; i++) {
      parts.push({
        x: Math.random() * cvs.width,
        y: -20 - Math.random() * cvs.height * 0.5,
        vy: 130 + Math.random() * 180,
        vx: (Math.random() - 0.5) * 60,
        s: 5 + Math.random() * 6,
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 6,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!confOn) { confOn = true; requestAnimationFrame(confStep); }
  }
  var confLast = 0;
  function confStep(now) {
    var dt = confLast ? Math.min((now - confLast) / 1000, 0.05) : 0.016;
    confLast = now;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    parts = parts.filter(function (p) { return p.y < cvs.height + 30; });
    parts.forEach(function (p) {
      p.y += p.vy * dt; p.x += p.vx * dt; p.r += p.vr * dt;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (parts.length) { requestAnimationFrame(confStep); }
    else { confOn = false; confLast = 0; ctx.clearRect(0, 0, cvs.width, cvs.height); }
  }

  // ── 인앱 브라우저 시트 닫힘 방지: 스크롤을 완충지대 중간에 걸어 둔다 ──
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  renderHome();

  // 헤드리스 테스트용 훅 (해시에 debug가 있을 때만)
  if ((location.hash || '').indexOf('debug') >= 0) {
    window.__app = {
      PICS: PICS,
      get cur() { return cur; },
      open: function (id) { openPic(PICS.find(function (p) { return p.id === id; })); },
      select: selectColor,
      tap: function (i) { tapRegion(i, null); },
      fillAll: function () {
        var pic = cur.pic;
        pic.rg.forEach(function (rg, i) {
          if (cur.filled.has(i)) return;
          selectColor(rg.c - 1);
          tapRegion(i, null);
        });
      },
      home: goHome
    };
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloring Converter Preview</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#222;--sub:#666;--line:#e6e0d6;--acc:#d9622b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222127;--ink:#eee;--sub:#aaa;--line:#36343c;--acc:#f08a55}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222127;--ink:#eee;--sub:#aaa;--line:#36343c;--acc:#f08a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#spacer{height:240px}
header{display:flex;align-items:center;gap:8px;padding:10px 16px}
header h1{font-size:18px;margin:0;flex:1}
.nav{min-width:60px;height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:700}
#info{padding:0 16px;font-size:13px;color:var(--sub)}
#info b{color:var(--ink)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px;touch-action:pan-y}
#pic{position:relative;width:min(100%,60vh);aspect-ratio:1;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px #0002}
#pic svg{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
.rg{fill:#fff;stroke:none;transition:fill .25s}
.rg.hl{animation:pulse 1s infinite alternate}
@keyframes pulse{from{fill:#fff}to{fill:#d9d4ff}}
.num{font-weight:700;font-family:sans-serif;fill:#888;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#pal{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 18px;touch-action:pan-x pan-y}
.sw{flex:none;width:64px;height:64px;border-radius:16px;border:3px solid transparent;font:800 24px sans-serif;color:#222;display:flex;align-items:center;justify-content:center;position:relative}
.sw.on{border-color:var(--ink);transform:translateY(-3px)}
.sw.done{opacity:.35}
.sw small{position:absolute;bottom:2px;font-size:10px;font-weight:600}
#done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0006;color:#fff;font:800 32px sans-serif}
</style>
</head>

function pick(c){sel=c;document.querySelectorAll('.sw').forEach(b=>{b.classList.toggle('on',+b.dataset.c===c);b.classList.toggle('done',left(+b.dataset.c)===0)});
  document.querySelectorAll('.rg').forEach(p=>{const k=+p.dataset.k;p.classList.toggle('hl',!filled.has(k)&&PICS[cur].data.regions[k].c===c)})}
$('fills').addEventListener('click',e=>{
  const p=e.target.closest('.rg');if(!p)return;const k=+p.dataset.k,R=PICS[cur].data.regions[k];
  if(filled.has(k)||R.c!==sel){p.animate([{transform:'translateX(0)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:150});return}
  filled.add(k);p.classList.remove('hl');p.style.fill=PICS[cur].data.palette[R.c-1];
  document.querySelector(`.num[data-k="${k}"]`).style.display='none';
  pal();
  if(left(sel)===0){const nx=PICS[cur].data.palette.findIndex((_,i)=>left(i+1)>0);if(nx>=0)pick(nx+1);else{pick(0);$('done').style.display='flex'}}else pick(sel);
});
$('prev').onclick=()=>load(cur-1);$('next').onclick=()=>load(cur+1);
const se=document.scrollingElement;se.scrollTop=120;addEventListener('scroll',()=>{if(se.scrollTop<40||se.scrollTop>200)se.scrollTop=120});
load(0);
</script>
</body>
</html>

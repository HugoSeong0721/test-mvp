<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>피아노 타일 · Piano Tiles</title>
<style>
/* ============================================================
   피아노 타일 — 동요 멜로디 탭 아케이드 (매직 타일 방식)
   멈추지 않는다 · 탭만 한다 · 놓치면 끝난다
   ============================================================ */
:root{
  --page-bg:#0A0C12;
  --app-bg:#0E1119;
  --surface:#161A26;
  --surface-2:#1D2331;
  --surface-3:#252C3D;
  --line:#232A3A;
  --text:#E9EBF1;
  --text-2:#9AA3B5;
  --muted:#6A7386;
  --accent:#6E8DF7;
  --accent-ink:#0B1024;
  --accent-soft:rgba(110,141,247,.14);
  --gold:#E8B44C;
  --pos:#4CC38A;
  --neg:#E5645F;
  --tile:#1A2233;
  --tile-line:#2A3346;
  --lane-bg:#0B0E15;
  --sheet-scrim:rgba(4,6,10,.62);
  --shadow:0 24px 80px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --page-bg:#E8E9EE;
    --app-bg:#F5F6F9;
    --surface:#FFFFFF;
    --surface-2:#EEF0F5;
    --surface-3:#E2E5EE;
    --line:#E1E4EC;
    --text:#1B2130;
    --text-2:#59627A;
    --muted:#8A92A6;
    --accent:#3D5FD9;
    --accent-ink:#F7F9FF;
    --accent-soft:rgba(61,95,217,.11);
    --gold:#A97C1F;
    --pos:#178A55;
    --neg:#C74540;
    --tile:#232B3F;
    --tile-line:#333D55;
    --lane-bg:#12151E;
    --sheet-scrim:rgba(27,33,48,.38);
    --shadow:0 24px 60px rgba(27,33,48,.18);
  }
}
:root[data-theme="light"]{
  --page-bg:#E8E9EE;
  --app-bg:#F5F6F9;
  --surface:#FFFFFF;
  --surface-2:#EEF0F5;
  --surface-3:#E2E5EE;
  --line:#E1E4EC;
  --text:#1B2130;
  --text-2:#59627A;
  --muted:#8A92A6;
  --accent:#3D5FD9;
  --accent-ink:#F7F9FF;
  --accent-soft:rgba(61,95,217,.11);
  --gold:#A97C1F;
  --pos:#178A55;
  --neg:#C74540;
  --tile:#232B3F;
  --tile-line:#333D55;
  --lane-bg:#12151E;
  --sheet-scrim:rgba(27,33,48,.38);
  --shadow:0 24px 60px rgba(27,33,48,.18);
}

*{box-sizing:border-box;margin:0;padding:0}
/* 인앱 브라우저(시트)에서 아래로 끌기가 '창 닫기'로 먹히는 것 방지:
   앱은 고정 레이어, 문서에는 240px 스크롤 완충지대 (scrollTop 120px 고정) */
html{height:100%;overflow:auto;overscroll-behavior:none;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{height:calc(100% + 240px);overflow:hidden;overscroll-behavior:none}
body{
  background:var(--page-bg);
  background-image:radial-gradient(90rem 60rem at 50% -20rem, var(--accent-soft), transparent 60%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
}
button{
  font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.phone,.phone *{touch-action:manipulation}
.lane,.lane *{touch-action:pan-y} /* 세로 끌림은 완충지대 스크롤로 흘려보낸다 */

/* ---- 폰 프레임 (고정 레이어) ---- */
.phone{
  width:min(420px,100vw);
  height:100dvh;
  background:var(--app-bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  position:fixed;inset:0;margin:auto;
}
@media (min-width:481px) and (min-height:760px){
  .phone{
    height:min(860px,94dvh);
    border-radius:32px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
}

/* ---- 헤더 ---- */
.hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.hd .brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
.hd .brand small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.hd .right{display:flex;gap:8px;align-items:center}
.chip{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);
  padding:7px 11px;border-radius:999px;
}
button.chip{font-size:15px;padding:6px 10px}

/* ---- 안내 배너 ---- */
.notice[hidden]{display:none}
.notice{
  display:flex;align-items:center;gap:8px;
  margin:0 16px 8px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  font-size:12px;color:var(--text-2);line-height:1.45;
}
.notice span{flex:1;min-width:0}
.notice .nb{
  flex-shrink:0;font-size:12px;font-weight:700;
  padding:7px 11px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  text-decoration:none;
}
.notice .nbx{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface-2);color:var(--text)}

/* ---- 곡 목록 ---- */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain}
.eyebrow{
  font-size:10.5px;font-weight:700;color:var(--muted);
  letter-spacing:.13em;text-transform:uppercase;
  padding:8px 8px 8px;
}
.howto{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 15px;font-size:13px;color:var(--text-2);line-height:1.6;
}
.howto b{color:var(--text)}
.slist{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.srow{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:13px 14px;
}
.srow .art{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:21px;
  background:var(--surface-2);
}
.srow .info{flex:1;min-width:0}
.srow .name{font-size:14.5px;font-weight:700}
.srow .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:800;padding:2.5px 7px;border-radius:999px}
.badge.d0{background:rgba(76,195,138,.15);color:var(--pos)}
.badge.d1{background:var(--accent-soft);color:var(--accent)}
.srow .best{flex-shrink:0;text-align:right}
.srow .best .v{font-size:15px;font-weight:800}
.srow .best .v.clear{color:var(--pos)}
.srow .best .k{font-size:10px;color:var(--muted);margin-top:2px}
.srow .go{
  flex-shrink:0;font-size:12.5px;font-weight:700;
  background:var(--accent);color:var(--accent-ink);
  padding:8px 14px;border-radius:999px;
}

/* ---- 플레이 ---- */
#play{background:var(--lane-bg)}
.play-hd{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.play-hd .x{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:rgba(233,235,241,.08);color:#E9EBF1;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.play-hd .mid{flex:1;min-width:0}
.play-hd .song{font-size:14px;font-weight:700;color:#E9EBF1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:5px;border-radius:3px;background:rgba(233,235,241,.12);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;width:0%;border-radius:3px;background:var(--accent)}
.play-hd .sc{
  flex-shrink:0;font-size:13px;font-weight:800;color:#E9EBF1;
  background:rgba(233,235,241,.08);padding:7px 12px;border-radius:999px;
}
.lane{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--lane-bg)}
.lane .colline{position:absolute;top:0;bottom:0;width:1px;background:rgba(233,235,241,.07)}
.tiles{position:absolute;left:0;top:0;right:0;height:0;will-change:transform}
.tile{
  position:absolute;border-radius:10px;
  background:var(--tile);border:1px solid var(--tile-line);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:10px;
  font-size:13px;font-weight:800;color:rgba(233,235,241,.5);
}
.tile.hit{background:var(--pos);border-color:var(--pos);color:#06130C;opacity:0;transform:scale(1.06);transition:opacity .28s ease,transform .28s ease}
.tile.first::after{
  content:"여기부터 탭!";
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;
}
.missflash{
  position:absolute;border-radius:10px;background:rgba(229,100,95,.35);
  border:2px solid var(--neg);opacity:0;pointer-events:none;
}
.missflash.on{opacity:1}
.baseline{
  position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--accent);opacity:.6;
}
.lane .hint{
  position:absolute;left:0;right:0;top:38%;text-align:center;
  font-size:13px;font-weight:700;color:rgba(233,235,241,.55);
  pointer-events:none;
}
.lane .hint b{color:#E9EBF1}
.speedchip{
  position:absolute;top:10px;right:12px;
  font-size:11px;font-weight:800;color:rgba(233,235,241,.65);
  background:rgba(233,235,241,.08);padding:5px 10px;border-radius:999px;
  pointer-events:none;
}

/* ---- 결과 오버레이 ---- */
.result{
  position:absolute;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;
  background:var(--sheet-scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:24px;
}
.result.on{display:flex}
.rcard{
  width:100%;max-width:320px;text-align:center;
  background:var(--app-bg);border:1px solid var(--line);
  border-radius:26px;padding:26px 22px 20px;
  box-shadow:var(--shadow);
}
.rcard .emo{font-size:40px}
.rcard h2{font-size:19px;font-weight:800;margin:10px 0 4px}
.rcard .msg{font-size:13px;color:var(--text-2)}
.rstats{display:flex;gap:8px;margin:18px 0 16px}
.rstats .st{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 6px}
.rstats .v{font-size:17px;font-weight:800}
.rstats .k{font-size:10.5px;color:var(--muted);margin-top:3px}
.rbtns{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:13px;border-radius:14px;font-size:14.5px;font-weight:800}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1px solid var(--line);color:var(--text)}

/* ---- 토스트 ---- */
.toast{
  position:absolute;left:50%;bottom:40px;transform:translateX(-50%) translateY(8px);
  z-index:40;font-size:13px;font-weight:700;color:var(--text);
  background:var(--surface);border:1px solid var(--line);
  padding:11px 17px;border-radius:999px;box-shadow:var(--shadow);
  opacity:0;transition:opacity .25s ease,transform .25s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="phone" id="phone">
  <div class="hd">

    <div class="right">
      <button class="chip" id="sndChip" aria-label="소리 켜기/끄기">🔊</button>

  <div class="notice" id="notice" hidden>
    <span>창이 자꾸 닫히면 인앱 브라우저 때문이에요. Safari로 열면 안 닫혀요.</span>
    <a class="nb" href="x-safari-https://hugoseong0721.github.io/test-mvp/piano-tiles.html">Safari로 열기</a>

  <div class="views">
    <!-- 곡 목록 -->
    <div class="view on" id="v-songs">
      <div class="scroll">
        <div class="howto">🎹 <b>검은 타일을 탭</b>하면 멜로디가 연주돼요.
        점점 빨라지고, <b>타일을 놓치거나 빈 칸을 누르면 끝</b>. 곡을 완주해 보세요!</div>
        <div class="eyebrow">곡 선택</div>

    <!-- 플레이 -->
    <div class="view" id="play">
      <div class="play-hd">

        <div class="st"><div class="v num" id="rProg">100%</div><div class="k">진행</div></div>
        <div class="st"><div class="v num" id="rNotes">0</div><div class="k">연주한 음</div></div>

      </div>

        <button class="btn pri" id="rRetry">다시 도전</button>
        <button class="btn pri" id="rNext" style="display:none">다음 곡</button>

      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ============================================================
   곡 데이터 — 탭할 때마다 다음 음이 연주된다
   ============================================================ */
const SOL={C:"도",D:"레",E:"미",F:"파",G:"솔",A:"라",B:"시"};
const MIDI=(()=>{const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  return n=>{const m=n.match(/^([A-G])(#?)(\d)$/);return 12*(+m[3]+1)+b[m[1]]+(m[2]?1:0);};})();
const FREQ=n=>440*Math.pow(2,(MIDI(n)-69)/12);

const SONGS=[
  {id:"airplane", title:"비행기", icon:"✈️", diff:0,
   notes:["E4","D4","C4","D4","E4","E4","E4","D4","D4","D4","E4","G4","G4",
          "E4","D4","C4","D4","E4","E4","E4","E4","D4","D4","E4","D4","C4"]},
  {id:"school", title:"학교종", icon:"🔔", diff:0,
   notes:["G4","G4","A4","A4","G4","G4","E4","G4","G4","E4","E4","D4",
          "G4","G4","A4","A4","G4","G4","E4","G4","E4","D4","E4","C4"]},
  {id:"star", title:"반짝반짝 작은 별", icon:"⭐", diff:0,
   notes:["C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4",
          "G4","G4","F4","F4","E4","E4","D4","G4","G4","F4","F4","E4","E4","D4",
          "C4","C4","G4","G4","A4","A4","G4","F4","F4","E4","E4","D4","D4","C4"]},
  {id:"butterfly", title:"나비야", icon:"🦋", diff:1,
   notes:["G4","E4","E4","F4","D4","D4","C4","D4","E4","F4","G4","G4","G4",
          "G4","E4","E4","E4","F4","D4","D4","D4","C4","E4","G4","G4","E4","E4","E4"]},
  {id:"joy", title:"환희의 송가", icon:"🎼", diff:1,
   notes:["E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","E4","D4","D4",
          "E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","D4","C4","C4"]},
  // 아래 두 곡은 퍼블릭 도메인 재즈 계열 (조플린 1902 / 전통곡)
  {id:"saints", title:"성자의 행진", icon:"🎺", diff:1,
   notes:["C4","E4","F4","G4","C4","E4","F4","G4",
          "C4","E4","F4","G4","E4","C4","E4","D4",
          "E4","E4","D4","C4","C4","E4","G4","G4","F4",
          "E4","F4","G4","E4","C4","D4","C4"]},
  {id:"entertainer", title:"엔터테이너", icon:"🎩", diff:1,
   notes:["D4","D#4","E4","C5","E4","C5","E4","C5",
          "C5","D5","D#5","E5","C5","D5","E5","B4","D5","C5",
          "D4","D#4","E4","C5","E4","C5","E4","C5",
          "A4","G4","F#4","A4","C5","E5","D5","C5","A4","D5","C5"]},
];
const byId=id=>SONGS.find(s=>s.id===id);

/* ============================================================
   저장
   ============================================================ */
const store={
  read(){try{return JSON.parse(localStorage.getItem("piano-tiles")||"{}")}catch(e){return{}}},
  write(d){try{localStorage.setItem("piano-tiles",JSON.stringify(d))}catch(e){}},
};
const S=Object.assign({best:{},clear:{},top:0,mute:false,tip:false},store.read());
const save=()=>store.write(S);

/* ============================================================
   오디오 — 탭당 짧은 피아노 톤 (동시 발음 제한)
   ============================================================ */
let AC=null;
function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const b=AC.createBuffer(1,1,22050);
    const s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
  }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
document.addEventListener("pointerdown",()=>{if(!S.mute){try{audio()}catch(e){}}},{once:true});
const VOICES=[]; const MAX_VOICES=10;
function playNote(name,long){
  if(S.mute) return;
  try{
    const ac=audio(),t=ac.currentTime,f=FREQ(name);
    const g=ac.createGain();
    const dur=long?1.6:0.9;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const lp=ac.createBiquadFilter();
    lp.type="lowpass";lp.frequency.value=Math.min(f*6,7000);lp.Q.value=0.4;
    const o1=ac.createOscillator();o1.type="triangle";o1.frequency.value=f;
    const o2=ac.createOscillator();o2.type="sine";o2.frequency.value=f*2;
    const g2=ac.createGain();g2.gain.value=0.25;
    o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(ac.destination);
    o1.start(t);o2.start(t);o1.stop(t+dur+0.1);o2.stop(t+dur+0.1);
    const v={stop(){try{o1.stop();o2.stop()}catch(e){}}};
    VOICES.push(v);
    while(VOICES.length>MAX_VOICES) VOICES.shift().stop();
  }catch(e){}
}
function buzz(){ // 실수 소리
  if(S.mute) return;
  try{
    const ac=audio(),t=ac.currentTime;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    const o=ac.createOscillator();o.type="sawtooth";o.frequency.value=95;
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.5);
  }catch(e){}
}

/* ============================================================
   게임 엔진 — 4열 타일이 쉬지 않고 내려온다
   ============================================================ */
const COLS=4;
let G=null, rafId=0, lastTs=0;

// 열 배치: 예측 가능한 패턴이 안 되도록 섞되, 매번 같은 곡은 같은 배치
function layoutCols(song){
  let seed=0;
  for(const c of song.id) seed=(seed*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const cols=[];let prev=-1;
  for(let i=0;i<song.notes.length;i++){
    let c=Math.floor(rnd()*COLS);
    if(c===prev) c=(c+1+Math.floor(rnd()*(COLS-1)))%COLS; // 같은 열 연속 방지
    cols.push(c);prev=c;
  }
  return cols;
}

function startGame(id){
  const song=byId(id);
  stopGame();
  show("play");
  $("#playTitle").textContent=song.title;
  $("#playBar").style.width="0%";
  $("#playSc").textContent="0";
  $("#result").classList.remove("on");
  $("#hint").style.display="";

  const lane=$("#lane");
  // 열 구분선
  [...lane.querySelectorAll(".colline")].forEach(el=>el.remove());
  for(let i=1;i<COLS;i++){
    const l=document.createElement("div");
    l.className="colline";l.style.left=(i*100/COLS)+"%";
    lane.appendChild(l);
  }

  const H=lane.clientHeight;
  const RH=Math.max(120,Math.round(H/4.5)); // 타일(행) 높이
  const cols=layoutCols(song);
  const wrap=$("#tiles");wrap.innerHTML="";
  const tiles=song.notes.map((n,i)=>{
    const el=document.createElement("div");
    el.className="tile"+(i===0?" first":"");
    el.style.left=(cols[i]*100/COLS+0.8)+"%";
    el.style.width=(100/COLS-1.6)+"%";
    el.style.height=(RH-6)+"px";
    el.style.top=(-(i+1)*RH+3)+"px";
    el.textContent=SOL[n[0]]+(n.includes("#")?"♯":"");
    wrap.appendChild(el);
    return {n,col:cols[i],el,hit:false};
  });

  G={
    song,tiles,H,RH,
    idx:0,               // 다음에 눌러야 할 타일
    scrollY:H*0.88,      // 첫 타일이 바닥 근처, 다음 타일들이 위로 줄지어 보인다
    rps:1.5,             // 초당 행 수 — 최소 압박 속도 (점점 빨라진다)
    started:false,over:false,cleared:false,
    maxRps:1.5,
  };
  wrap.style.transform=`translateY(${G.scrollY}px)`;
  $("#speedchip").textContent="x1.0";
  lastTs=0;
  rafId=requestAnimationFrame(loop);
}

function loop(ts){
  if(!G) return;
  if(!lastTs) lastTs=ts;
  const dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;

  if(G.started&&!G.over){
    // 시간 압박: 최소 속도로 계속 내려온다
    G.scrollY+=G.rps*G.RH*dt;
    // 탭 진행: 탭할 때마다 판이 한 칸씩 부드럽게 내려온다 (빠르게 치면 빨라진다)
    const tapY=G.idx*G.RH+G.H*0.88;
    if(tapY>G.scrollY) G.scrollY+=(tapY-G.scrollY)*Math.min(1,dt*12);
    // 다음 타일이 바닥을 넘어가면 놓친 것
    const t=G.tiles[G.idx];
    if(t && G.scrollY-(G.idx*G.RH) > G.H+G.RH*0.25){
      miss(t.el,true);
    }
    $("#tiles").style.transform=`translateY(${G.scrollY}px)`;
  }
  rafId=requestAnimationFrame(loop);
}

// 탭: 열이 맞으면 히트. 빈 열이면 실수.
$("#lane").addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(!G||G.over) return;
  const lane=$("#lane");
  const r=lane.getBoundingClientRect();
  const col=Math.min(COLS-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*COLS)));
  const t=G.tiles[G.idx];
  if(!t) return;
  // 화면에 들어온 타일만 칠 수 있다 — 도착 전 선탭은 빈 칸 탭과 같다
  const topOnScreen=G.scrollY-(G.idx+1)*G.RH;
  const reachable=topOnScreen > -G.RH*0.5;
  if(col===t.col && reachable){
    hit(t);
  }else{
    // 빈 칸 탭 — 눌린 자리를 붉게 보여주고 종료
    const mf=$("#missflash");
    mf.style.left=(col*100/COLS+0.8)+"%";
    mf.style.width=(100/COLS-1.6)+"%";
    mf.style.height=(G.RH-6)+"px";
    mf.style.top=(e.clientY-r.top-G.RH/2)+"px";
    miss(mf,false);
  }
});

function hit(t){
  t.hit=true;
  t.el.classList.remove("first");
  t.el.classList.add("hit");
  const isLast=G.idx===G.tiles.length-1;
  playNote(t.n,isLast);
  G.idx++;
  if(!G.started){G.started=true;$("#hint").style.display="none";}
  // 속도 램프: 8음마다 체감되게
  G.rps=Math.min(3.6,1.5+G.idx*0.045);
  G.maxRps=Math.max(G.maxRps,G.rps);
  $("#speedchip").textContent="x"+(G.rps/1.5).toFixed(1);
  $("#playSc").textContent=G.idx;
  $("#playBar").style.width=(G.idx/G.tiles.length*100)+"%";
  if(isLast) finish(true);
}

function miss(flashEl,passed){
  if(G.over) return;
  G.over=true;
  buzz();
  if(flashEl){
    flashEl.classList.add("on");
    setTimeout(()=>flashEl.classList.remove("on"),600);
  }
  setTimeout(()=>finish(false),450);
}

function finish(cleared){
  G.over=true;G.cleared=cleared;
  const total=G.tiles.length;
  const pct=Math.round(G.idx/total*100);
  const id=G.song.id;
  if(cleared) S.clear[id]=true;
  if(pct>(S.best[id]||0)) S.best[id]=pct;
  if(G.idx>S.top) S.top=G.idx;
  save();

  $("#rEmo").textContent=cleared?"🎉":"💥";
  $("#rTitle").textContent=cleared?"완주!":"아쉽다!";
  $("#rMsg").textContent=cleared
    ? `${G.song.title}를 끝까지 연주했어요.`
    : (G.idx>0?`${G.idx}번째 음까지 연주했어요. 한 번 더!`:"검은 타일을 탭하는 거예요. 한 번 더!");
  $("#rProg").textContent=pct+"%";
  $("#rNotes").textContent=G.idx;
  $("#rSpeed").textContent="x"+(G.maxRps/1.5).toFixed(1);

  const ci=SONGS.indexOf(G.song);
  const next=cleared&&ci<SONGS.length-1?SONGS[ci+1].id:null;
  $("#rNext").style.display=next?"":"none";
  $("#rNext").dataset.song=next||"";
  $("#rRetry").textContent=cleared?"한 번 더":"다시 도전";
  setTimeout(()=>$("#result").classList.add("on"),200);
}

function stopGame(){
  if(rafId) cancelAnimationFrame(rafId);
  rafId=0;G=null;
  $("#result").classList.remove("on");
}

$("#playX").addEventListener("click",()=>{stopGame();renderSongs();show("v-songs");});
$("#rRetry").addEventListener("click",()=>startGame(G.song.id));
$("#rNext").addEventListener("click",e=>{
  const n=e.currentTarget.dataset.song;
  if(n) startGame(n);
});
$("#rDone").addEventListener("click",()=>{stopGame();renderSongs();show("v-songs");});

renderSongs();

// 완충지대 스크롤 고정 (시트 닫힘 방지)
const SE=document.scrollingElement||document.documentElement;
const PIN=120;let pinT=null;
function pinScroll(){
  const max=SE.scrollHeight-SE.clientHeight;
  if(max<=0)return;
  SE.scrollTop=Math.min(PIN,Math.max(1,max-1));
}
document.addEventListener("touchstart",pinScroll,{passive:true});
window.addEventListener("scroll",()=>{clearTimeout(pinT);pinT=setTimeout(pinScroll,250);},{passive:true});
pinScroll();

// 프로토타입 검증용 훅
window.__tiles={get G(){return G},startGame,SONGS,S};
</script>

<body>
  <noscript>This app needs JavaScript enabled.</noscript>
  <div id="app-loader" style="font-family: Arial, sans-serif; padding: 24px; color: #1f2a27;">
    Loading Test MVP...
  </div>
  <script>
    (async function () {
      const refreshKey = 'test-mvp-cache-refresh-v3';
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) {
          await registration.unregister();
        }
        if (navigator.serviceWorker.controller && sessionStorage.getItem(refreshKey) !== 'done') {
          sessionStorage.setItem(refreshKey, 'done');
          window.location.reload();
          return;
        }
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const key of keys) {
          await caches.delete(key);
        }
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?build=20260529-1505-' + Date.now();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
  <!--

    or to give the user feedback during the initialization process.

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mole Mash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #7ec850;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #game {
    display: block;
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
  }
  /* ── 게임오버 패널 (랭킹 / 도전장) ── */
  #over-panel {
    position: fixed;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(330px, 88vw);
    background: rgba(46, 28, 16, 0.96);
    color: #fff;
    border-radius: 16px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  #over-panel.hidden { display: none; }
  #over-title { font-size: 24px; font-weight: 800; }
  #over-score { font-size: 36px; font-weight: 800; margin-top: 2px; color: #ffc94d; }
  #over-sub { font-size: 15px; margin-top: 4px; min-height: 18px; color: rgba(255,255,255,0.75); }
  #over-sub.newbest { color: #ffc94d; font-weight: 700; }
  #over-sub.win { color: #7ee787; font-weight: 700; }
  #over-sub.lose { color: #ff8f7a; font-weight: 700; }
  #board-title { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.6); text-align: left; padding-left: 4px; }
  #rank-board {
    margin: 6px 0 8px;
    max-height: 158px; overflow-y: auto;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 14px;
  }
  .rank-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(255, 201, 77, 0.18); }
  .rank-pos { width: 30px; text-align: left; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
  .rank-row.me .rank-pos { color: #ffc94d; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-friend { font-size: 11px; color: #8ecbff; margin-left: 4px; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
  #name-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  #name-input {
    width: 92px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 5px 8px;
    text-align: center;
  }
  #over-btns { display: flex; gap: 8px; }
  #over-btns button {
    flex: 1;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #retry-btn { background: #ffc94d; color: #4a2d10; }
  #share-btn { background: rgba(255,255,255,0.14); color: #fff; }
  #share-note { font-size: 12px; color: #7ee787; min-height: 15px; margin-top: 7px; }
  #share-fallback {
    width: 100%; margin-top: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff;
    font-size: 12px; padding: 6px 8px;
  }
  #share-fallback.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="over-panel" class="hidden">
  <div id="over-title">🔨 GAME OVER</div>
  <div id="over-score"></div>
  <div id="over-sub"></div>
  <div id="board-title"></div>
  <div id="rank-board"></div>
  <div id="name-row"><span>Name</span><input id="name-input" maxlength="8" placeholder="Me"></div>
  <div id="over-btns">
    <button id="share-btn">⚔️ Challenge a friend</button>
    <button id="retry-btn">Play again</button>
  </div>
  <div id="share-note"></div>
  <input id="share-fallback" class="hidden" readonly>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  // ---------- 3x3 두더지 굴 배치 ----------
  var holes = [];        // {x, y, rx, ry} 화면 좌표 (구멍 타원 중심)
  var cellW = 0, moleW = 0, moleH = 0;

  function layout() {
    cellW = Math.min(W * 0.3, H * 0.19, 132);
    moleW = cellW * 0.66;
    moleH = cellW * 0.82;
    var gapX = cellW * 1.12;
    var gapY = cellW * 1.18;
    var cx = W / 2;
    var cy = H * 0.55;
    holes = [];
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 3; c++) {
        holes.push({
          x: cx + (c - 1) * gapX,
          y: cy + (r - 1) * gapY,
          rx: cellW * 0.46,
          ry: cellW * 0.17
        });
      }
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 상태 ----------
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_TITLE;

  var moles = [];        // {hole, kind:'mole'|'gold'|'skunk', phase:'rise'|'sink'|'whacked', p, stayT, t, face}
  var score = 0;
  var lives = 3;
  var playT = 0, introT = 0;
  var spawnTimer = 0;
  var floats = [];       // {x, y, text, color, t, size}
  var mallets = [];      // {x, y, t} 탭 지점의 망치 스윙 연출
  var puffs = [];        // {x, y, t, color} 흙먼지 / 스컹크 구름
  var particles = [];    // 타격 파편 {x, y, vx, vy, r, color, t, life}
  var shake = 0;
  var overAt = 0;
  var lastScore = 0;
  var heartFlash = 0;    // 목숨 잃었을 때 하트 깜빡임
  var hitStop = 0;       // 명중 순간 잠깐 멈추는 히트스톱(타격감)
  var flashA = 0;        // 황금 두더지 화면 플래시
  var timeLeft = 0;      // 남은 시간(초) — 0이 되면 종료
  var lastTick = -1;     // 마지막 5초 카운트다운 삑 소리용
  var overReason = 'time';

  var TIME_LIMIT = 45;   // 한 판 제한시간(초)

  var best = 0;
  try { best = parseInt(localStorage.getItem('moleMashBest') || '0', 10) || 0; } catch (e) {}
  var isNewBest = false;

  // ---------- 난이도: 점수가 오를수록 창이 좁아지고 마릿수가 는다 ----------
  function stayTime()  { return Math.max(0.62, 1.55 - score * 0.022); }   // 올라와 있는 시간(초) — 이 동안 눈에 보이게 가라앉는다
  function spawnGap()  { return Math.max(0.4, 1.0 - score * 0.013); }     // 다음 등장까지 간격
  function maxActive() { return score < 10 ? 1 : (score < 24 ? 2 : 3); }  // 동시 등장 수

  // ---------- 사운드 (WebAudio — 첫 터치에서 초기화) ----------
  var AC = null;
  function audio() {
    if (AC) return AC;
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) AC = new Ctor();
    } catch (e) {}
    return AC;
  }
  function beep(freq, dur, type, vol, slide) {
    var ac = audio();
    if (!ac) return;
    if (ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  function thwack(vol) {
    // 짧은 노이즈 버스트 — '퍽' 하는 질감 담당
    var ac = audio();
    if (!ac) return;
    try {
      var len = Math.floor(ac.sampleRate * 0.08);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ac.createBufferSource(); src.buffer = buf;
      var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      var g = ac.createGain(); g.gain.value = vol || 0.25;
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start();
    } catch (e) {}
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function sndBonk()  { thwack(0.3); beep(75, 0.13, 'sine', 0.28, -25); beep(190, 0.07, 'square', 0.1, -100); }
  function sndTick()  { beep(1050, 0.05, 'square', 0.09); }
  function sndGold()  { beep(660, 0.09, 'square', 0.1); setTimeout(function(){ beep(880, 0.09, 'square', 0.1); }, 70); setTimeout(function(){ beep(1100, 0.14, 'square', 0.1); }, 140); }
  function sndMiss()  { beep(300, 0.25, 'sawtooth', 0.1, -220); }
  function sndSkunk() { beep(140, 0.35, 'sawtooth', 0.14, -90); }
  function sndOver()  { beep(320, 0.2, 'triangle', 0.12, -120); setTimeout(function(){ beep(220, 0.3, 'triangle', 0.12, -120); }, 180); }

  // ---------- 랭킹 (이 기기 기록 + 친구 도전장 기록) ----------
  var RANK_MAX = 12;
  var RANK_KEY = 'moleMashRanks';
  var ranks = [], myRankRow = null;
  function loadRanks() {
    try {
      var raw = JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s); })
        .map(function (r) { return { n: String(r.n || 'Me').slice(0, 8), s: Math.max(0, Math.round(r.s)), f: r.f ? 1 : 0, t: r.t || 0 }; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, RANK_MAX);
    } catch (e) { return []; }
  }
  function saveRanks(list) {
    try { localStorage.setItem(RANK_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function loadName() {
    try { return (localStorage.getItem('moleMashName') || '').slice(0, 8); } catch (e) { return ''; }
  }
  function saveName(v) { try { localStorage.setItem('moleMashName', v); } catch (e) {} }

  function renderRanks() {
    var board = document.getElementById('rank-board');
    board.textContent = '';
    if (!ranks.length) {
      var empty = document.createElement('div');
      empty.className = 'rank-empty';
      empty.textContent = 'No scores yet.';
      board.appendChild(empty);
      return;
    }
    ranks.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row' + (r === myRankRow ? ' me' : '');
      var pos = document.createElement('span');
      pos.className = 'rank-pos';
      pos.textContent = '#' + (i + 1);
      var name = document.createElement('span');
      name.className = 'rank-name';
      name.textContent = r.n;               // 이름은 항상 텍스트로만 — 주입 방지
      if (r.f) {
        var tag = document.createElement('span');
        tag.className = 'rank-friend';
        tag.textContent = '👥friend';
        name.appendChild(tag);
      }
      var s = document.createElement('span');
      s.className = 'rank-s';
      s.textContent = r.s + ' moles';
      row.append(pos, name, s);
      board.appendChild(row);
    });
    var me = board.querySelector('.rank-row.me');
    if (me) me.scrollIntoView({ block: 'nearest' });
  }

  function recordRank(s) {
    ranks = loadRanks();
    var entry = { n: loadName() || 'Me', s: Math.round(s), f: 0, t: Date.now() };
    ranks.push(entry);
    ranks.sort(function (a, b) { return b.s - a.s; });
    ranks = ranks.slice(0, RANK_MAX);
    myRankRow = ranks.indexOf(entry) >= 0 ? entry : null;
    saveRanks(ranks);
    renderRanks();
  }

  // ---------- 도전장 (공유 링크에 실려 오는 친구 기록) ----------
  var chScore = 0, chName = '', chBeaten = false;
  function readHashChallenge() {
    var hash = location.hash || '';
    var mc = /(?:^|[#&])c=(\d{1,5})/.exec(hash);
    if (!mc) return false;
    var mn = /(?:^|[#&])n=([^&]{1,64})/.exec(hash);
    chScore = Math.min(99999, parseInt(mc[1], 10) || 0);
    chName = 'Friend';
    if (mn) {
      try { chName = decodeURIComponent(mn[1]).slice(0, 8) || 'Friend'; } catch (e) {}
    }
    return chScore > 0;
  }
  function absorbChallenge() {
    // 친구 기록을 랭킹판에 넣어 준다 (중복은 한 번만)
    if (chScore <= 0) return;
    var list = loadRanks();
    var dup = list.some(function (r) { return r.f && r.n === chName && r.s === chScore; });
    if (!dup) {
      list.push({ n: chName, s: chScore, f: 1, t: Date.now() });
      list.sort(function (a, b) { return b.s - a.s; });
      saveRanks(list.slice(0, RANK_MAX));
    }
  }
  if (readHashChallenge()) absorbChallenge();
  window.addEventListener('hashchange', function () {
    if (readHashChallenge()) { absorbChallenge(); chBeaten = false; }
  });

  // ---------- 공유 ----------
  function challengeUrl(s) {
    try {
      var u = new URL(location.href);
      var n = loadName() || 'Me';
      u.hash = 'c=' + Math.round(s) + '&n=' + encodeURIComponent(n);
      return u.href;
    } catch (e) { return ''; }
  }
  function note(msg) {
    var el = document.getElementById('share-note');
    el.textContent = msg;
    clearTimeout(note._t);
    note._t = setTimeout(function () { el.textContent = ''; }, 3200);
  }
  function shareResult() {
    var s = Math.round(lastScore);
    var url = challengeUrl(s);
    var text = '🔨 Mole Mash — I whacked ' + s + ' moles!\nThink your hands are faster?';
    var full = url ? text + '\n' + url : text;
    var done = function () { note('Challenge sent!'); };
    if (navigator.share) {
      navigator.share(url ? { title: 'Mole Mash', text: text, url: url } : { title: 'Mole Mash', text: text })
        .then(done)
        .catch(function (e) {
          if (e && e.name === 'AbortError') return;   // 사용자가 취소한 것은 실패가 아니다
          copyFallback(full);
        });
      return;
    }
    copyFallback(full);
  }
  function copyFallback(full) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full)
        .then(function () { note('Challenge link copied!'); })
        .catch(function () { manualCopy(full); });
      return;
    }
    manualCopy(full);
  }
  function manualCopy(full) {
    var fb = document.getElementById('share-fallback');
    fb.value = full;
    fb.classList.remove('hidden');
    fb.focus(); fb.select();
    note('Copy the link below and send it');
  }

  // ---------- 판 리셋 ----------
  function reset() {
    moles = [];
    score = 0;
    lives = 3;
    playT = 0;
    introT = 2.0;
    spawnTimer = 0.5;
    floats = [];
    mallets = [];
    puffs = [];
    particles = [];
    shake = 0;
    heartFlash = 0;
    hitStop = 0;
    flashA = 0;
    timeLeft = TIME_LIMIT;
    lastTick = -1;
    isNewBest = false;
    chBeaten = false;
  }

  // 타격 파편 — 명중 지점에서 사방으로 튄다
  function spawnBurst(x, y, colors, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = speed * (0.4 + Math.random() * 0.8);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - speed * 0.5,
        r: 2.5 + Math.random() * 3.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        t: 0, life: 0.45 + Math.random() * 0.25
      });
    }
  }

  // ---------- 등장 ----------
  function occupiedHoles() {
    var set = {};
    for (var i = 0; i < moles.length; i++) set[moles[i].hole] = 1;
    return set;
  }
  function activeCount() {
    var n = 0;
    for (var i = 0; i < moles.length; i++) if (moles[i].phase !== 'whacked') n++;
    return n;
  }
  function spawnMole() {
    var occ = occupiedHoles();
    var free = [];
    for (var i = 0; i < holes.length; i++) if (!occ[i]) free.push(i);
    if (!free.length) return;
    var hole = free[Math.floor(Math.random() * free.length)];
    var kind = 'mole';
    var roll = Math.random();
    if (score >= 6 && roll < 0.16) kind = 'skunk';          // 때리면 안 되는 것
    else if (score >= 10 && roll > 0.92) kind = 'gold';     // 보너스 + 하트 회복
    var st = stayTime();
    if (kind === 'gold') st *= 0.62;                        // 황금은 더 빨리 숨는다
    if (kind === 'skunk') st *= 0.85;
    moles.push({ hole: hole, kind: kind, phase: 'rise', p: 0, stayT: st, t: 0, face: Math.random() < 0.5 ? -1 : 1 });
  }

  // ---------- 조작: 탭 = 그 자리 내려치기 (탭 전용 — 홀드/드래그 없음) ----------
  function whackAt(px, py) {
    if (state !== STATE_PLAY) return;
    mallets.push({ x: px, y: py, t: 0 });

    // 어느 굴을 노렸나 — 굴 중심 기준 셀 반경 안이면 인정 (관대한 히트박스)
    var hitHole = -1, bestD = 1e9;
    for (var i = 0; i < holes.length; i++) {
      var h = holes[i];
      var dx = px - h.x, dy = py - (h.y - moleH * 0.4);
      var d = dx * dx + dy * dy;
      var rad = cellW * 0.62;
      if (d < rad * rad && d < bestD) { bestD = d; hitHole = i; }
    }
    if (hitHole < 0) {
      puffs.push({ x: px, y: py, t: 0, color: 'rgba(120,180,80,0.7)' });   // 헛스윙 — 잔디만 퍽
      return;
    }

    for (var m = 0; m < moles.length; m++) {
      var mo = moles[m];
      if (mo.hole !== hitHole || mo.phase === 'whacked' || mo.p < 0.12) continue;
      var hx = holes[hitHole].x, hy = holes[hitHole].y;
      if (mo.kind === 'skunk') {
        mo.phase = 'whacked'; mo.t = 0;
        loseLife('P.U.!', hx, hy - moleH * 0.6, '#3aa02c');
        puffs.push({ x: hx, y: hy - moleH * 0.5, t: 0, color: 'rgba(120,190,60,0.85)' });
        spawnBurst(hx, hy - moleH * 0.5, ['#7fbf3c', '#a8d95e', '#4c7a22'], 10, 200);
        buzz(60);
        sndSkunk();
      } else if (mo.kind === 'gold') {
        mo.phase = 'whacked'; mo.t = 0;
        score += 3;
        if (lives < 3) { lives++; floats.push({ x: hx, y: hy - moleH - 26, text: '+❤️', color: '#ff5f6e', t: 0, size: 20 }); }
        floats.push({ x: hx, y: hy - moleH, text: '+3', color: '#e8a800', t: 0, size: 30 });
        spawnBurst(hx, hy - moleH * 0.5, ['#ffd94d', '#ffef9e', '#f4b820', '#fff'], 16, 260);
        hitStop = 0.09;
        flashA = 0.28;
        shake = 9;
        buzz(35);
        sndGold();
        checkChallenge();
      } else {
        mo.phase = 'whacked'; mo.t = 0;
        score += 1;
        floats.push({ x: hx, y: hy - moleH, text: 'BONK!', color: '#d1342a', t: 0, size: 24 });
        spawnBurst(hx, hy - moleH * 0.5, ['#8a5a34', '#a97544', '#5b3a1e', '#ffd94d'], 12, 220);
        hitStop = 0.055;
        shake = 6;
        buzz(20);
        sndBonk();
        checkChallenge();
      }
      return;
    }
    // 굴은 맞았는데 두더지가 없다 — 흙먼지만
    puffs.push({ x: holes[hitHole].x, y: holes[hitHole].y, t: 0, color: 'rgba(150,105,60,0.8)' });
  }

  function checkChallenge() {
    if (chScore > 0 && !chBeaten && score > chScore) {
      chBeaten = true;
      floats.push({ x: W / 2, y: H * 0.3, text: '🏆 Beat ' + chName + '!', color: '#1d8a3c', t: 0, size: 28 });
      shake = 6;
    }
  }

  function loseLife(text, x, y, color) {
    lives--;
    heartFlash = 1;
    shake = 6;
    floats.push({ x: x, y: y, text: text, color: color, t: 0, size: 24 });
    if (lives <= 0) gameOver('hearts');
  }

  function tryStart() {
    if (state === STATE_OVER && performance.now() - overAt < 600) return; // 오터치 방지
    document.getElementById('over-panel').classList.add('hidden');
    reset();
    state = STATE_PLAY;
  }

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (state !== STATE_PLAY) tryStart();
    }
    // 데스크톱 테스트용: 1~9 = 해당 굴 내려치기
    var n = parseInt(e.key, 10);
    if (state === STATE_PLAY && n >= 1 && n <= 9) {
      var h = holes[n - 1];
      whackAt(h.x, h.y - moleH * 0.4);
    }
  });

  // 터치: 탭한 자리를 내려친다 (탭 전용)
  // preventDefault를 걸지 않는다 — 세로 팬이 완충지대 스크롤로 소비되어야
  // 인앱 브라우저 시트가 끌기를 가로채지 않는다
  var lastTouchAt = 0; // 터치 뒤에 따라오는 호환용 mousedown 무시 (한 탭 = 한 번)
  canvas.addEventListener('touchstart', function (e) {
    lastTouchAt = performance.now();
    audio();
    if (state !== STATE_PLAY) { tryStart(); return; }
    var t = e.touches && e.touches[0];
    if (t) whackAt(t.clientX, t.clientY);
  }, { passive: true });

  canvas.addEventListener('mousedown', function (e) {
    if (performance.now() - lastTouchAt < 800) return;
    audio();
    if (state !== STATE_PLAY) { tryStart(); return; }
    whackAt(e.clientX, e.clientY);
  });

  // ---------- 패널 버튼 ----------
  document.getElementById('retry-btn').addEventListener('click', function () { tryStart(); });
  document.getElementById('share-btn').addEventListener('click', function () { shareResult(); });
  var nameInput = document.getElementById('name-input');
  nameInput.value = loadName();
  nameInput.addEventListener('input', function () {
    var v = nameInput.value.slice(0, 8);
    saveName(v);
    if (myRankRow) { myRankRow.n = v || 'Me'; saveRanks(ranks); renderRanks(); }
  });

  // ---------- 게임오버 ----------
  function gameOver(reason) {
    state = STATE_OVER;
    overReason = reason || 'hearts';
    overAt = performance.now();
    shake = 10;
    lastScore = score;
    sndOver();
    if (score > best) {
      best = score;
      isNewBest = true;
      try { localStorage.setItem('moleMashBest', String(best)); } catch (e) {}
    }
    recordRank(score);
    showOverPanel();
  }

  function showOverPanel() {
    document.getElementById('over-title').textContent =
      overReason === 'time' ? '⏰ TIME\'S UP!' : '💔 OUT OF HEARTS!';
    document.getElementById('over-score').textContent = lastScore + ' moles';
    var sub = document.getElementById('over-sub');
    sub.className = '';
    if (chScore > 0) {
      if (lastScore > chScore) {
        sub.textContent = '🏆 You beat ' + chName + ' (' + chScore + ')!';
        sub.className = 'win';
      } else if (lastScore === chScore) {
        sub.textContent = 'Tied with ' + chName + ' at ' + chScore + '!';
        sub.className = 'lose';
      } else {
        sub.textContent = (chScore - lastScore) + ' more to beat ' + chName + '…';
        sub.className = 'lose';
      }
    } else if (isNewBest) {
      sub.textContent = '🎉 New best!';
      sub.className = 'newbest';
    } else {
      sub.textContent = 'Best: ' + best + ' moles';
    }
    document.getElementById('board-title').textContent = '🏅 Leaderboard — fastest hands';
    ranks = loadRanks();
    renderRanks();
    document.getElementById('share-fallback').classList.add('hidden');
    document.getElementById('over-panel').classList.remove('hidden');
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 26);
    if (heartFlash > 0) heartFlash = Math.max(0, heartFlash - dt * 2.5);
    if (flashA > 0) flashA = Math.max(0, flashA - dt * 1.6);
    for (var i = floats.length - 1; i >= 0; i--) {
      floats[i].t += dt;
      if (floats[i].t > 1.1) floats.splice(i, 1);
    }
    for (var j = mallets.length - 1; j >= 0; j--) {
      mallets[j].t += dt;
      if (mallets[j].t > 0.28) mallets.splice(j, 1);
    }
    for (var k = puffs.length - 1; k >= 0; k--) {
      puffs[k].t += dt;
      if (puffs[k].t > 0.5) puffs.splice(k, 1);
    }
    for (var q = particles.length - 1; q >= 0; q--) {
      var pa = particles[q];
      pa.t += dt;
      pa.vy += 900 * dt;
      pa.x += pa.vx * dt;
      pa.y += pa.vy * dt;
      if (pa.t > pa.life) particles.splice(q, 1);
    }

    if (state !== STATE_PLAY) return;
    // 히트스톱: 명중 순간 게임만 잠깐 멈춘다 (연출은 위에서 계속 돈다)
    if (hitStop > 0) { hitStop -= dt; return; }
    playT += dt;
    if (introT > 0) introT -= dt;

    // 제한시간 카운트다운 — 마지막 5초는 삑 소리
    timeLeft -= dt;
    var sec = Math.ceil(timeLeft);
    if (sec <= 5 && sec >= 1 && sec !== lastTick) { lastTick = sec; sndTick(); }
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver('time');
      return;
    }

    // 두더지 상태기계: 쑥 올라온 뒤 stayT 동안 눈에 보이게 가라앉는다 — 타이밍 창이 화면에 그대로 보인다
    for (var m = moles.length - 1; m >= 0; m--) {
      var mo = moles[m];
      mo.t += dt;
      if (mo.phase === 'rise') {
        mo.p += dt / 0.14;
        if (mo.p >= 1) { mo.p = 1; mo.phase = 'sink'; }
      } else if (mo.phase === 'sink') {
        mo.p -= dt / mo.stayT;
        if (mo.p <= 0) {
          var h = holes[mo.hole];
          if (mo.kind === 'mole' || mo.kind === 'gold') {
            loseLife('MISSED!', h.x, h.y - moleH * 0.7, '#d1342a');
            sndMiss();
          }
          moles.splice(m, 1);
          if (state !== STATE_PLAY) return;
        }
      } else if (mo.phase === 'whacked') {
        if (mo.t > 0.3) moles.splice(m, 1);
      }
    }

    // 등장 타이머
    spawnTimer -= dt;
    if (spawnTimer <= 0 && activeCount() < maxActive()) {
      spawnMole();
      spawnTimer = spawnGap() * (0.75 + Math.random() * 0.5);
    }
  }

  // ---------- 그리기 ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackdrop() {
    // 잔디밭
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fd45e');
    g.addColorStop(1, '#6db544');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 카니발 텐트 스트라이프 (상단)
    var bandH = Math.max(46, H * 0.075);
    var stripeW = 42;
    for (var i = -1; i < W / stripeW + 1; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#e4342c' : '#fff6ea';
      ctx.beginPath();
      ctx.moveTo(i * stripeW, 0);
      ctx.lineTo((i + 1) * stripeW, 0);
      ctx.lineTo((i + 1) * stripeW, bandH - 14);
      ctx.lineTo(i * stripeW + stripeW / 2, bandH + 6);
      ctx.lineTo(i * stripeW, bandH - 14);
      ctx.closePath();
      ctx.fill();
    }
    // 텐트 아래 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, bandH + 4, W, 5);

    // 잔디 터프 (장식)
    ctx.strokeStyle = 'rgba(70,140,50,0.5)';
    ctx.lineWidth = 2;
    for (var t = 0; t < 14; t++) {
      var tx = (t * 97 + 31) % Math.max(1, W);
      var ty = H * 0.24 + ((t * 173) % Math.max(1, Math.round(H * 0.66)));
      ctx.beginPath();
      ctx.moveTo(tx, ty); ctx.lineTo(tx - 4, ty - 8);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + 1, ty - 9);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + 5, ty - 7);
      ctx.stroke();
    }
  }

  function drawHoleBack(h) {
    // 굴 뒷벽(어둠)과 흙둔덕 뒤편
    ctx.fillStyle = '#5b3a1e';
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, h.rx + 7, h.ry + 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#241207';
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, h.rx, h.ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHoleFront(h) {
    // 굴 앞 테두리 — 두더지 몸통 아래를 가려서 '땅속에서 나온' 느낌을 만든다
    ctx.fillStyle = '#6b4525';
    ctx.beginPath();
    ctx.ellipse(h.x, h.y + 3, h.rx + 7, h.ry + 4, 0, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#7d5430';
    ctx.beginPath();
    ctx.ellipse(h.x, h.y + 1, h.rx + 2, h.ry + 1, 0, 0, Math.PI);
    ctx.fill();
  }

  function drawMole(mo) {
    var h = holes[mo.hole];
    var p = mo.p;
    var squash = 0;
    if (mo.phase === 'whacked') {
      squash = Math.min(1, mo.t / 0.08);
      p = Math.max(0, mo.p - mo.t * 2.2);       // 맞으면 쑥 들어간다
    }
    if (p <= 0) return;

    var mw = moleW, mh = moleH;
    if (mo.kind === 'gold') { mw *= 0.92; mh *= 0.92; }
    var topY = h.y - p * mh;                     // p=1이면 완전히 올라옴

    ctx.save();
    // 굴 위로만 보이게 클립
    ctx.beginPath();
    ctx.rect(h.x - mw, h.y - mh - 26, mw * 2, mh + 26);
    ctx.clip();

    var bodyY = topY + (squash > 0 ? mh * 0.16 * squash : 0);
    var bw = mw * (1 + 0.25 * squash);
    var bh = mh * (1 - 0.2 * squash);

    if (mo.kind === 'skunk') {
      // 스컹크: 검은 몸통 + 흰 줄
      ctx.fillStyle = '#26222b';
      roundRect(h.x - bw / 2, bodyY, bw, bh + 20, bw * 0.42);
      ctx.fill();
      ctx.fillStyle = '#f4f2ee';
      roundRect(h.x - bw * 0.13, bodyY - 4, bw * 0.26, bh * 0.72, bw * 0.13);
      ctx.fill();
      // 꼬리 느낌의 흰 테
      ctx.fillStyle = '#f4f2ee';
      ctx.beginPath();
      ctx.ellipse(h.x, bodyY + 2, bw * 0.2, bw * 0.12, 0, Math.PI, 0);
      ctx.fill();
    } else {
      // 두더지 몸통
      var bodyC = mo.kind === 'gold' ? '#f4b820' : '#8a5a34';
      var bodyD = mo.kind === 'gold' ? '#c98f08' : '#6b4223';
      ctx.fillStyle = bodyC;
      roundRect(h.x - bw / 2, bodyY, bw, bh + 20, bw * 0.42);
      ctx.fill();
      ctx.strokeStyle = bodyD;
      ctx.lineWidth = 2;
      ctx.stroke();
      // 배
      ctx.fillStyle = mo.kind === 'gold' ? '#ffe9a8' : '#c99e75';
      ctx.beginPath();
      ctx.ellipse(h.x, bodyY + bh * 0.62, bw * 0.3, bh * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 얼굴 (공통)
    var eyeY = bodyY + bh * 0.28;
    var isWhacked = mo.phase === 'whacked';
    ctx.fillStyle = '#1c1c1c';
    if (isWhacked) {
      // 기절: X자 눈
      ctx.strokeStyle = '#1c1c1c';
      ctx.lineWidth = 2.5;
      [-1, 1].forEach(function (s) {
        var ex = h.x + s * bw * 0.18;
        ctx.beginPath();
        ctx.moveTo(ex - 5, eyeY - 5); ctx.lineTo(ex + 5, eyeY + 5);
        ctx.moveTo(ex + 5, eyeY - 5); ctx.lineTo(ex - 5, eyeY + 5);
        ctx.stroke();
      });
    } else {
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.arc(h.x + s * bw * 0.18, eyeY, bw * 0.055, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    // 코
    ctx.fillStyle = mo.kind === 'skunk' ? '#e05a7a' : '#e07a9a';
    ctx.beginPath();
    ctx.ellipse(h.x, eyeY + bh * 0.14, bw * 0.1, bw * 0.075, 0, 0, Math.PI * 2);
    ctx.fill();
    if (mo.kind !== 'skunk' && !isWhacked) {
      // 앞니
      ctx.fillStyle = '#fff';
      ctx.fillRect(h.x - bw * 0.07, eyeY + bh * 0.23, bw * 0.065, bh * 0.1);
      ctx.fillRect(h.x + bw * 0.005, eyeY + bh * 0.23, bw * 0.065, bh * 0.1);
    }
    // 수염
    ctx.strokeStyle = 'rgba(30,30,30,0.55)';
    ctx.lineWidth = 1.4;
    [-1, 1].forEach(function (s) {
      for (var wsk = 0; wsk < 2; wsk++) {
        ctx.beginPath();
        ctx.moveTo(h.x + s * bw * 0.14, eyeY + bh * 0.13 + wsk * 4);
        ctx.lineTo(h.x + s * bw * 0.4, eyeY + bh * 0.1 + wsk * 7);
        ctx.stroke();
      }
    });
    // 발 (몸통 옆에 얹기)
    if (!isWhacked && mo.kind !== 'skunk') {
      ctx.fillStyle = mo.kind === 'gold' ? '#e0a812' : '#7a4e2b';
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.ellipse(h.x + s * bw * 0.44, bodyY + bh * 0.55, bw * 0.1, bw * 0.14, s * 0.4, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    // 황금 반짝이
    if (mo.kind === 'gold' && !isWhacked) {
      var tw = performance.now() / 130;
      ctx.fillStyle = 'rgba(255,240,160,' + (0.5 + 0.5 * Math.sin(tw)) + ')';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✦', h.x - bw * 0.42, bodyY - 4);
      ctx.fillText('✦', h.x + bw * 0.42, bodyY + 8);
    }
    ctx.restore();
  }

  function drawMallet(m) {
    var k = m.t / 0.28;
    var ang = -1.1 + Math.min(1, k * 2.6) * 1.1;    // 휘둘러 내려침
    var alpha = k < 0.75 ? 1 : (1 - (k - 0.75) / 0.25);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(m.x + 26, m.y - 20);
    ctx.rotate(ang);
    // 자루
    ctx.fillStyle = '#b5793a';
    roundRect(-4, -6, 8, 52, 4);
    ctx.fill();
    // 머리
    ctx.fillStyle = '#d1342a';
    roundRect(-20, -30, 40, 26, 8);
    ctx.fill();
    ctx.fillStyle = '#f2eee4';
    roundRect(-20, -30, 40, 8, 4);
    ctx.fill();
    ctx.restore();
    // 임팩트 별
    if (k > 0.3 && k < 0.8) {
      ctx.save();
      ctx.globalAlpha = 1 - (k - 0.3) / 0.5;
      ctx.fillStyle = '#ffd94d';
      ctx.font = 'bold 20px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✶', m.x - 16, m.y - 8);
      ctx.fillText('✶', m.x + 12, m.y + 10);
      ctx.restore();
    }
  }

  function drawPuff(p) {
    var k = p.t / 0.5;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = p.color;
    for (var i = 0; i < 3; i++) {
      var a = i * 2.1 + 0.5;
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(a) * (8 + k * 22), p.y - k * 14 + Math.sin(a) * 6, 6 + k * 8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHud() {
    // 점수
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3d2812';
    ctx.font = 'bold 46px -apple-system, sans-serif';
    ctx.fillText(String(score), W / 2, H * 0.135);
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(61,40,18,0.65)';
    ctx.fillText('BEST ' + best, W / 2, H * 0.135 + 20);

    // 제한시간 바 — 줄어드는 것이 항상 눈에 보이게
    var low = timeLeft <= 8, crit = timeLeft <= 5;
    var bw = Math.min(W * 0.56, 230), bh = 14;
    var bx = W / 2 - bw / 2, by = H * 0.135 + 30;
    var pulse = crit ? 1 + 0.06 * Math.sin(performance.now() / 80) : 1;
    ctx.save();
    ctx.translate(W / 2, by + bh / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-W / 2, -(by + bh / 2));
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(bx - 2, by - 2, bw + 4, bh + 4, 8);
    ctx.fill();
    var frac = Math.max(0, timeLeft / TIME_LIMIT);
    ctx.fillStyle = crit ? '#e4342c' : (low ? '#f08c1e' : '#3f9e3f');
    if (frac > 0) {
      roundRect(bx, by, Math.max(bh, bw * frac), bh, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.fillText('⏱ ' + Math.ceil(timeLeft) + 's', W / 2, by + bh - 3);
    ctx.restore();

    // 목숨 하트
    var hx = W / 2 - 44;
    for (var i = 0; i < 3; i++) {
      var on = i < lives;
      ctx.save();
      if (heartFlash > 0 && i === lives) ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 90));
      ctx.font = '22px -apple-system, sans-serif';
      ctx.globalAlpha *= on ? 1 : 0.25;
      ctx.fillText(on ? '❤️' : '🖤', hx + i * 34, H * 0.135 + 74);
      ctx.restore();
    }

    // 도전 목표
    if (chScore > 0 && !chBeaten) {
      ctx.fillStyle = 'rgba(47,111,214,0.95)';
      ctx.font = 'bold 14px -apple-system, sans-serif';
      ctx.fillText('⚔️ Beat ' + chName + ': ' + chScore, W / 2, H * 0.135 + 100);
    }
  }

  function drawSign() {
    // 나무 간판 (타이틀 화면)
    var sw = Math.min(W * 0.82, 340), sh = 88;
    var sx = W / 2 - sw / 2, sy = H * 0.16;
    ctx.fillStyle = '#8a5a34';
    roundRect(sx - 6, sy - 6, sw + 12, sh + 12, 12);
    ctx.fill();
    ctx.fillStyle = '#a97544';
    roundRect(sx, sy, sw, sh, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,45,15,0.5)';
    ctx.lineWidth = 2;
    for (var i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(sx + 4, sy + (sh / 3) * i);
      ctx.lineTo(sx + sw - 4, sy + (sh / 3) * i);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff6ea';
    ctx.textAlign = 'center';
    var ts = 44;
    ctx.font = 'bold ' + ts + 'px Impact, "Arial Black", -apple-system, sans-serif';
    while (ts > 22 && ctx.measureText('MOLE MASH').width > sw * 0.9) {
      ts -= 2;
      ctx.font = 'bold ' + ts + 'px Impact, "Arial Black", -apple-system, sans-serif';
    }
    ctx.fillText('MOLE MASH', W / 2, sy + sh * 0.62);
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.fillStyle = '#b03020';
    ctx.fillText('★ COUNTY FAIR CLASSIC ★', W / 2, sy + sh + 22);
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBackdrop();

    // 굴 + 두더지 (뒷벽 → 두더지 → 앞테두리 순서)
    for (var i = 0; i < holes.length; i++) drawHoleBack(holes[i]);
    for (var m = 0; m < moles.length; m++) drawMole(moles[m]);
    for (var j = 0; j < holes.length; j++) drawHoleFront(holes[j]);

    for (var p = 0; p < puffs.length; p++) drawPuff(puffs[p]);

    // 타격 파편
    for (var pt = 0; pt < particles.length; pt++) {
      var pa = particles[pt];
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - pa.t / pa.life);
      ctx.fillStyle = pa.color;
      ctx.beginPath();
      ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (var mk = 0; mk < mallets.length; mk++) drawMallet(mallets[mk]);

    // 떠오르는 텍스트 — 처음에 크게 튀었다가 가라앉는 팝
    for (var f = 0; f < floats.length; f++) {
      var fl = floats[f];
      var pop = 1 + 0.55 * Math.max(0, 1 - fl.t / 0.18);
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1.1 - fl.t) / 0.4);
      ctx.fillStyle = fl.color;
      ctx.font = 'bold ' + Math.round(fl.size * pop) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(fl.text, fl.x, fl.y - fl.t * 46);
      ctx.restore();
    }

    // 황금 두더지 화면 플래시
    if (flashA > 0) {
      ctx.fillStyle = 'rgba(255,244,200,' + flashA.toFixed(3) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    if (state === STATE_PLAY) {
      drawHud();
      if (introT > 0) {
        var blink = 0.55 + 0.45 * Math.sin(performance.now() / 90);
        ctx.save();
        ctx.globalAlpha = Math.min(1, introT / 0.35) * blink;
        ctx.fillStyle = '#d1342a';
        ctx.font = 'bold 26px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TAP THE MOLES!', W / 2, H * 0.31);
        ctx.restore();
      }
    } else if (state === STATE_TITLE) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(0, 0, W, H);
      drawSign();
      // 설명 카드 — 구멍 위에 글씨가 겹치지 않게 판을 깔아 준다
      var iy = H * 0.16 + 152;
      var cardH = 148 + (best > 0 ? 28 : 0) + (chScore > 0 ? 30 : 0);
      var cardW = Math.min(W * 0.88, 330);
      ctx.fillStyle = 'rgba(255,246,234,0.94)';
      roundRect(W / 2 - cardW / 2, iy - 26, cardW, cardH, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(138,90,52,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#3d2812';
      ctx.font = '16px -apple-system, sans-serif';
      ctx.fillText('🔨 Tap moles before they hide', W / 2, iy);
      ctx.fillText('💨 Miss one — lose a heart', W / 2, iy + 26);
      ctx.fillStyle = '#1c7a1c';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.fillText('🦨 DON\'T tap the skunk!', W / 2, iy + 52);
      ctx.fillStyle = '#b8860b';
      ctx.fillText('✦ Gold mole = +3 & a heart back', W / 2, iy + 78);
      ctx.fillStyle = '#c0392b';
      ctx.fillText('⏱ ' + TIME_LIMIT + ' seconds on the clock!', W / 2, iy + 104);
      if (best > 0) {
        ctx.fillStyle = 'rgba(61,40,18,0.75)';
        ctx.font = '15px -apple-system, sans-serif';
        ctx.fillText('Best: ' + best + ' moles', W / 2, iy + 132);
      }
      if (chScore > 0) {
        ctx.fillStyle = '#2f6fd6';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillText('⚔️ ' + chName + ' challenges you: beat ' + chScore + '!', W / 2, iy + (best > 0 ? 160 : 132));
      }
      var a = 0.55 + 0.45 * Math.sin(performance.now() / 350);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#3d2812';
      ctx.font = 'bold 22px -apple-system, sans-serif';
      ctx.fillText('TAP TO START', W / 2, H * 0.78);
      ctx.restore();
    } else if (state === STATE_OVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
  }

  // ---------- 루프 ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 인앱 브라우저 시트 닫힘 방지: 문서 스크롤을 완충지대 중간(120px)에 걸어 둔다.
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  requestAnimationFrame(loop);

  // 헤드리스 테스트용 훅 (해시에 debug가 있을 때만)
  if ((location.hash || '').indexOf('debug') >= 0) {
    window.__game = {
      get state() { return state; },
      get score() { return score; },
      get lives() { return lives; },
      get timeLeft() { return timeLeft; },
      set timeLeft(v) { timeLeft = v; },
      get moles() { return moles; },
      get chScore() { return chScore; },
      get chName() { return chName; },
      holeCenter: function (i) { var h = holes[i]; return { x: h.x, y: h.y - moleH * 0.4 }; },
      whackAt: whackAt,
      tryStart: tryStart,
      spawnMole: spawnMole
    };
  }
})();
</script>

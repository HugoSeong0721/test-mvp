<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Why Did the Chicken Cross the Road?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #79b850;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #game {
    display: block;
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
  }
  /* ── 게임오버 패널 (랭킹 / 도전장) ── */
  #over-panel {
    position: fixed;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(330px, 88vw);
    background: rgba(28, 30, 44, 0.95);
    color: #fff;
    border-radius: 16px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  #over-panel.hidden { display: none; }
  #over-title { font-size: 24px; font-weight: 800; }
  #over-score { font-size: 36px; font-weight: 800; margin-top: 2px; color: #ffd36e; }
  #over-sub { font-size: 15px; margin-top: 4px; min-height: 18px; color: rgba(255,255,255,0.75); }
  #over-sub.newbest { color: #ffd36e; font-weight: 700; }
  #over-sub.win { color: #7ee787; font-weight: 700; }
  #over-sub.lose { color: #ff8f7a; font-weight: 700; }
  #board-title { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.6); text-align: left; padding-left: 4px; }
  #rank-board {
    margin: 6px 0 8px;
    max-height: 158px; overflow-y: auto;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 14px;
  }
  .rank-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(255, 211, 110, 0.18); }
  .rank-pos { width: 30px; text-align: left; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
  .rank-row.me .rank-pos { color: #ffd36e; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-friend { font-size: 11px; color: #8ecbff; margin-left: 4px; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
  #name-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  #name-input {
    width: 92px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 5px 8px;
    text-align: center;
  }
  #over-btns { display: flex; gap: 8px; }
  #over-btns button {
    flex: 1;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #retry-btn { background: #ffd36e; color: #3c2a08; }
  #share-btn { background: rgba(255,255,255,0.14); color: #fff; }
  #share-note { font-size: 12px; color: #7ee787; min-height: 15px; margin-top: 7px; }
  #share-fallback {
    width: 100%; margin-top: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff;
    font-size: 12px; padding: 6px 8px;
  }
  #share-fallback.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="over-panel" class="hidden">
  <div id="over-title">🐔 SPLAT!</div>
  <div id="over-score"></div>
  <div id="over-sub"></div>
  <div id="board-title"></div>
  <div id="rank-board"></div>
  <div id="name-row"><span>Name</span><input id="name-input" maxlength="8" placeholder="you"></div>
  <div id="over-btns">
    <button id="share-btn">⚔️ Challenge a friend</button>
    <button id="retry-btn">Cross again</button>
  </div>
  <div id="share-note"></div>
  <input id="share-fallback" class="hidden" readonly>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, ROW_H = 56, CY = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ROW_H = Math.max(46, Math.min(72, H / 8.5));
    CY = Math.round(H * 0.56);   // 닭의 고정 화면 높이
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 상수 ----------
  var HOP_DUR = 0.13;       // 한 칸 점프 시간
  var CHICK_HW = 13;        // 닭 충돌 반폭
  var COMBINE_MAX_LAG = 3.3;// 콤바인 최대 뒤처짐(줄) — 항상 화면 안에 보이게
  var CAR_COLORS = [
    ['#e8543f', '#f7876f'], // 머슬카 레드
    ['#3f7fe8', '#79aef5'], // 블루
    ['#f2b23c', '#f8d47f'], // 스쿨버스 옐로
    ['#57b660', '#8fd695'], // 그린
    ['#9a6fd8', '#c1a3ee'], // 퍼플
    ['#e86fae', '#f3a8cd']  // 핑크
  ];
  var PUNCHLINES = {       // 마일스톤 조크 — 제목의 답을 계속 미룬다
    10: 'TO GET TO THE OTHER SIDE!',
    25: '...WAIT, IT KEEPS GOING?!',
    50: '50 ROADS! LEGENDARY CLUCKER',
    100: '100?! COOP HALL OF FAME'
  };

  // ---------- 상태 ----------
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_TITLE;

  var rows = {};            // r → 줄 데이터 (아래에서 위로 r 증가)
  var genMaxR = -1;
  var cr = 0;               // 닭이 있는(목표) 줄
  var fromRow = 0, hopT = 1, hopPending = false;
  var camRow = 0;           // 카메라가 따라가는 줄(float)
  var combineRow = -4.2;    // 콤바인 위치(줄, float)
  var elapsed = 0, introT = 0;
  var pops = [];            // {text, t, dur, big}
  var feathers = [];        // 죽음 연출 깃털
  var deathAnim = 0, deathBy = '';
  var overAt = 0;
  var shake = 0, closeCd = 0;
  var lastScore = 0;
  var wingT = 0;

  var best = 0;
  try { best = parseInt(localStorage.getItem('chickenCrossBest') || '0', 10) || 0; } catch (e) {}
  var isNewBest = false;

  // ---------- 난이도 ----------
  function carSpeed(r)  { return Math.min(250, 80 + r * 2.1 + rows[r].spdJit); }
  function combineSpeed() { return Math.min(1.5, 0.5 + elapsed * 0.017); }

  // ---------- 줄 생성 ----------
  function grassRow(r) {
    var bushes = [];
    var n = 1 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      var x = Math.random() * W;
      if (Math.abs(x - W / 2) < 44) continue;   // 닭 자리 비워둠 (시각적)
      bushes.push({ x: x, s: 0.7 + Math.random() * 0.6, flower: Math.random() < 0.3 });
    }
    return { type: 'grass', bushes: bushes };
  }
  function roadRow(r) {
    var row = {
      type: 'road',
      dir: Math.random() < 0.5 ? -1 : 1,
      spdJit: Math.random() * 45,
      off: 0,
      cars: [],
      span: 0
    };
    var gapBase = Math.max(92, 205 - r * 1.4);
    var x = Math.random() * 200, span = 0;
    while (span < W + 340) {
      var truck = Math.random() < 0.2;
      var w = truck ? 86 : 48;
      var gap = gapBase * (0.75 + Math.random() * 0.9);
      row.cars.push({ x: x, w: w, truck: truck, ci: Math.floor(Math.random() * CAR_COLORS.length) });
      x += w + gap;
      span += w + gap;
    }
    row.span = Math.max(span, W + 340);
    return row;
  }
  function railRow(r) {
    return {
      type: 'rail',
      phase: 'quiet',
      t: 1.6 + Math.random() * 2.6,
      dir: Math.random() < 0.5 ? -1 : 1,
      trainP: 0,
      blink: 0
    };
  }
  function makeRow(r) {
    if (r < 3) return grassRow(r);
    // 위협 줄이 4연속이면 풀밭 하나 강제 (숨 쉴 곳)
    var hazardRun = 0;
    for (var i = r - 1; i >= r - 4 && i >= 0; i--) {
      if (rows[i] && rows[i].type !== 'grass') hazardRun++;
      else break;
    }
    if (hazardRun >= 4) return grassRow(r);
    var roll = Math.random();
    var railP = r >= 12 && rows[r - 1] && rows[r - 1].type !== 'rail'
      ? Math.min(0.11, 0.05 + r * 0.0007) : 0;
    var roadP = Math.min(0.78, 0.48 + r * 0.008);
    if (roll < railP) return railRow(r);
    if (roll < railP + roadP) return roadRow(r);
    return grassRow(r);
  }
  function ensureRows(upTo) {
    while (genMaxR < upTo) {
      genMaxR++;
      rows[genMaxR] = makeRow(genMaxR);
    }
  }

  // ---------- 랭킹 (이 기기 기록 + 친구 도전장 기록) ----------
  var RANK_MAX = 12;
  var RANK_KEY = 'chickenCrossRanks';
  var ranks = [], myRankRow = null;
  function loadRanks() {
    try {
      var raw = JSON.parse(localStorage.getItem(RANK_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s); })
        .map(function (r) { return { n: String(r.n || 'me').slice(0, 8), s: Math.max(0, Math.round(r.s)), f: r.f ? 1 : 0, t: r.t || 0 }; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, RANK_MAX);
    } catch (e) { return []; }
  }
  function saveRanks(list) {
    try { localStorage.setItem(RANK_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function loadName() {
    try { return (localStorage.getItem('chickenCrossName') || '').slice(0, 8); } catch (e) { return ''; }
  }
  function saveName(v) { try { localStorage.setItem('chickenCrossName', v); } catch (e) {} }

  function renderRanks() {
    var board = document.getElementById('rank-board');
    board.textContent = '';
    if (!ranks.length) {
      var empty = document.createElement('div');
      empty.className = 'rank-empty';
      empty.textContent = 'No scores yet.';
      board.appendChild(empty);
      return;
    }
    ranks.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row' + (r === myRankRow ? ' me' : '');
      var pos = document.createElement('span');
      pos.className = 'rank-pos';
      pos.textContent = '#' + (i + 1);
      var name = document.createElement('span');
      name.className = 'rank-name';
      name.textContent = r.n;               // 이름은 항상 텍스트로만 — 주입 방지
      if (r.f) {
        var tag = document.createElement('span');
        tag.className = 'rank-friend';
        tag.textContent = '👥friend';
        name.appendChild(tag);
      }
      var s = document.createElement('span');
      s.className = 'rank-s';
      s.textContent = r.s + ' 🐔';
      row.append(pos, name, s);
      board.appendChild(row);
    });
    var me = board.querySelector('.rank-row.me');
    if (me) me.scrollIntoView({ block: 'nearest' });
  }

  function recordRank(s) {
    ranks = loadRanks();
    var entry = { n: loadName() || 'me', s: Math.round(s), f: 0, t: Date.now() };
    ranks.push(entry);
    ranks.sort(function (a, b) { return b.s - a.s; });
    ranks = ranks.slice(0, RANK_MAX);
    myRankRow = ranks.indexOf(entry) >= 0 ? entry : null;
    saveRanks(ranks);
    renderRanks();
  }

  // ---------- 도전장 (공유 링크에 실려 오는 친구 기록) ----------
  var chScore = 0, chName = '', chBeaten = false;
  function readHashChallenge() {
    var hash = location.hash || '';
    var mc = /(?:^|[#&])c=(\d{1,5})/.exec(hash);
    if (!mc) return false;
    var mn = /(?:^|[#&])n=([^&]{1,64})/.exec(hash);
    chScore = Math.min(99999, parseInt(mc[1], 10) || 0);
    chName = 'friend';
    if (mn) {
      try { chName = decodeURIComponent(mn[1]).slice(0, 8) || 'friend'; } catch (e) {}
    }
    return chScore > 0;
  }
  function absorbChallenge() {
    // 친구 기록을 랭킹판에 넣어 준다 (중복은 한 번만)
    if (chScore <= 0) return;
    var list = loadRanks();
    var dup = list.some(function (r) { return r.f && r.n === chName && r.s === chScore; });
    if (!dup) {
      list.push({ n: chName, s: chScore, f: 1, t: Date.now() });
      list.sort(function (a, b) { return b.s - a.s; });
      saveRanks(list.slice(0, RANK_MAX));
    }
  }
  if (readHashChallenge()) absorbChallenge();
  window.addEventListener('hashchange', function () {
    if (readHashChallenge()) { absorbChallenge(); chBeaten = false; }
  });

  // ---------- 공유 ----------
  function challengeUrl(s) {
    try {
      var u = new URL(location.href);
      var n = loadName() || 'me';
      u.hash = 'c=' + Math.round(s) + '&n=' + encodeURIComponent(n);
      return u.href;
    } catch (e) { return ''; }
  }
  function note(msg) {
    var el = document.getElementById('share-note');
    el.textContent = msg;
    clearTimeout(note._t);
    note._t = setTimeout(function () { el.textContent = ''; }, 3200);
  }
  function shareResult() {
    var s = Math.round(lastScore);
    var url = challengeUrl(s);
    var text = '🐔 I crossed ' + s + ' roads!\nWhy did the chicken cross the road? To beat YOUR score. 🚗';
    var full = url ? text + '\n' + url : text;
    var done = function () { note('Challenge sent!'); };
    if (navigator.share) {
      navigator.share(url ? { title: 'Chicken Cross', text: text, url: url } : { title: 'Chicken Cross', text: text })
        .then(done)
        .catch(function (e) {
          if (e && e.name === 'AbortError') return;   // 사용자가 취소한 것은 실패가 아니다
          copyFallback(full);
        });
      return;
    }
    copyFallback(full);
  }
  function copyFallback(full) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full)
        .then(function () { note('Challenge link copied!'); })
        .catch(function () { manualCopy(full); });
      return;
    }
    manualCopy(full);
  }
  function manualCopy(full) {
    var fb = document.getElementById('share-fallback');
    fb.value = full;
    fb.classList.remove('hidden');
    fb.focus(); fb.select();
    note('Copy the link below and send it');
  }

  // ---------- 판 리셋 ----------
  function reset() {
    rows = {};
    genMaxR = -1;
    ensureRows(24);
    cr = 0; fromRow = 0; hopT = 1; hopPending = false;
    camRow = 0;
    combineRow = -4.2;
    elapsed = 0;
    introT = 1.1;             // 처음 잠깐 콤바인 정지 (배우는 시간)
    pops = [];
    feathers = [];
    deathAnim = 0; deathBy = '';
    shake = 0; closeCd = 0;
    isNewBest = false;
    chBeaten = false;
  }

  // ---------- 도우미 ----------
  // 줄 r 위 차들의 화면 x(중심) 목록
  function carRects(r) {
    var row = rows[r];
    if (!row || row.type !== 'road') return [];
    var out = [];
    for (var i = 0; i < row.cars.length; i++) {
      var c = row.cars[i];
      var x = ((c.x + row.off) % row.span + row.span) % row.span - 170;
      out.push({ cx: x + c.w / 2, w: c.w, car: c, x: x });
    }
    return out;
  }
  // 화면 중앙(닭 열)에서 가장 가까운 차 가장자리까지 거리 (없으면 Infinity)
  function centerGap(r) {
    var rects = carRects(r);
    var min = Infinity;
    for (var i = 0; i < rects.length; i++) {
      var d = Math.abs(rects[i].cx - W / 2) - rects[i].w / 2;
      if (d < min) min = d;
    }
    return min;
  }
  // 닭이 지금 시각적으로 밟고 있는 줄 (점프 앞/뒤 절반 규칙)
  function standRow() {
    if (hopT >= 1) return cr;
    return hopT < 0.5 ? fromRow : cr;
  }
  function visRow() {
    var p = Math.min(1, hopT);
    var e = 1 - (1 - p) * (1 - p);   // easeOut
    return fromRow + (cr - fromRow) * e;
  }

  function addPop(text, big) {
    pops.push({ text: text, t: 0, dur: big ? 1.6 : 0.9, big: !!big });
  }

  function die(by) {
    if (state !== STATE_PLAY) return;
    state = STATE_OVER;
    deathBy = by;
    deathAnim = 0;
    overAt = 0;
    shake = 10;
    lastScore = cr;
    if (cr > best) { best = cr; isNewBest = true;
      try { localStorage.setItem('chickenCrossBest', String(best)); } catch (e) {}
    }
    // 깃털 폭발
    for (var i = 0; i < 26; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
      feathers.push({
        x: W / 2, y: CY,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 8,
        t: 0, dur: 0.9 + Math.random() * 0.7, s: 4 + Math.random() * 5
      });
    }
    recordRank(cr);
    showPanel();
  }

  function showPanel() {
    var panel = document.getElementById('over-panel');
    var title = document.getElementById('over-title');
    var scoreEl = document.getElementById('over-score');
    var sub = document.getElementById('over-sub');
    var bt = document.getElementById('board-title');
    title.textContent = deathBy === 'combine' ? '🌾 HARVESTED!' : (deathBy === 'train' ? '🚂 SPLAT!' : '🚗 SPLAT!');
    scoreEl.textContent = lastScore + ' roads';
    sub.className = '';
    if (chScore > 0 && lastScore > chScore) {
      sub.className = 'win';
      sub.textContent = 'You beat ' + chName + ' (' + chScore + ')! 🏆';
    } else if (chScore > 0) {
      sub.className = 'lose';
      sub.textContent = chName + ' is still ahead: ' + chScore;
    } else if (isNewBest && lastScore > 0) {
      sub.className = 'newbest';
      sub.textContent = 'New best!';
    } else {
      sub.textContent = 'Best: ' + best;
    }
    bt.textContent = '🏅 Ranking (this device + friends)';
    var nameInput = document.getElementById('name-input');
    nameInput.value = loadName();
    document.getElementById('share-fallback').classList.add('hidden');
    panel.classList.remove('hidden');
    renderRanks();
  }
  function hidePanel() {
    document.getElementById('over-panel').classList.add('hidden');
  }

  function tryStart() {
    if (state === STATE_PLAY) return;
    hidePanel();
    reset();
    state = STATE_PLAY;
    // 밑에서 올라오는 게 뭔지 시작하자마자 알려준다
    pops.push({ text: '🌾 COMBINES BEHIND YOU — GO! 🐔', t: 0, dur: 2.4, big: true });
  }

  function hop() {
    if (state !== STATE_PLAY) return;
    if (hopT < 1) {
      if (hopT > 0.45) hopPending = true;   // 연타 버퍼 — 착지 직전 입력은 살려준다
      return;
    }
    fromRow = cr;
    cr++;
    hopT = 0;
    wingT = 0.25;
    ensureRows(cr + 22);
    if (PUNCHLINES[cr]) addPop(PUNCHLINES[cr], true);
    if (chScore > 0 && !chBeaten && cr > chScore) {
      chBeaten = true;
      addPop('YOU PASSED ' + chName.toUpperCase() + '! 🏆', true);
    }
  }

  // ---------- 입력 ----------
  var lastTouchT = -1000;   // 0이면 로드 직후 0.5초 안의 첫 클릭이 무시된다
  function tap() {
    if (state === STATE_TITLE) { tryStart(); return; }
    if (state === STATE_PLAY) hop();
    // OVER 상태는 패널 버튼으로만 — 오탭으로 바로 재시작되는 것 방지
  }
  // preventDefault를 걸지 않는다 — 세로 팬이 완충지대 스크롤로 소비되어야
  // 인앱 브라우저 시트가 닫히지 않는다
  canvas.addEventListener('touchstart', function () {
    lastTouchT = performance.now();
    tap();
  }, { passive: true });
  canvas.addEventListener('mousedown', function () {
    if (performance.now() - lastTouchT < 500) return;  // 터치 후 합성 마우스 이벤트 무시
    tap();
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (!document.getElementById('over-panel').classList.contains('hidden')) return;
      e.preventDefault();
      tap();
    }
  });
  document.getElementById('retry-btn').addEventListener('click', function () { tryStart(); });
  document.getElementById('share-btn').addEventListener('click', function () { shareResult(); });
  var nameInput = document.getElementById('name-input');
  nameInput.addEventListener('input', function () {
    var v = nameInput.value.slice(0, 8);
    saveName(v);
    // 내 랭킹 줄 이름 즉시 반영
    if (myRankRow) {
      myRankRow.n = v || 'me';
      saveRanks(ranks);
      renderRanks();
    }
  });

  // ---------- 업데이트 ----------
  function update(dt) {
    var r, row;
    // 줄 애니메이션은 타이틀에서도 돌린다 (배경 살아있게)
    var lo = Math.max(0, Math.floor(camRow - 6));
    var hi = Math.floor(camRow + 12);
    ensureRows(hi);
    for (r = lo; r <= hi; r++) {
      row = rows[r];
      if (!row) continue;
      if (row.type === 'road') {
        row.off += row.dir * carSpeed(r) * dt;
      } else if (row.type === 'rail') {
        row.t -= dt;
        if (row.phase === 'warn') row.blink += dt;
        if (row.phase === 'train') row.trainP += dt / 0.62;
        if (row.t <= 0) {
          if (row.phase === 'quiet') { row.phase = 'warn'; row.t = 1.15; row.blink = 0; }
          else if (row.phase === 'warn') { row.phase = 'train'; row.t = 0.62; row.trainP = 0; }
          else { row.phase = 'quiet'; row.t = 2.0 + Math.random() * 2.6; }
        }
      }
    }

    if (state === STATE_PLAY) {
      elapsed += dt;
      if (introT > 0) introT -= dt;
      if (hopT < 1) {
        hopT = Math.min(1, hopT + dt / HOP_DUR);
        if (hopT >= 1 && hopPending) { hopPending = false; hop(); }
      }
      if (wingT > 0) wingT -= dt;

      // 콤바인 전진 + 고무줄 (너무 뒤처지면 끌어온다 → 항상 화면 안)
      if (introT <= 0) {
        combineRow += combineSpeed() * dt;
        if (cr - combineRow > COMBINE_MAX_LAG) combineRow = cr - COMBINE_MAX_LAG;
      }

      var vr = visRow();
      // 콤바인에 잡힘 — 커터 이빨이 닭에 닿는 시점과 판정을 맞춘다
      if (combineRow >= vr - 0.55) { die('combine'); }

      // 차/기차 충돌 — 점프 공중(0.35~0.65)은 짧게 봐준다
      if (state === STATE_PLAY) {
        var sr = -1;
        if (hopT >= 1) sr = cr;
        else if (hopT < 0.35) sr = fromRow;
        else if (hopT > 0.65) sr = cr;
        if (sr >= 0) {
          row = rows[sr];
          if (row && row.type === 'road') {
            var gap = centerGap(sr);
            if (gap < -CHICK_HW + 4) die('car');
            else if (gap < 20 && closeCd <= 0) {   // 아슬아슬 통과
              addPop('CLOSE ONE!', false);
              closeCd = 0.8;
            }
          } else if (row && row.type === 'rail' && row.phase === 'train') {
            die('train');
          }
        }
      }
      if (closeCd > 0) closeCd -= dt;
    }

    if (state === STATE_OVER) {
      deathAnim += dt;
      overAt += dt;
    }

    // 카메라
    camRow += (Math.max(cr, combineRow + 1.2) - camRow) * Math.min(1, dt * 8);

    // 연출
    for (var i = pops.length - 1; i >= 0; i--) {
      pops[i].t += dt;
      if (pops[i].t > pops[i].dur) pops.splice(i, 1);
    }
    for (i = feathers.length - 1; i >= 0; i--) {
      var f = feathers[i];
      f.t += dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vy += 260 * dt; f.vx *= (1 - 1.6 * dt);
      f.rot += f.vr * dt;
      if (f.t > f.dur) feathers.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 26);
  }

  // ---------- 그리기 ----------
  function rowY(r) { return CY + (camRow - r) * ROW_H; }

  function drawGrassRow(r, y) {
    ctx.fillStyle = (r % 2 === 0) ? '#8ecb5c' : '#82c052';
    ctx.fillRect(0, y - ROW_H, W, ROW_H + 1);
    var row = rows[r];
    for (var i = 0; i < row.bushes.length; i++) {
      var b = row.bushes[i];
      var by = y - ROW_H * 0.45;
      ctx.fillStyle = '#5fa03e';
      ctx.beginPath();
      ctx.arc(b.x, by, 9 * b.s, 0, Math.PI * 2);
      ctx.arc(b.x - 7 * b.s, by + 3 * b.s, 7 * b.s, 0, Math.PI * 2);
      ctx.arc(b.x + 7 * b.s, by + 3 * b.s, 7 * b.s, 0, Math.PI * 2);
      ctx.fill();
      if (b.flower) {
        ctx.fillStyle = '#ffe08a';
        ctx.beginPath();
        ctx.arc(b.x + 2, by - 4 * b.s, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawRoadRow(r, y) {
    ctx.fillStyle = '#3d434c';
    ctx.fillRect(0, y - ROW_H, W, ROW_H + 1);
    // 위아래가 모두 도로면 차선 점선
    var above = rows[r + 1];
    if (above && above.type === 'road') {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 3;
      ctx.setLineDash([16, 14]);
      ctx.beginPath();
      ctx.moveTo(0, y - ROW_H);
      ctx.lineTo(W, y - ROW_H);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(0, y - ROW_H, W, 3);
    }
    var below = rows[r - 1];
    if (!below || below.type !== 'road') {
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(0, y - 3, W, 3);
    }
  }

  function drawCar(cx, y, w, ci, truck, dir) {
    var h = ROW_H * 0.58;
    var cy = y - ROW_H * 0.5;
    var col = CAR_COLORS[ci];
    ctx.save();
    ctx.translate(cx, cy);
    if (dir < 0) ctx.scale(-1, 1);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.42, w * 0.52, h * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    // 차체
    ctx.fillStyle = col[0];
    roundRect(-w / 2, -h / 2, w, h, 7);
    ctx.fill();
    // 지붕
    ctx.fillStyle = col[1];
    if (truck) {
      roundRect(-w / 2 + 4, -h / 2 + 4, w * 0.62, h - 8, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      roundRect(w / 2 - w * 0.3, -h / 2 + 3, w * 0.24, h - 6, 4);
      ctx.fill();
    } else {
      roundRect(-w * 0.24, -h / 2 + 4, w * 0.44, h - 8, 5);
      ctx.fill();
      // 앞유리
      ctx.fillStyle = '#bfe3f2';
      ctx.fillRect(w * 0.2, -h / 2 + 5, 5, h - 10);
    }
    // 헤드라이트
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(w / 2 - 3, -h / 2 + 3, 3, 5);
    ctx.fillRect(w / 2 - 3, h / 2 - 8, 3, 5);
    ctx.restore();
  }

  function drawRailRow(r, y) {
    var row = rows[r];
    ctx.fillStyle = '#8d8577';
    ctx.fillRect(0, y - ROW_H, W, ROW_H + 1);
    // 침목
    ctx.fillStyle = '#6b5d4a';
    for (var x = 8; x < W; x += 26) {
      ctx.fillRect(x, y - ROW_H * 0.78, 14, ROW_H * 0.56);
    }
    // 레일 두 줄
    ctx.fillStyle = '#4a4a52';
    ctx.fillRect(0, y - ROW_H * 0.66, W, 5);
    ctx.fillRect(0, y - ROW_H * 0.32, W, 5);
    // 경고등
    if (row.phase === 'warn' || row.phase === 'train') {
      var on = Math.floor(row.blink * 6) % 2 === 0;
      var lx = 24, ly = y - ROW_H * 0.5;
      ctx.fillStyle = '#333';
      ctx.fillRect(lx - 3, ly - 16, 6, 32);
      ctx.fillStyle = on ? '#ff4038' : '#5a1a16';
      ctx.beginPath(); ctx.arc(lx, ly - 20, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = on ? '#5a1a16' : '#ff4038';
      ctx.beginPath(); ctx.arc(W - lx, ly - 20, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.fillRect(W - lx - 3, ly - 16, 6, 32);
      // 전체 줄이 위험함을 은은히 표시
      ctx.fillStyle = on ? 'rgba(255,64,56,0.10)' : 'rgba(255,64,56,0.04)';
      ctx.fillRect(0, y - ROW_H, W, ROW_H);
    }
    // 기차
    if (row.phase === 'train') {
      var p = Math.min(1, row.trainP);
      var trainW = W * 1.35;
      var total = W + trainW * 2;
      var head = row.dir > 0 ? (-trainW + total * p) : (W + trainW - total * p);
      var left = row.dir > 0 ? head - trainW : head;
      var cy2 = y - ROW_H * 0.5;
      var h2 = ROW_H * 0.72;
      ctx.fillStyle = '#2f3138';
      roundRect(left, cy2 - h2 / 2, trainW, h2, 6);
      ctx.fill();
      // 객차 창문
      ctx.fillStyle = '#ffd75e';
      for (var wx = left + 14; wx < left + trainW - 14; wx += 34) {
        ctx.fillRect(wx, cy2 - h2 * 0.22, 18, h2 * 0.34);
      }
      // 전조등
      ctx.fillStyle = '#fff3b0';
      var nose = row.dir > 0 ? left + trainW : left;
      ctx.beginPath();
      ctx.arc(nose, cy2, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCombine(y) {
    // 빨간 콤바인 수확기 편대 — 조종석/바퀴/회전 커터가 보여야 "농기계"로 읽힌다
    var t = performance.now() / 1000;
    var topY = y - ROW_H * 0.9;
    // 갈아엎은 흙 (지나간 자리) + 밭고랑
    ctx.fillStyle = '#7a5b3a';
    ctx.fillRect(0, y, W, Math.max(0, H - y));
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    for (var gx = 10; gx < W; gx += 30) {
      ctx.fillRect(gx, y + 2, 5, Math.max(0, H - y - 2));
    }
    // 잘린 밀단 몇 개
    ctx.fillStyle = '#c9a86a';
    for (var s = 0; s < 4; s++) {
      var sx = (s * 173 + 40) % W;
      ctx.fillRect(sx, y + 14 + (s % 2) * 20, 10, 5);
    }
    var n = Math.max(2, Math.round(W / 150));
    var mw = W / n;
    for (var i = 0; i < n; i++) {
      var cx = mw * i + mw / 2;
      var bob = Math.sin(t * 7 + i * 1.7) * 1.5;
      var hy = topY + bob;
      var headerW = mw - 10, headerH = ROW_H * 0.38;
      // 커터 이빨 (위쪽 = 닭을 향해 전진하는 방향)
      ctx.fillStyle = '#6e5518';
      for (var tx = cx - headerW / 2; tx < cx + headerW / 2 - 6; tx += 10) {
        ctx.beginPath();
        ctx.moveTo(tx, hy + 1);
        ctx.lineTo(tx + 5, hy - 7);
        ctx.lineTo(tx + 10, hy + 1);
        ctx.fill();
      }
      // 헤더(커터 릴)
      ctx.fillStyle = '#e0a83c';
      roundRect(cx - headerW / 2, hy, headerW, headerH, 4);
      ctx.fill();
      // 회전 드럼 슬랫 (아래로 말려 들어가는 느낌)
      ctx.fillStyle = 'rgba(90,60,10,0.55)';
      for (var k = 0; k < 3; k++) {
        var sy = hy + 2 + ((k * headerH / 3 + t * 34) % (headerH - 5));
        ctx.fillRect(cx - headerW / 2 + 3, sy, headerW - 6, 3);
      }
      // 바퀴 (본체 양옆)
      var bw = mw * 0.56, bh = ROW_H * 1.0;
      ctx.fillStyle = '#2e2e34';
      roundRect(cx - bw / 2 - 8, hy + headerH + bh * 0.4, 15, bh * 0.52, 5);
      ctx.fill();
      roundRect(cx + bw / 2 - 7, hy + headerH + bh * 0.4, 15, bh * 0.52, 5);
      ctx.fill();
      // 본체 (빨간 콤바인)
      ctx.fillStyle = '#d13b2a';
      roundRect(cx - bw / 2, hy + headerH - 2, bw, bh, 6);
      ctx.fill();
      ctx.fillStyle = '#a32a1e';
      ctx.fillRect(cx - bw / 2 + 2, hy + headerH - 2, bw - 4, 6);
      // 조종석 유리
      ctx.fillStyle = '#bfe3f2';
      roundRect(cx - bw * 0.32, hy + headerH + 9, bw * 0.64, ROW_H * 0.3, 4);
      ctx.fill();
      // 배기 연기
      var puff = (t * 1.3 + i * 0.4) % 1;
      ctx.fillStyle = 'rgba(110,110,110,' + (0.45 * (1 - puff)) + ')';
      ctx.beginPath();
      ctx.arc(cx + bw / 2 - 3, hy + headerH + 2 - puff * 18, 3 + puff * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    // 흙먼지 (커터 라인 위)
    ctx.fillStyle = 'rgba(214,190,150,0.5)';
    for (i = 0; i < 8; i++) {
      var px = (i * 131 + t * 70) % W;
      var py = topY - 8 - (Math.sin(t * 3 + i) + 1) * 8;
      ctx.beginPath();
      ctx.arc(px, py, 4 + (i % 3) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawChicken(x, y, air, dead) {
    ctx.save();
    ctx.translate(x, y);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 8, 13 * (1 - air * 0.4), 5 * (1 - air * 0.4), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.translate(0, -air * ROW_H * 0.45);
    if (dead) {
      // 납작하게
      ctx.scale(1.35, 0.4);
    } else if (air > 0) {
      ctx.scale(0.92, 1.1);
    }
    // 꼬리깃
    ctx.fillStyle = '#e8e4da';
    ctx.beginPath();
    ctx.ellipse(-2, 9, 8, 5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    // 몸통
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(0, 2, 12, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    // 날개
    var flap = wingT > 0 ? Math.sin(wingT * 40) * 3 : 0;
    ctx.fillStyle = '#eeebe2';
    ctx.beginPath();
    ctx.ellipse(-9, 3 + flap, 5, 8, 0.3, 0, Math.PI * 2);
    ctx.ellipse(9, 3 - flap, 5, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // 머리 (위쪽 = 진행 방향)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -12, 8, 0, Math.PI * 2);
    ctx.fill();
    // 볏
    ctx.fillStyle = '#e8443a';
    ctx.beginPath();
    ctx.arc(-3, -19, 3, 0, Math.PI * 2);
    ctx.arc(0, -21, 3.4, 0, Math.PI * 2);
    ctx.arc(3, -19, 3, 0, Math.PI * 2);
    ctx.fill();
    // 부리 (위로)
    ctx.fillStyle = '#f2a33c';
    ctx.beginPath();
    ctx.moveTo(-3, -17);
    ctx.lineTo(3, -17);
    ctx.lineTo(0, -24);
    ctx.fill();
    // 눈
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-4, -13, 1.6, 0, Math.PI * 2);
    ctx.arc(4, -13, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    // 배경
    ctx.fillStyle = '#79b850';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    var lo = Math.max(0, Math.floor(camRow - 5));
    var hi = Math.floor(camRow + 10);
    ensureRows(hi);
    var r, y;
    // 바닥(줄) 먼저 아래→위… 그리기는 위 줄부터 (y 큰 순서로 덮어쓰기 없게 타입별로 무관)
    for (r = hi; r >= lo; r--) {
      y = rowY(r);
      if (y < -ROW_H || y - ROW_H > H) continue;
      var row = rows[r];
      if (!row) continue;
      if (row.type === 'grass') drawGrassRow(r, y);
      else if (row.type === 'road') drawRoadRow(r, y);
      else drawRailRow(r, y);
    }
    // 도전장 기록선
    if (chScore > 0 && chScore >= lo && chScore <= hi) {
      y = rowY(chScore);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(0, y - ROW_H);
      ctx.lineTo(W, y - ROW_H);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(28,30,44,0.75)';
      var label = '⚑ ' + chName + ' · ' + chScore;
      ctx.font = 'bold 12px -apple-system, sans-serif';
      var tw = ctx.measureText(label).width;
      roundRect(W / 2 - tw / 2 - 8, y - ROW_H - 10, tw + 16, 20, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, W / 2, y - ROW_H);
    }
    // 차 (줄 위에)
    for (r = hi; r >= lo; r--) {
      var row2 = rows[r];
      if (!row2 || row2.type !== 'road') continue;
      y = rowY(r);
      if (y < -ROW_H || y - ROW_H > H) continue;
      var rects = carRects(r);
      for (var i = 0; i < rects.length; i++) {
        if (rects[i].cx < -80 || rects[i].cx > W + 80) continue;
        drawCar(rects[i].cx, y, rects[i].w, rects[i].car.ci, rects[i].car.truck, row2.dir);
      }
    }
    // 닭
    var vr = visRow();
    var air = hopT < 1 ? Math.sin(Math.min(1, hopT) * Math.PI) : 0;
    var chy = rowY(vr) - ROW_H * 0.42;
    var dead = state === STATE_OVER && deathBy !== 'combine';
    if (!(state === STATE_OVER && deathBy === 'combine' && deathAnim > 0.15)) {
      drawChicken(W / 2, chy, dead ? 0 : air, dead);
    }
    // 기차는 닭을 덮는다
    for (r = hi; r >= lo; r--) {
      var row3 = rows[r];
      if (!row3 || row3.type !== 'rail' || row3.phase !== 'train') continue;
      y = rowY(r);
      if (y < -ROW_H || y - ROW_H > H) continue;
      drawRailRow(r, y);
    }
    // 콤바인 (맨 위)
    var comY = rowY(combineRow) - ROW_H * 0.1;
    if (comY > -ROW_H * 2) drawCombine(comY);

    // 깃털
    for (i = 0; i < feathers.length; i++) {
      var f = feathers[i];
      var a = 1 - f.t / f.dur;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(0, 0, f.s, f.s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // HUD
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    if (state !== STATE_TITLE) {
      ctx.font = '800 44px -apple-system, sans-serif';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.strokeText(String(cr), W / 2, 16);
      ctx.fillStyle = '#fff';
      ctx.fillText(String(cr), W / 2, 16);
      ctx.font = '700 13px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.textAlign = 'right';
      ctx.fillText('BEST ' + best, W - 14, 20);
      ctx.textAlign = 'center';
    }
    // 콤바인 임박 경고
    if (state === STATE_PLAY && cr - combineRow < 1.6 && introT <= 0) {
      var blink = Math.floor(performance.now() / 180) % 2 === 0;
      if (blink) {
        ctx.font = '800 22px -apple-system, sans-serif';
        ctx.fillStyle = '#ff4038';
        ctx.fillText('⚠ MOVE! ⚠', W / 2, CY - ROW_H * 2.2);
      }
    }
    // 팝 텍스트
    for (i = 0; i < pops.length; i++) {
      var p = pops[i];
      var pa = 1 - p.t / p.dur;
      var py = H * 0.3 - p.t * 26;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, pa * 1.6));
      var fs = p.big ? 24 : 17;
      ctx.font = (p.big ? '800 ' : '700 ') + fs + 'px -apple-system, sans-serif';
      var ptw = ctx.measureText(p.text).width;
      if (ptw > W - 28) {   // 긴 문구는 화면 폭에 맞게 축소
        fs = Math.max(13, Math.floor(fs * (W - 28) / ptw));
        ctx.font = (p.big ? '800 ' : '700 ') + fs + 'px -apple-system, sans-serif';
      }
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.strokeText(p.text, W / 2, py);
      ctx.fillStyle = p.big ? '#ffd36e' : '#fff';
      ctx.fillText(p.text, W / 2, py);
      ctx.restore();
    }

    // 타이틀
    if (state === STATE_TITLE) {
      ctx.fillStyle = 'rgba(20, 30, 16, 0.45)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.fillStyle = '#fff';
      ctx.font = '800 26px -apple-system, sans-serif';
      ctx.fillText('WHY DID THE CHICKEN', W / 2, H * 0.2);
      ctx.fillText('CROSS THE ROAD?', W / 2, H * 0.2 + 34);
      ctx.font = '700 15px -apple-system, sans-serif';
      ctx.fillStyle = '#ffd36e';
      ctx.fillText('Tap to hop. Dodge the traffic.', W / 2, H * 0.2 + 78);
      ctx.fillText('Outrun the harvesters behind you! 🌾', W / 2, H * 0.2 + 100);
      if (chScore > 0) {
        ctx.fillStyle = '#8ecbff';
        ctx.fillText('⚔️ ' + chName + ' challenged you: beat ' + chScore + '!', W / 2, H * 0.2 + 130);
      }
      drawChicken(W / 2, H * 0.55, 0, false);
      blinkText('TAP TO CROSS', H * 0.72);
    }
    ctx.restore();
  }

  function blinkText(text, y) {
    var a = 0.55 + 0.45 * Math.sin(performance.now() / 350);
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, W / 2, y);
    ctx.restore();
  }

  // ---------- 루프 ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 인앱 브라우저 시트 닫힘 방지: 문서 스크롤을 완충지대 중간(120px)에 걸어 둔다.
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  reset(); // 타이틀 화면 배경으로 들판을 미리 깔아 둔다
  state = STATE_TITLE;
  requestAnimationFrame(loop);

  // 헤드리스 테스트용 훅 (해시에 debug가 있을 때만)
  if ((location.hash || '').indexOf('debug') >= 0) {
    window.__game = {
      get state() { return state; },
      get row() { return cr; },
      get combineRow() { return combineRow; },
      get elapsed() { return elapsed; },
      get deathBy() { return deathBy; },
      get chScore() { return chScore; },
      get chName() { return chName; },
      get hopT() { return hopT; },
      rowType: function (r) { ensureRows(r); return rows[r].type; },
      railPhase: function (r) { return rows[r] && rows[r].phase; },
      centerGap: centerGap,
      carSpeedAt: function (r) { return rows[r] && rows[r].type === 'road' ? carSpeed(r) : 0; },
      rowDir: function (r) { return rows[r] && rows[r].dir; },
      hop: hop,
      tryStart: tryStart
    };
  }
})();
</script>
</body>
</html>

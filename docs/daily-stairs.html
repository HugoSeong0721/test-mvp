<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Daily Stairs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #bfe0f5;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  #game {
    display: block;
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
  }
  /* ── 게임오버 패널 (오늘의 랭킹 / 도전장) ── */
  #over-panel {
    position: fixed;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(330px, 88vw);
    background: rgba(20, 22, 40, 0.95);
    color: #fff;
    border-radius: 16px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  #over-panel.hidden { display: none; }
  #over-title { font-size: 24px; font-weight: 800; }
  #over-score { font-size: 36px; font-weight: 800; margin-top: 2px; color: #ffd34d; }
  #over-sub { font-size: 15px; margin-top: 4px; min-height: 18px; color: rgba(255,255,255,0.75); }
  #over-sub.newbest { color: #ffd34d; font-weight: 700; }
  #over-sub.win { color: #7ee787; font-weight: 700; }
  #over-sub.lose { color: #ff8f7a; font-weight: 700; }
  #board-title { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.6); text-align: left; padding-left: 4px; }
  #rank-board {
    margin: 6px 0 8px;
    max-height: 158px; overflow-y: auto;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 14px;
  }
  .rank-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(255, 211, 77, 0.16); }
  .rank-pos { width: 30px; text-align: left; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
  .rank-row.me .rank-pos { color: #ffd34d; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-friend { font-size: 11px; color: #8ecbff; margin-left: 4px; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
  #name-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  #name-input {
    width: 92px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 5px 8px;
    text-align: center;
  }
  #over-btns { display: flex; gap: 8px; }
  #over-btns button {
    flex: 1;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #retry-btn { background: #ffd34d; color: #3a2c10; }
  #share-btn { background: rgba(255,255,255,0.14); color: #fff; }
  #share-note { font-size: 12px; color: #7ee787; min-height: 15px; margin-top: 7px; }
  #next-note { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 4px; }
  #share-fallback {
    width: 100%; margin-top: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff;
    font-size: 12px; padding: 6px 8px;
  }
  #share-fallback.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="over-panel" class="hidden">
  <div id="over-title">☁️ FALLEN!</div>
  <div id="over-score"></div>
  <div id="over-sub"></div>
  <div id="board-title"></div>
  <div id="rank-board"></div>
  <div id="name-row"><span>Name</span><input id="name-input" maxlength="8" placeholder="You"></div>
  <div id="over-btns">
    <button id="share-btn">⚔️ Send Challenge</button>
    <button id="retry-btn">Climb Again</button>
  </div>
  <div id="share-note"></div>
  <div id="next-note"></div>
  <input id="share-fallback" class="hidden" readonly>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, BTN_H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    BTN_H = Math.max(96, Math.round(H * 0.16));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 오늘 날짜 (KST) ----------
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function kstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }
  function dayKey() {
    var t = kstNow();
    return '' + t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate());
  }
  function dayLabel(key) {
    return parseInt(key.slice(4, 6), 10) + '/' + parseInt(key.slice(6, 8), 10);
  }
  // 다음 코스(자정 KST)까지 남은 시간
  function untilNextCourse() {
    var t = kstNow();
    var left = 86400 - (t.getUTCHours() * 3600 + t.getUTCMinutes() * 60 + t.getUTCSeconds());
    var h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }

  // ---------- 데일리 시드 계단 ----------
  // 날짜 문자열 → 시드 → 모두에게 똑같은 계단 순서
  function seedFrom(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var STEP_DX = 44;   // 한 칸의 가로 간격
  var STEP_DY = 30;   // 한 칸의 높이

  var courseDay = '';  // 이 판의 코스 날짜
  var rng = null;
  var dirs = [];       // dirs[i]: i층 → i+1층 방향 (-1 왼쪽, +1 오른쪽)
  var xs = [0];        // xs[i]: i층의 가로 위치(칸 단위)
  function ensureSteps(n) {
    while (dirs.length < n) {
      var pos = xs[xs.length - 1];
      // 가장자리로 너무 밀리지 않게 중심 복원 편향
      var pLeft = 0.5 + Math.max(-0.34, Math.min(0.34, pos * 0.085));
      var d = rng() < pLeft ? -1 : 1;
      dirs.push(d);
      xs.push(pos + d);
    }
  }
  function setupCourse() {
    courseDay = dayKey();
    rng = mulberry32(seedFrom('daily-stairs-' + courseDay));
    dirs = [];
    xs = [0];
    ensureSteps(60);
  }

  // ---------- 상태 ----------
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_TITLE;

  var floors = 0;          // 현재 층수 = 점수
  var hCloud = 0;          // 구름 상단 높이(월드, 위로 +)
  var introT = 0;          // 시작 직후 안내 플래시
  var playT = 0;           // 판 경과 시간
  var camH = 0, camX = 0;  // 카메라 (높이, 가로칸)
  var drawH = 0, drawX = 0;// 플레이어 보간 위치
  var hopT = 0;            // 걸음 연출
  var face = 1;
  var falling = false;
  var fall = { x: 0, h: 0, vx: 0, vh: 0, rot: 0 };
  var caught = false;      // 구름에 잡혀서 죽음
  var lastScore = 0;
  var overAt = 0;
  var deathAnim = 0;
  var shake = 0;
  var pressL = 0, pressR = 0; // 버튼 눌림 연출
  var flashes = [];        // {text, t} 화면 플래시 메시지

  var best = 0, bestAll = 0;
  try { bestAll = parseInt(localStorage.getItem('dailyStairsBestAll') || '0', 10) || 0; } catch (e) {}
  function loadTodayBest() {
    try { return parseInt(localStorage.getItem('dailyStairsBest_' + dayKey()) || '0', 10) || 0; } catch (e) { return 0; }
  }
  best = loadTodayBest();
  var isNewBest = false;

  // ---------- 랭킹 (날짜별로 이 기기에 남는 기록 + 친구 도전장 기록) ----------
  var RANK_MAX = 12;
  var ranks = [], myRankRow = null;
  function rankStoreKey(day) { return 'dailyStairsRanks_' + day; }
  function loadRanks(day) {
    try {
      var raw = JSON.parse(localStorage.getItem(rankStoreKey(day)) || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s); })
        .map(function (r) { return { n: String(r.n || 'You').slice(0, 8), s: Math.max(0, Math.round(r.s)), f: r.f ? 1 : 0, t: r.t || 0 }; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, RANK_MAX);
    } catch (e) { return []; }
  }
  function saveRanks(day, list) {
    try { localStorage.setItem(rankStoreKey(day), JSON.stringify(list)); } catch (e) {}
  }
  // 7일 지난 날짜별 기록은 정리
  function pruneOldRanks() {
    try {
      var today = parseInt(dayKey(), 10);
      var kill = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('dailyStairsRanks_') === 0 || k.indexOf('dailyStairsBest_') === 0)) {
          var d = parseInt(k.slice(k.lastIndexOf('_') + 1), 10);
          if (d && today - d > 100) kill.push(k); // 날짜 숫자차 100이면 확실히 일주일 이상
        }
      }
      kill.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
  }
  pruneOldRanks();
  function loadName() {
    try { return (localStorage.getItem('dailyStairsName') || '').slice(0, 8); } catch (e) { return ''; }
  }
  function saveName(v) { try { localStorage.setItem('dailyStairsName', v); } catch (e) {} }

  function renderRanks() {
    var board = document.getElementById('rank-board');
    board.textContent = '';
    if (!ranks.length) {
      var empty = document.createElement('div');
      empty.className = 'rank-empty';
      empty.textContent = 'No records yet.';
      board.appendChild(empty);
      return;
    }
    ranks.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row' + (r === myRankRow ? ' me' : '');
      var pos = document.createElement('span');
      pos.className = 'rank-pos';
      pos.textContent = '#' + (i + 1);
      var name = document.createElement('span');
      name.className = 'rank-name';
      name.textContent = r.n;               // 이름은 항상 텍스트로만 — 주입 방지
      if (r.f) {
        var tag = document.createElement('span');
        tag.className = 'rank-friend';
        tag.textContent = '👥friend';
        name.appendChild(tag);
      }
      var s = document.createElement('span');
      s.className = 'rank-s';
      s.textContent = r.s + 'F';
      row.append(pos, name, s);
      board.appendChild(row);
    });
    var me = board.querySelector('.rank-row.me');
    if (me) me.scrollIntoView({ block: 'nearest' });
  }

  function recordRank(s) {
    ranks = loadRanks(courseDay);
    var entry = { n: loadName() || 'You', s: Math.round(s), f: 0, t: Date.now() };
    ranks.push(entry);
    ranks.sort(function (a, b) { return b.s - a.s; });
    ranks = ranks.slice(0, RANK_MAX);
    myRankRow = ranks.indexOf(entry) >= 0 ? entry : null;
    saveRanks(courseDay, ranks);
    renderRanks();
  }

  // ---------- 도전장 (공유 링크에 실려 오는 친구 기록) ----------
  var chSteps = 0, chName = '', chDay = '', chBeaten = false;
  function readHashChallenge() {
    var hash = location.hash || '';
    var mc = /(?:^|[#&])c=(\d{1,5})/.exec(hash);
    if (!mc) return false;
    var mn = /(?:^|[#&])n=([^&]{1,64})/.exec(hash);
    var md = /(?:^|[#&])d=(\d{8})/.exec(hash);
    chSteps = Math.min(99999, parseInt(mc[1], 10) || 0);
    chDay = md ? md[1] : dayKey();
    chName = 'Friend';
    if (mn) {
      try { chName = decodeURIComponent(mn[1]).slice(0, 8) || 'Friend'; } catch (e) {}
    }
    return chSteps > 0;
  }
  function absorbChallenge() {
    // 친구 기록을 해당 날짜 랭킹판에 넣어 준다 (중복은 한 번만)
    if (chSteps <= 0) return;
    var list = loadRanks(chDay);
    var dup = list.some(function (r) { return r.f && r.n === chName && r.s === chSteps; });
    if (!dup) {
      list.push({ n: chName, s: chSteps, f: 1, t: Date.now() });
      list.sort(function (a, b) { return b.s - a.s; });
      saveRanks(chDay, list.slice(0, RANK_MAX));
    }
  }
  if (readHashChallenge()) absorbChallenge();
  window.addEventListener('hashchange', function () {
    if (readHashChallenge()) { absorbChallenge(); chBeaten = false; }
  });
  // 오늘 코스에 대한 도전인가? (다른 날 기록이면 점수 목표로만 표시)
  function chIsToday() { return chSteps > 0 && chDay === courseDay; }

  // ---------- 공유 ----------
  function challengeUrl(s) {
    try {
      var u = new URL(location.href);
      var n = loadName() || 'You';
      u.hash = 'c=' + Math.round(s) + '&n=' + encodeURIComponent(n) + '&d=' + courseDay;
      return u.href;
    } catch (e) { return ''; }
  }
  function note(msg) {
    var el = document.getElementById('share-note');
    el.textContent = msg;
    clearTimeout(note._t);
    note._t = setTimeout(function () { el.textContent = ''; }, 3200);
  }
  function shareResult() {
    var s = Math.round(lastScore);
    var url = challengeUrl(s);
    var text = '🪜 Daily Stairs ' + dayLabel(courseDay) + ' — I climbed ' + s + ' floors!\nEveryone gets the same stairs today. Can you beat me?';
    var full = url ? text + '\n' + url : text;
    var done = function () { note('Challenge sent!'); };
    if (navigator.share) {
      navigator.share(url ? { title: 'Daily Stairs', text: text, url: url } : { title: 'Daily Stairs', text: text })
        .then(done)
        .catch(function (e) {
          if (e && e.name === 'AbortError') return;   // 사용자가 취소한 것은 실패가 아니다
          copyFallback(full);
        });
      return;
    }
    copyFallback(full);
  }
  function copyFallback(full) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full)
        .then(function () { note('Challenge link copied!'); })
        .catch(function () { manualCopy(full); });
      return;
    }
    manualCopy(full);
  }
  function manualCopy(full) {
    var fb = document.getElementById('share-fallback');
    fb.value = full;
    fb.classList.remove('hidden');
    fb.focus(); fb.select();
    note('Copy the link below and send it');
  }

  // ---------- 판 리셋 ----------
  function reset() {
    setupCourse();
    best = loadTodayBest();
    floors = 0;
    hCloud = -H * 0.3;       // 화면 아래쪽에 구름 상단이 보이는 위치에서 시작
    playT = 0;
    introT = 2.0;
    camH = 0; camX = 0;
    drawH = 0; drawX = 0;
    hopT = 0;
    face = dirs[0] || 1;
    falling = false; caught = false;
    isNewBest = false;
    deathAnim = 0; shake = 0;
    chBeaten = false;
    flashes = [];
  }

  // ---------- 난이도: 구름 상승 속도 ----------
  function cloudSpeed() {
    var v = 28 + floors * 0.85;
    if (playT < 1.6) v *= 0.3;               // 첫 호흡은 여유
    return Math.min(140, v);
  }

  // ---------- 조작 ----------
  function move(dir) {
    if (state !== STATE_PLAY || falling) return;
    if (dir < 0) pressL = 0.14; else pressR = 0.14;
    ensureSteps(floors + 4);
    var need = dirs[floors];
    if (dir === need) {
      floors++;
      face = dir;
      hopT = 1;
      ensureSteps(floors + 60);
      if (chSteps > 0 && !chBeaten && floors > chSteps) {
        chBeaten = true;
        flashes.push({ text: '🏆 Passed ' + chName + '!', t: 1.6 });
        shake = 6;
      }
    } else {
      // 계단이 없는 쪽을 밟음 → 추락
      falling = true;
      face = dir;
      fall.x = xs[floors] + dir * 0.9;
      fall.h = floors * STEP_DY;
      fall.vx = dir * 90;
      fall.vh = 60;   // 살짝 떴다가 떨어진다
      fall.rot = 0;
    }
  }

  function tryStart() {
    if (state === STATE_OVER && performance.now() - overAt < 600) return; // 오터치 방지
    document.getElementById('over-panel').classList.add('hidden');
    reset();
    state = STATE_PLAY;
  }

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      if (state === STATE_PLAY) move(-1); else tryStart();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      if (state === STATE_PLAY) move(1); else tryStart();
    } else if (state !== STATE_PLAY && (e.key === ' ' || e.key === 'Enter')) {
      tryStart();
    }
  });

  // 터치: 화면 좌/우 절반 아무 데나 탭 (탭 전용 — 홀드/드래그 없음)
  // preventDefault를 걸지 않는다 — 세로 팬이 완충지대 스크롤로 소비되어야
  // 인앱 브라우저 시트가 끌기를 가로채지 않는다
  var lastTouchAt = 0; // 터치 뒤에 따라오는 호환용 mousedown 무시 (한 탭 = 한 걸음)
  canvas.addEventListener('touchstart', function (e) {
    lastTouchAt = performance.now();
    if (state !== STATE_PLAY) { tryStart(); return; }
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      move(t.clientX < W / 2 ? -1 : 1);
    }
  }, { passive: true });

  canvas.addEventListener('mousedown', function (e) {
    if (performance.now() - lastTouchAt < 800) return;
    if (state !== STATE_PLAY) { tryStart(); return; }
    move(e.clientX < W / 2 ? -1 : 1);
  });

  // ---------- 패널 버튼 ----------
  document.getElementById('retry-btn').addEventListener('click', function () { tryStart(); });
  document.getElementById('share-btn').addEventListener('click', function () { shareResult(); });
  var nameInput = document.getElementById('name-input');
  nameInput.value = loadName();
  nameInput.addEventListener('input', function () {
    var v = nameInput.value.slice(0, 8);
    saveName(v);
    if (myRankRow) { myRankRow.n = v || 'You'; saveRanks(courseDay, ranks); renderRanks(); }
  });

  // ---------- 게임오버 ----------
  function gameOver(byCloud) {
    state = STATE_OVER;
    caught = byCloud;
    overAt = performance.now();
    deathAnim = 0;
    shake = 10;
    lastScore = floors;
    if (floors > best) {
      best = floors;
      isNewBest = true;
      try { localStorage.setItem('dailyStairsBest_' + courseDay, String(best)); } catch (e) {}
    }
    if (floors > bestAll) {
      bestAll = floors;
      try { localStorage.setItem('dailyStairsBestAll', String(bestAll)); } catch (e) {}
    }
    recordRank(floors);
    showOverPanel();
  }

  function showOverPanel() {
    document.getElementById('over-title').textContent = caught ? '☁️ Swallowed by the cloud!' : '🪂 Missed a step!';
    document.getElementById('over-score').textContent = lastScore + ' floors';
    var sub = document.getElementById('over-sub');
    sub.className = '';
    if (chSteps > 0) {
      if (lastScore > chSteps) {
        sub.textContent = '🏆 You beat ' + chName + ' (' + chSteps + 'F)!';
        sub.className = 'win';
      } else if (lastScore === chSteps) {
        sub.textContent = 'Tied with ' + chName + ' at ' + chSteps + 'F!';
        sub.className = 'lose';
      } else {
        sub.textContent = (chSteps - lastScore) + 'F short of ' + chName + '\u2026';
        sub.className = 'lose';
      }
    } else if (isNewBest) {
      sub.textContent = '🎉 New daily record!';
      sub.className = 'newbest';
    } else {
      sub.textContent = 'Best today ' + best + 'F \u00b7 all-time ' + bestAll + 'F';
    }
    document.getElementById('board-title').textContent = '🏅 Today\u2019s ranking (' + dayLabel(courseDay) + ') \u2014 same stairs for everyone!';
    document.getElementById('next-note').textContent = 'New stairs at midnight KST \u00b7 ' + untilNextCourse() + ' left';
    ranks = loadRanks(courseDay);
    renderRanks();
    document.getElementById('share-fallback').classList.add('hidden');
    document.getElementById('over-panel').classList.remove('hidden');
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    if (state === STATE_OVER) { deathAnim += dt; return; }
    if (state !== STATE_PLAY) return;

    playT += dt;
    if (introT > 0) introT -= dt;
    if (pressL > 0) pressL -= dt;
    if (pressR > 0) pressR -= dt;
    if (hopT > 0) hopT = Math.max(0, hopT - dt * 9);
    for (var i = flashes.length - 1; i >= 0; i--) {
      flashes[i].t -= dt;
      if (flashes[i].t <= 0) flashes.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 26);

    // 구름 상승 + 고무줄 (너무 뒤처지면 화면 안까지 따라붙는다 — 위협은 항상 보여야 한다)
    hCloud += cloudSpeed() * dt;
    var hPlayer = floors * STEP_DY;
    if (hPlayer - hCloud > H * 0.3) hCloud = hPlayer - H * 0.3;

    if (falling) {
      fall.vh -= 1500 * dt;
      fall.h += fall.vh * dt;
      fall.x += (fall.vx * dt) / STEP_DX;
      fall.rot += dt * 7 * face;
      if (fall.h < hCloud - 20 || fall.h < camH - H) {
        gameOver(false);
        return;
      }
    } else if (hCloud >= hPlayer - 4) {
      gameOver(true);
      return;
    }

    // 플레이어 보간 위치
    var tx = falling ? fall.x : xs[floors];
    var th = falling ? fall.h : floors * STEP_DY;
    drawX += (tx - drawX) * Math.min(1, dt * 18);
    drawH += (th - drawH) * Math.min(1, dt * 18);

    // 카메라: 플레이어가 화면 아래 1/3 지점에 오도록
    var wantH = drawH;
    camH += (wantH - camH) * Math.min(1, dt * 10);
    camX += (drawX - camX) * Math.min(1, dt * 8);
  }

  // ---------- 좌표 변환 ----------
  function sx(unitX) { return W / 2 + (unitX - camX) * STEP_DX; }
  function sy(h) { return H * 0.64 - (h - camH); }

  // ---------- 그리기 ----------
  function drawStep(i) {
    var x = sx(xs[i]);
    var y = sy(i * STEP_DY);
    var w = STEP_DX + 14, hh = 14;
    ctx.fillStyle = '#c98f3e';
    ctx.fillRect(x - w / 2, y, w, hh + 5);
    ctx.fillStyle = i === 0 ? '#9fd08a' : '#ffd98a';
    ctx.fillRect(x - w / 2, y, w, hh);
    ctx.strokeStyle = 'rgba(90,60,20,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - w / 2, y, w, hh);
  }

  function drawStickman(x, y, dead) {
    var h = 46, headR = 8;
    var hop = falling ? 0 : Math.sin(hopT * Math.PI) * 7;
    y -= hop;
    ctx.save();
    ctx.translate(x, y);
    if (falling || dead) ctx.rotate(falling ? fall.rot : Math.min(deathAnim * 3, 1.2) * face);
    ctx.strokeStyle = '#20242e';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    var hipY = -h * 0.42, neckY = -h + headR * 2, headCY = -h + headR;
    var sw = falling ? 0.9 : hopT * 0.8;
    // 다리
    ctx.beginPath();
    ctx.moveTo(0, hipY); ctx.lineTo(-6 - sw * 5, 0);
    ctx.moveTo(0, hipY); ctx.lineTo(6 + sw * 5, 0);
    ctx.stroke();
    // 몸통
    ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(0, neckY); ctx.stroke();
    // 팔
    ctx.beginPath();
    if (falling || dead) {
      ctx.moveTo(0, neckY + 4); ctx.lineTo(-11, neckY - 9);
      ctx.moveTo(0, neckY + 4); ctx.lineTo(11, neckY - 9);
    } else {
      ctx.moveTo(0, neckY + 4); ctx.lineTo(-9 + sw * 4, neckY + 15);
      ctx.moveTo(0, neckY + 4); ctx.lineTo(9 - sw * 4, neckY + 15);
    }
    ctx.stroke();
    // 머리
    ctx.beginPath();
    ctx.arc(0, headCY, headR, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill(); ctx.stroke();
    // 눈
    ctx.fillStyle = '#20242e';
    if (falling || dead) {
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-4, headCY - 3); ctx.lineTo(-1, headCY);
      ctx.moveTo(-1, headCY - 3); ctx.lineTo(-4, headCY);
      ctx.moveTo(1, headCY - 3); ctx.lineTo(4, headCY);
      ctx.moveTo(4, headCY - 3); ctx.lineTo(1, headCY);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(face * 3 - 2, headCY - 1, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(face * 3 + 2, headCY - 1, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawCloud() {
    var top = sy(hCloud);
    if (top > H + 60) return;
    var t = performance.now() / 1000;
    // 몸통
    var g = ctx.createLinearGradient(0, top, 0, top + 160);
    g.addColorStop(0, 'rgba(56,48,88,0.96)');
    g.addColorStop(1, 'rgba(30,26,50,0.99)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-20, top + 24);
    for (var x = -20; x <= W + 20; x += 26) {
      var yy = top + Math.sin(x * 0.045 + t * 2.2) * 9 + Math.sin(x * 0.013 - t * 1.1) * 7;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W + 20, H + 40);
    ctx.lineTo(-20, H + 40);
    ctx.closePath();
    ctx.fill();
    // 상단 경고 발광 — 가까울수록 붉게
    var hPlayer = floors * STEP_DY;
    var near = Math.max(0, 1 - (hPlayer - hCloud) / (H * 0.5));
    ctx.strokeStyle = 'rgba(255,' + Math.round(140 - near * 80) + ',' + Math.round(120 - near * 90) + ',' + (0.5 + near * 0.5).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (var x2 = -20; x2 <= W + 20; x2 += 26) {
      var y2 = top + Math.sin(x2 * 0.045 + t * 2.2) * 9 + Math.sin(x2 * 0.013 - t * 1.1) * 7;
      if (x2 === -20) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
    }
    ctx.stroke();
    // 번개 플리커
    if (Math.random() < 0.03 + near * 0.05) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.06 + Math.random() * 0.1).toFixed(2) + ')';
      ctx.fillRect(-20, top, W + 40, H - top + 40);
    }
  }

  // 친구/도전 기록선
  function drawChallengeLine() {
    if (chSteps <= 0 || chBeaten) return;
    var y = sy(chSteps * STEP_DY) - 26;
    if (y < -30 || y > H + 30) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(70,140,255,0.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 7]);
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(70,140,255,0.95)';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('⚔️ ' + chName + ' ' + chSteps + 'F' + (chIsToday() ? '' : ' (another day\u2019s course)'), 8, y - 6);
    ctx.restore();
  }

  function drawButtons() {
    var y0 = H - BTN_H;
    ctx.fillStyle = 'rgba(20,22,40,0.10)';
    ctx.fillRect(0, y0, W, BTN_H);
    ctx.strokeStyle = 'rgba(20,22,40,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, y0 + 8); ctx.lineTo(W / 2, H - 8);
    ctx.stroke();
    drawBtnArrow(W / 4, y0 + BTN_H / 2, -1, pressL > 0);
    drawBtnArrow(W * 3 / 4, y0 + BTN_H / 2, 1, pressR > 0);
  }
  function drawBtnArrow(cx, cy, dir, pressed) {
    var s = Math.min(22, BTN_H * 0.2);
    ctx.fillStyle = pressed ? 'rgba(20,22,40,0.75)' : 'rgba(20,22,40,0.3)';
    ctx.beginPath();
    ctx.moveTo(cx + dir * s, cy);
    ctx.lineTo(cx - dir * s * 0.7, cy - s);
    ctx.lineTo(cx - dir * s * 0.7, cy + s);
    ctx.closePath();
    ctx.fill();
  }

  function skyColor() {
    // 높이 올라갈수록 노을빛으로
    var k = Math.min(1, floors / 150);
    var r = Math.round(191 + (255 - 191) * k);
    var g2 = Math.round(224 + (200 - 224) * k);
    var b = Math.round(245 + (150 - 245) * k);
    return 'rgb(' + r + ',' + g2 + ',' + b + ')';
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    ctx.fillStyle = skyColor();
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 배경 구름 (장식, 패럴랙스)
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (var b = 0; b < 4; b++) {
      var by = ((b * 260 + 130 - camH * 0.35) % (H + 200) + H + 200) % (H + 200) - 100;
      var bx = (b * 173 + 60) % Math.max(1, W);
      ctx.beginPath();
      ctx.ellipse(bx, by, 46, 15, 0, 0, Math.PI * 2);
      ctx.ellipse(bx + 30, by - 8, 30, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 계단: 화면 범위만
    var lo = Math.max(0, Math.floor((camH - H * 0.5) / STEP_DY));
    var hi = Math.floor((camH + H * 0.8) / STEP_DY) + 2;
    ensureSteps(hi + 2);
    for (var i = lo; i <= hi; i++) drawStep(i);

    drawChallengeLine();

    // 플레이어
    var px = falling ? sx(fall.x) : sx(drawX);
    var py = falling ? sy(fall.h) : sy(drawH);
    drawStickman(px, py, state === STATE_OVER);

    drawCloud();
    if (state === STATE_PLAY) drawButtons();

    // UI
    ctx.textAlign = 'center';
    if (state === STATE_PLAY) {
      ctx.fillStyle = '#20242e';
      ctx.font = 'bold 46px -apple-system, sans-serif';
      ctx.fillText(floors + 'F', W / 2, 62);
      ctx.font = '14px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(32,36,46,0.55)';
      ctx.fillText('BEST TODAY ' + best + 'F \u00b7 ' + dayLabel(courseDay) + ' course', W / 2, 86);

      if (introT > 0) {
        var ia = Math.min(1, introT / 0.35);
        var blink = 0.55 + 0.45 * Math.sin(performance.now() / 90);
        ctx.save();
        ctx.globalAlpha = ia * blink;
        ctx.fillStyle = '#d1342a';
        ctx.font = 'bold 26px -apple-system, sans-serif';
        ctx.fillText('TAP THE SIDE WITH A STAIR!', W / 2, H * 0.36);
        ctx.font = 'bold 40px -apple-system, sans-serif';
        var osc = Math.abs(Math.sin(performance.now() / 130)) * 12;
        ctx.fillText('◀', W * 0.2 - osc, H * 0.36 + 50);
        ctx.fillText('▶', W * 0.8 + osc, H * 0.36 + 50);
        ctx.restore();
      }

      // 플래시 메시지 (친구 기록 돌파 등)
      for (var f = 0; f < flashes.length; f++) {
        var fl = flashes[f];
        ctx.save();
        ctx.globalAlpha = Math.min(1, fl.t / 0.4);
        ctx.fillStyle = '#1d8a3c';
        ctx.font = 'bold 26px -apple-system, sans-serif';
        ctx.fillText(fl.text, W / 2, H * 0.28);
        ctx.restore();
      }
    } else if (state === STATE_TITLE) {
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#20242e';
      var ts = 50;
      ctx.font = 'bold ' + ts + 'px -apple-system, sans-serif';
      while (ts > 24 && ctx.measureText('🪜 DAILY STAIRS').width > W * 0.9) {
        ts -= 2;
        ctx.font = 'bold ' + ts + 'px -apple-system, sans-serif';
      }
      ctx.fillText('🪜 DAILY STAIRS', W / 2, H * 0.24);
      ctx.fillStyle = '#b3543a';
      var subMsg = dayLabel(dayKey()) + ' course \u2014 same stairs for everyone today!';
      var ss = 18;
      ctx.font = 'bold ' + ss + 'px -apple-system, sans-serif';
      while (ss > 12 && ctx.measureText(subMsg).width > W * 0.94) {
        ss -= 1;
        ctx.font = 'bold ' + ss + 'px -apple-system, sans-serif';
      }
      ctx.fillText(subMsg, W / 2, H * 0.24 + 38);
      ctx.font = '16px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(32,36,46,0.7)';
      ctx.fillText('Tap the side the stairs turn to climb', W / 2, H * 0.24 + 68);
      ctx.fillText('A storm cloud chases from below \u2014 don\u2019t stop!', W / 2, H * 0.24 + 92);
      if (best > 0 || bestAll > 0) {
        ctx.fillText('Best today ' + best + 'F \u00b7 all-time ' + bestAll + 'F', W / 2, H * 0.24 + 122);
      }
      if (chSteps > 0) {
        ctx.fillStyle = '#2f6fd6';
        ctx.font = 'bold 17px -apple-system, sans-serif';
        ctx.fillText('⚔️ ' + chName + '\u2019s challenge: beat ' + chSteps + ' floors!', W / 2, H * 0.24 + 154);
      }
      ctx.fillStyle = 'rgba(32,36,46,0.5)';
      ctx.font = '13px -apple-system, sans-serif';
      ctx.fillText('Next stairs in ' + untilNextCourse(), W / 2, H * 0.24 + 184);
      blinkText('TAP TO START!', H * 0.76);
    } else if (state === STATE_OVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
  }

  function blinkText(text, y) {
    var a = 0.55 + 0.45 * Math.sin(performance.now() / 350);
    ctx.save();
    ctx.fillStyle = '#20242e';
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.fillText(text, W / 2, y);
    ctx.restore();
  }

  // ---------- 루프 ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 인앱 브라우저 시트 닫힘 방지: 문서 스크롤을 완충지대 중간(120px)에 걸어 둔다.
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  reset();
  requestAnimationFrame(loop);

  // 헤드리스 테스트용 훅 (해시에 debug가 있을 때만)
  if ((location.hash || '').indexOf('debug') >= 0) {
    window.__game = {
      get state() { return state; },
      get floors() { return floors; },
      get dirs() { return dirs; },
      get hCloud() { return hCloud; },
      get falling() { return falling; },
      get chSteps() { return chSteps; },
      get chName() { return chName; },
      get courseDay() { return courseDay; },
      nextDir: function () { ensureSteps(floors + 2); return dirs[floors]; },
      move: move,
      tryStart: tryStart
    };
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 몸 패턴 찾기 — 디자인 미리보기</title>
<style>
  :root {
    --ground: #FFFCF4;
    --card: #FFFFFF;
    --soft: #FBF6EC;
    --ink: #20302A;
    --ink-dim: #5B6B64;
    --jade: #2F5A4B;
    --jade-deep: #1E3D33;
    --mint: #DCE6E0;
    --copper: #E28C74;
    --blush: #FFEEE8;
    --border: #E6DDCE;
    --shadow: 0 10px 30px rgba(24, 33, 31, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #141E1A;
      --card: #1D2A25;
      --soft: #22302A;
      --ink: #E8EDE9;
      --ink-dim: #9FB0A8;
      --jade: #7FB8A0;
      --jade-deep: #A9D4C2;
      --mint: #2B3B34;
      --copper: #E89B85;
      --blush: #3A2B25;
      --border: #33443C;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="light"] {
    --ground: #FFFCF4; --card: #FFFFFF; --soft: #FBF6EC; --ink: #20302A;
    --ink-dim: #5B6B64; --jade: #2F5A4B; --jade-deep: #1E3D33; --mint: #DCE6E0;
    --copper: #E28C74; --blush: #FFEEE8; --border: #E6DDCE;
    --shadow: 0 10px 30px rgba(24,33,31,.10);
  }
  :root[data-theme="dark"] {
    --ground: #141E1A; --card: #1D2A25; --soft: #22302A; --ink: #E8EDE9;
    --ink-dim: #9FB0A8; --jade: #7FB8A0; --jade-deep: #A9D4C2; --mint: #2B3B34;
    --copper: #E89B85; --blush: #3A2B25; --border: #33443C;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: .12em;
    font-weight: 700;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 20px; }

  .phone {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phone-top {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--soft);
  }
  .phone-top .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--jade); }
  .phone-top .name { font-size: 13px; font-weight: 800; }
  .screen { padding: 20px 18px 24px; min-height: 480px; display: flex; flex-direction: column; }

  .banner {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .banner b { color: var(--ink); }

  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .back {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    width: 34px; height: 34px; border-radius: 99px; cursor: pointer;
    font-size: 15px; line-height: 1; flex: none;
  }
  .track { flex: 1; height: 8px; border-radius: 99px; background: var(--mint); overflow: hidden; }
  .fill { height: 100%; background: var(--jade); border-radius: 99px; transition: width .35s ease; }
  .count { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .q-text { font-size: 18px; font-weight: 800; margin: 4px 0 16px; text-wrap: balance; }

  .opt {
    display: block; width: 100%; text-align: left;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 15px; margin-bottom: 10px;
    font-size: 14.5px; font-family: inherit; line-height: 1.4;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--jade); background: var(--soft); }
  .opt:active { transform: scale(.985); }
  .opt:focus-visible, .btn:focus-visible, .back:focus-visible {
    outline: 2px solid var(--jade); outline-offset: 2px;
  }

  .btn {
    border: none; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 800;
    padding: 13px 22px;
  }
  .btn-primary { background: var(--jade); color: #FFFCF4; }
  :root[data-theme="dark"] .btn-primary, .btn-primary.dark-fix { color: #10201A; }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--border);
  }

  .result-card {
    border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-bottom: 10px; background: var(--card);
  }
  .result-card.primary { border-color: var(--jade); }
  .result-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .result-name { font-weight: 800; font-size: 17px; }
  .result-card.secondary .result-name { font-size: 14px; }
  .pct { font-weight: 900; color: var(--copper); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 99px; background: var(--mint); margin: 10px 0; overflow: hidden; }
  .bar > div { height: 100%; background: var(--copper); border-radius: 99px; transition: width .6s ease; }
  .result-desc { font-size: 13px; color: var(--ink-dim); margin: 0; }

  .section-label { font-size: 13.5px; font-weight: 800; margin: 16px 0 8px; }
  .evidence { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--soft); }
  .evidence p { margin: 0 0 6px; font-size: 13px; }
  .evidence p:last-child { margin-bottom: 0; }

  .paper {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; background: var(--card);
  }
  .paper .t { font-size: 12.5px; font-weight: 700; margin: 0 0 2px; }
  .paper .m { font-size: 11px; color: var(--ink-dim); margin: 0; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .spacer { flex: 1; }
  .note { font-size: 12px; color: var(--ink-dim); margin-top: 22px; text-align: center; }

  .free-toggle {
    background: none; border: none; color: var(--jade); cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 800; padding: 6px 2px;
  }
  textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; font-family: inherit; font-size: 14.5px; line-height: 1.4;
  }
  textarea:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

  .fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; }
    .fill, .bar > div, .opt { transition: none; }
  }
</style>
</head>

    { t:"네, 콕콕 찌르고 늘 같은 자리예요", w:{blood_stasis:3} },
    { t:"밤에 심하지만 자리가 옮겨 다녀요", w:{blood_stasis:1,liver_qi:1} },
    { t:"고정된 통증은 없어요", w:{} } ]},
  { id:"stasis_deep_bruise", text:"멍이 잘 들거나 어둡고 자줏빛 반점이 있나요?", options:[
    { t:"네, 멍이 잘 들고 입술·안색이 어두워요", w:{blood_stasis:3} },
    { t:"아니요", w:{} } ]},
  { id:"blood_deep_palpitation", text:"쉬는데도 가슴이 두근거리거나 생각이 많나요?", options:[
    { t:"네, 두근거리고 생각이 가라앉질 않아요", w:{blood_deficiency:3} },
    { t:"가끔, 주로 피곤할 때요", w:{blood_deficiency:1} },
    { t:"아니요", w:{} } ]},
  { id:"blood_deep_vision", text:"일어설 때 어지럽거나 눈이 침침하고 손발이 저리나요?", options:[
    { t:"네, 일어설 때 어지럽고 눈이 침침해요", w:{blood_deficiency:3} },
    { t:"손발이 저리거나 무감각할 때가 있어요", w:{blood_deficiency:2} },
    { t:"아니요", w:{} } ]},
];

const SESSION = 8, COMMON = 4;
const COMMON_IDS = ["energy","temperature","stress","digestion"];
const DEEP = {
  qi_deficiency: ["sweat","qi_deep_appetite","qi_deep_recovery"],
  yang_deficiency: ["stool","yang_deep_cold_area","yang_deep_urine"],
  yin_deficiency: ["thirst","sleep","yin_deep_five_heart"],
  damp_phlegm: ["head","damp_deep_heaviness","damp_deep_weather"],
  liver_qi: ["mood","liver_deep_chest","liver_deep_variability"],
  blood_stasis: ["pain","stasis_deep_night","stasis_deep_bruise"],
  blood_deficiency: ["complexion","blood_deep_palpitation","blood_deep_vision"],
};

// ── Engine (mirrors PatternFinderEngine) ────────────────────────────────────
let answers = [];   // {qid, idx}
let scores = {};
let basic = { h: null, w: null };

function reset() { answers = []; scores = {}; basic = {h:null,w:null}; for (const k in PATTERNS) scores[k] = 0; }

function rankedIds() {
  return Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
}
function nextQuestion() {
  if (answers.length >= SESSION) return null;
  const done = new Set(answers.map(a => a.qid));
  if (answers.length < COMMON) {
    for (const id of COMMON_IDS) if (!done.has(id)) return QUESTIONS.find(q => q.id === id);
  }
  for (const pid of rankedIds()) {
    if ((scores[pid] || 0) <= 0) break;
    for (const id of (DEEP[pid] || [])) if (!done.has(id)) return QUESTIONS.find(q => q.id === id);
  }
  for (const pid in DEEP) for (const id of DEEP[pid]) if (!done.has(id)) return QUESTIONS.find(q => q.id === id);
  return null;
}
function answeredPairs() {
  return answers.map(a => {
    const q = QUESTIONS.find(x => x.id === a.qid);
    return { q: q.text, a: a.idx === -1 ? a.text : q.options[a.idx].t, free: a.idx === -1 };
  });
}
function answerFree(qid, text) {
  answers.push({ qid, idx: -1, text });
}
function answer(qid, idx) {
  answers.push({ qid, idx });
  const q = QUESTIONS.find(x => x.id === qid);
  for (const [p, w] of Object.entries(q.options[idx].w)) scores[p] += w;
}
function undo() {
  const last = answers.pop();
  if (!last || last.idx === -1) return;
  const q = QUESTIONS.find(x => x.id === last.qid);
  for (const [p, w] of Object.entries(q.options[last.idx].w)) scores[p] -= w;
}
function result() {
  const total = Object.values(scores).filter(v => v > 0).reduce((a, b) => a + b, 0);
  const ranked = rankedIds().filter(id => scores[id] > 0)
    .map(id => ({ id, score: scores[id], share: total ? scores[id] / total : 0 }));
  const lead = ranked[0], second = ranked[1];
  let confidence = "unclear";
  if (lead) {
    const gap = lead.share - (second ? second.share : 0);
    if (lead.share >= 0.30 && gap >= 0.15) confidence = "clear";
    else if (lead.share >= 0.30 && gap >= 0.07) confidence = "moderate";
  }
  const isCombined = !!(lead && second && second.score >= lead.score * 0.75
    && second.score >= lead.score * 0.6);
  const topId = ranked[0]?.id;
  ranked.confidence = confidence; ranked.isCombined = isCombined; ranked.second = second;
  const contributions = [];
  if (topId) for (const a of answers) {
    if (a.idx === -1) continue;
    const o = QUESTIONS.find(x => x.id === a.qid).options[a.idx];
    if ((o.w[topId] || 0) > 0) contributions.push(o.t);
  }
  return { ranked, contributions, confidence, isCombined, second };
}

// ── Views ───────────────────────────────────────────────────────────────────
const screen = document.getElementById("screen");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function showIntro() {
  reset();
  screen.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;flex:1">
      <h2 style="font-size:19px;font-weight:800;margin:6px 0 8px;text-wrap:balance">
        8개의 질문으로<br>내 몸의 패턴 방향을 찾아봐요</h2>
      <p style="font-size:13.5px;color:var(--ink-dim);margin:0 0 16px">
        한 번에 하나씩만 답하면 돼요. 답할 때마다 다음 질문이 달라지고,
        마지막에 내 답변이 가리키는 패턴 방향과 근거 연구를 보여드려요.</p>
      <button class="btn btn-primary" id="start" style="align-self:flex-start">시작하기</button>
      <div class="spacer"></div>
      <div class="banner"><b>ⓘ</b><span>이 결과는 <b>진단이 아니에요</b>.
        최종 판단은 한의사 선생님이 직접 진료로 확인합니다.</span></div>
    </div>`;
  document.getElementById("start").onclick = showBasicInfo;
}

function showBasicInfo() {
  screen.innerHTML = `
    <div class="fade">
      <h2 style="font-size:18px;font-weight:800;margin:2px 0 6px">기본 정보 (선택)</h2>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 16px">
        키와 몸무게는 한의사 선생님이 결과를 볼 때 참고돼요.
        적기 부담스러우면 건너뛰어도 되고, 패턴 점수에는 영향을 주지 않아요.</p>
      <div style="display:flex;gap:10px">
        <input id="bH" type="number" inputmode="decimal" placeholder="키 (cm)"
          style="flex:1;box-sizing:border-box;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:14.5px">
        <input id="bW" type="number" inputmode="decimal" placeholder="몸무게 (kg)"
          style="flex:1;box-sizing:border-box;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:14.5px">
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" id="bGo">질문 시작하기</button>
        <button class="btn btn-ghost" id="bSkip">건너뛰기</button>
      </div>
    </div>`;
  const go = () => {
    const h = parseFloat(document.getElementById("bH").value);
    const w = parseFloat(document.getElementById("bW").value);
    basic = { h: h > 0 ? h : null, w: w > 0 ? w : null };
    showQuestion();
  };
  document.getElementById("bGo").onclick = go;
  document.getElementById("bSkip").onclick = () => { basic = {h:null,w:null}; showQuestion(); };
}

function showQuestion() {
  const q = nextQuestion();
  if (!q) return showResult();
  const n = answers.length;
  screen.innerHTML = `
    <div class="fade">
      <div class="q-head">
        <button class="back" id="back" aria-label="이전">←</button>
        <div class="track"><div class="fill" style="width:${(n / SESSION) * 100}%"></div></div>
        <span class="count">${n + 1}/${SESSION}</span>
      </div>
      <p style="font-size:12px;font-weight:800;letter-spacing:.2px;margin:0 0 6px;color:${n < COMMON ? 'var(--sky,#5B6B64)' : 'var(--jade)'}">${n < COMMON ? '1장 · 공통 문진' : '2장 · 맞춤 심화 문진'}</p>
      ${n === COMMON ? `<div style="border:1px solid #0F766E4d;background:#0F766E14;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px">✨ 지금까지 답변에 맞춰, 이제 나에게 맞는 질문을 몇 가지 더 여쭤볼게요.</div>` : ''}
      <p class="q-text">${esc(q.text)}</p>
      ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}
      <button class="free-toggle" id="freeToggle">✏️ 직접 입력할게요</button>
      <div id="freeBox" style="display:none">
        <textarea id="freeText" rows="3" maxlength="200" placeholder="내 상태를 편하게 적어주세요"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-primary" id="freeOk">이 답변으로 할게요</button>
          <button class="btn btn-ghost" id="freeCancel">취소</button>
        </div>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => {
    if (!answers.length) return showBasicInfo();
    undo(); showQuestion();
  };
  screen.querySelectorAll(".opt").forEach(b =>
    b.onclick = () => { answer(q.id, +b.dataset.i); showQuestion(); });
  const freeToggle = document.getElementById("freeToggle");
  const freeBox = document.getElementById("freeBox");
  freeToggle.onclick = () => {
    freeToggle.style.display = "none";
    freeBox.style.display = "block";
    document.getElementById("freeText").focus();
  };
  document.getElementById("freeCancel").onclick = () => {
    freeBox.style.display = "none";
    freeToggle.style.display = "";
  };
  document.getElementById("freeOk").onclick = () => {
    const text = document.getElementById("freeText").value.trim();
    if (!text) return;
    answerFree(q.id, text);
    showQuestion();
  };
}

function showResult() {
  const r = result();
  const top = r.ranked[0];
  const second = r.ranked[1] && top && r.ranked[1].score >= top.score * 0.6 ? r.ranked[1] : null;
  let html = `<div class="fade">
    <div class="banner" style="margin-bottom:12px"><b>ⓘ</b>
      <span>이 결과는 <b>진단이 아니에요</b>. 한의사 선생님이 직접 확인합니다.</span></div>`;
  if (!top) {
    html += `<div class="result-card"><p style="margin:0;font-size:14px">
      아직 뚜렷한 패턴 방향이 나오지 않았어요. 진료에서 함께 살펴보면 좋아요.</p></div>`;
  } else {
    const CONF = {
      clear:    ["✓", "var(--jade)",   "한 방향이 뚜렷하게 나타났어요."],
      moderate: ["↗", "#D9B44A",       "앞서는 방향이 보이지만, 진료에서 확인하면 좋아요."],
      unclear:  ["?", "var(--sky, #5B6B64)", "아직 한 방향으로 뚜렷하진 않아요 — 진료에서 함께 살펴봐요."],
    };
    const c = CONF[r.confidence];
    html += `<div style="border:1px solid ${c[1]}59;background:${c[1]}14;border-radius:12px;padding:12px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700"><span style="color:${c[1]}">${c[0]}</span> ${c[2]}</div>
      ${r.isCombined && r.second ? `<div style="font-size:12px;color:var(--ink-dim);margin-top:6px">두 방향이 함께 나타나요 — 한의사 선생님이 ${PATTERNS[r.second.id].name}와(과) 겹친 복합 패턴(겸증)으로 볼 수 있어요.</div>` : ""}
    </div>`;
    const card = (s, primary) => `
      <div class="result-card ${primary ? "primary" : "secondary"}">
        <div class="result-row">
          <span class="result-name">${PATTERNS[s.id].name}</span>
          <span class="pct">${Math.round(s.share * 100)}%</span>
        </div>
        <div class="bar"><div style="width:${s.share * 100}%"></div></div>
        <p class="result-desc">${PATTERNS[s.id].desc}</p>
      </div>`;
    html += card(top, true);
    if (second) html += card(second, false);
    if (r.contributions.length) {
      html += `<p class="section-label">이 방향을 가리킨 내 답변</p>
        <div class="evidence">${r.contributions.map(c => `<p>· ${esc(c)}</p>`).join("")}</div>`;
    }
  }
  const bmi = (basic.h && basic.w) ? (basic.w / ((basic.h/100)**2)).toFixed(1) : null;
  if (basic.h || basic.w) {
    html += `<p class="section-label">기본 정보</p>
      <div class="evidence"><p>${[basic.h?`키 ${basic.h}cm`:null, basic.w?`몸무게 ${basic.w}kg`:null, bmi?`BMI ${bmi}`:null].filter(Boolean).join(" · ")}</p></div>`;
  }
  const pairs = answeredPairs();
  if (pairs.length) {
    html += `<details style="margin-top:14px;border:1px solid var(--border);border-radius:14px;background:var(--card)">
      <summary style="padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer">
        내가 답한 내용 모두 보기 (${pairs.length}개)</summary>
      <div style="padding:0 14px 12px">
        ${pairs.map((p, i) => `
          <p style="margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--ink-dim)">Q${i + 1}. ${esc(p.q)}</p>
          <p style="margin:0;font-size:13.5px">${p.free ? "✏️ " : ""}${esc(p.a)}</p>`).join("")}
      </div></details>`;
  }
  html += `<p class="section-label">혀 사진 (선택)</p>
    <p style="font-size:12px;color:var(--ink-dim);margin:-4px 0 8px">혀를 밝은 곳에서 찍어 첨부하면 진료에 도움이 돼요. 앱이 분석하지 않고 선생님이 직접 확인만 합니다.</p>
    <div id="tongueBox">
      <label class="btn btn-ghost" style="display:inline-block">앨범에서 선택
        <input id="tongueInput" type="file" accept="image/*" style="display:none">
      </label>
    </div>`;
  html += `<div class="actions">
      <button class="btn btn-primary" id="share">한의사에게 공유하기</button>
      <button class="btn btn-ghost" id="retry">다시 하기</button>
    </div></div>`;
  screen.innerHTML = html;
  document.getElementById("retry").onclick = showIntro;
  const tongueInput = document.getElementById("tongueInput");
  if (tongueInput) tongueInput.onchange = () => {
    const f = tongueInput.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    document.getElementById("tongueBox").innerHTML =
      `<div style="display:flex;align-items:center;gap:12px">
        <img src="${url}" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--border)">
        <span style="font-weight:700;color:var(--jade)">✓ 사진 첨부됨</span>
      </div>`;
  };
  document.getElementById("share").onclick = e => {
    e.target.textContent = "공유 완료 ✓"; e.target.disabled = true;
  };
}

showIntro();
</script>

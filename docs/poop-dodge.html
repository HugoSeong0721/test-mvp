<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Poop Dodge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 인앱 브라우저 시트 대응: 문서에 240px 스크롤 완충지대를 깔아
     아래로 쓸리는 손가락을 시트 닫기 대신 스크롤로 소비시킨다 */
  html {
    height: 100%;
    overflow: auto;
    overscroll-behavior: none;
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    height: calc(100% + 240px);
    overflow: hidden;
    overscroll-behavior: none;
    background: #f5efe0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  #game {
    display: block;
    position: fixed;
    inset: 0;
    /* 세로 팬은 완충지대 스크롤로 흘려보낸다 — none으로 막으면 iOS가 시트 닫기로 가져간다 */
    touch-action: pan-y;
  }
  /* ── 게임오버 패널 (랭킹/공유) ── */
  #over-panel {
    position: fixed;
    left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    width: min(320px, 86vw);
    background: rgba(30, 24, 16, 0.94);
    color: #fff;
    border-radius: 16px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  #over-panel.hidden { display: none; }
  #over-title { font-size: 26px; font-weight: 800; }
  #over-score { font-size: 34px; font-weight: 800; margin-top: 4px; }
  #over-sub { font-size: 15px; margin-top: 4px; min-height: 18px; color: rgba(255,255,255,0.75); }
  #over-sub.newbest { color: #ffd34d; font-weight: 700; }
  #over-sub.win { color: #7ee787; font-weight: 700; }
  #over-sub.lose { color: #ff8f7a; font-weight: 700; }
  #rank-board {
    margin: 12px 0 8px;
    max-height: 168px; overflow-y: auto;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 14px;
  }
  .rank-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row.me { background: rgba(255, 211, 77, 0.16); }
  .rank-pos { width: 34px; text-align: left; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
  .rank-row.me .rank-pos { color: #ffd34d; }
  .rank-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank-empty { padding: 14px; font-size: 13px; color: rgba(255,255,255,0.5); }
  #name-row {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  #name-input {
    width: 92px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    padding: 5px 8px;
    text-align: center;
  }
  #over-btns { display: flex; gap: 8px; }
  #over-btns button {
    flex: 1;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #retry-btn { background: #ffd34d; color: #3a2c10; }
  #share-btn { background: rgba(255,255,255,0.14); color: #fff; }
  #share-note { font-size: 12px; color: #7ee787; min-height: 15px; margin-top: 7px; }
  #share-fallback {
    width: 100%; margin-top: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff;
    font-size: 12px; padding: 6px 8px;
  }
  #share-fallback.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="over-panel" class="hidden">
  <div id="over-title">💩 SPLAT!</div>
  <div id="over-score"></div>
  <div id="over-sub"></div>
  <div id="rank-board"></div>
  <div id="name-row"><span>Name</span><input id="name-input" maxlength="8" placeholder="You"></div>
  <div id="over-btns">
    <button id="share-btn">Share</button>
    <button id="retry-btn">Play Again</button>
  </div>
  <div id="share-note"></div>
  <input id="share-fallback" class="hidden" readonly>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    // 땅을 넉넉히 올려서 손가락이 캐릭터를 가리지 않게 한다
    GROUND_H = Math.max(90, Math.round(H * 0.18));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- 상태 ----------
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_TITLE;

  var GROUND_H;                // 바닥 높이 (resize에서 화면 비율로 계산)
  var PLAYER_H = 74;           // 졸라맨 키
  var PLAYER_HIT_R = 14;       // 충돌 반경(관대하게)

  var player = { x: 0, vx: 0, targetX: 0, face: 1, walk: 0 };
  var poops = [];              // 떨어지는 똥
  var splats = [];             // 바닥에 튄 자국
  var score = 0;               // 버틴 시간(초)
  var best = 0;
  try { best = parseFloat(localStorage.getItem('poopDodgeBest') || '0') || 0; } catch (e) {}
  var isNewBest = false;

  // ---------- 랭킹 (이 기기에 남는 기록) ----------
  var RANK_MAX = 10;
  var ranks = [], myRankRow = null;
  function loadRanks() {
    try {
      var raw = JSON.parse(localStorage.getItem('poopDodgeRanks') || '[]');
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (r) { return r && typeof r.s === 'number' && isFinite(r.s); })
        .map(function (r) { return { n: String(r.n || 'You').slice(0, 8), s: Math.max(0, Math.round(r.s * 10) / 10), t: r.t || 0 }; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, RANK_MAX);
    } catch (e) { return []; }
  }
  function saveRanks() {
    try { localStorage.setItem('poopDodgeRanks', JSON.stringify(ranks)); } catch (e) {}
  }
  function loadName() {
    try { return (localStorage.getItem('poopDodgeName') || '').slice(0, 8); } catch (e) { return ''; }
  }
  function saveName(v) { try { localStorage.setItem('poopDodgeName', v); } catch (e) {} }
  ranks = loadRanks();

  function renderRanks() {
    var board = document.getElementById('rank-board');
    board.textContent = '';
    if (!ranks.length) {
      var empty = document.createElement('div');
      empty.className = 'rank-empty';
      empty.textContent = 'No records yet.';
      board.appendChild(empty);
      return;
    }
    ranks.forEach(function (r, i) {
      var row = document.createElement('div');
      row.className = 'rank-row' + (r === myRankRow ? ' me' : '');
      var pos = document.createElement('span');
      pos.className = 'rank-pos';
      pos.textContent = '#' + (i + 1);
      var name = document.createElement('span');
      name.className = 'rank-name';
      name.textContent = r.n;               // 이름은 항상 텍스트로만 — 주입 방지
      var s = document.createElement('span');
      s.className = 'rank-s';
      s.textContent = r.s.toFixed(1) + 's';
      row.append(pos, name, s);
      board.appendChild(row);
    });
    var me = board.querySelector('.rank-row.me');
    if (me) me.scrollIntoView({ block: 'nearest' });
  }

  function recordRank(s) {
    var entry = { n: loadName() || 'You', s: Math.round(s * 10) / 10, t: Date.now() };
    ranks.push(entry);
    ranks.sort(function (a, b) { return b.s - a.s; });
    ranks = ranks.slice(0, RANK_MAX);
    myRankRow = ranks.indexOf(entry) >= 0 ? entry : null;
    saveRanks();
    renderRanks();
  }

  // ---------- 도전 (공유 링크에 실려 오는 기록) ----------
  var challengeS = 0;
  function readHashChallenge() {
    try {
      var hit = /(?:^|[#&?])c=(\d{1,7})/.exec(location.hash || '');
      return hit ? Math.min(99999, (parseInt(hit[1], 10) || 0) / 10) : 0;
    } catch (e) { return 0; }
  }
  challengeS = readHashChallenge();
  window.addEventListener('hashchange', function () {
    var s = readHashChallenge();
    if (s > 0) challengeS = s;
  });

  // ---------- 공유 ----------
  function challengeUrl(s) {
    try {
      var u = new URL(location.href);
      u.hash = 'c=' + Math.round(s * 10);
      return u.href;
    } catch (e) { return ''; }
  }
  function note(msg) {
    var el = document.getElementById('share-note');
    el.textContent = msg;
    clearTimeout(note._t);
    note._t = setTimeout(function () { el.textContent = ''; }, 3200);
  }
  function shareResult() {
    var s = Math.round(lastScore * 10) / 10;
    var url = challengeUrl(s);
    var text = '💩 Poop Dodge — I survived ' + s.toFixed(1) + 's. Can you beat me?\nChallenge code: ' + Math.round(s * 10);
    var full = url ? text + '\n' + url : text;
    var done = function () { note('Shared!'); };
    if (navigator.share) {
      navigator.share(url ? { title: 'Poop Dodge', text: text, url: url } : { title: 'Poop Dodge', text: text })
        .then(done)
        .catch(function (e) {
          if (e && e.name === 'AbortError') return;   // 사용자가 취소한 것은 실패가 아니다
          copyFallback(full);
        });
      return;
    }
    copyFallback(full);
  }
  function copyFallback(full) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full)
        .then(function () { note('Challenge link copied!'); })
        .catch(function () { manualCopy(full); });
      return;
    }
    manualCopy(full);
  }
  function manualCopy(full) {
    var fb = document.getElementById('share-fallback');
    fb.value = full;
    fb.classList.remove('hidden');
    fb.focus(); fb.select();
    note('Copy the link below and send it');
  }

  var lastScore = 0;
  var deathAnim = 0;           // 게임오버 연출 타이머
  var shake = 0;
  var introT = 0;              // 시작 직후 조작 안내 플래시 남은 시간
  var spawnTimer = 0;
  var burstLeft = 0;           // 이번 물결에서 남은 똥 개수
  var overAt = 0;              // 게임오버 시각(재시작 오터치 방지)

  function reset() {
    player.x = W / 2;
    player.vx = 0;
    player.targetX = W / 2;
    player.face = 1;
    player.walk = 0;
    poops = [];
    splats = [];
    score = 0;
    isNewBest = false;
    deathAnim = 0;
    shake = 0;
    introT = 1.8;
    spawnTimer = 0.8;
    burstLeft = 0;
  }

  // ---------- 난이도 ----------
  // 중력: 떨어질수록 빨라진다 (천천- 하다가 훅 떨어지는 느낌)
  function gravity() { return 305 + score * 7; }
  function maxFall() { return 580 + score * 11; }
  // 물결(burst) 리듬: 후두둑... 쉬고... 후두두두둑
  function waveGap() { return Math.max(0.38, 1.1 - score * 0.011); }
  function waveSize() { return 2 + Math.floor(score / 8) + Math.floor(Math.random() * 3); }
  function burstGap() { return 0.06 + Math.random() * 0.1; }

  function spawnPoop() {
    var big = Math.random() < Math.min(0.2, 0.04 + score * 0.004);
    var aimed = Math.random() < 0.25; // 일부는 플레이어 머리 위로 조준
    var x = aimed
      ? player.x + (Math.random() * 120 - 60)
      : Math.random() * (W - 40) + 20;
    x = Math.max(16, Math.min(W - 16, x));
    poops.push({
      x: x,
      y: -30 - Math.random() * 40,
      r: big ? 22 : 15,
      vy: 20 + Math.random() * 50,
      g: gravity() * (0.85 + Math.random() * 0.3),
      wob: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 4
    });
  }

  // ---------- 조작 ----------
  var keys = { left: false, right: false };
  var dragging = false;

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return; // 이름 입력 중엔 무시
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (state !== STATE_PLAY && (e.key === ' ' || e.key === 'Enter' || e.key.indexOf('Arrow') === 0)) tryStart();
  });
  document.addEventListener('keyup', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // 터치: 드래그 상대 이동 — 손가락이 움직인 만큼만 1:1로 따라간다
  // (탭 위치로 순간이동하지 않음. 화면 아무 데나 잡고 끌면 됨)
  var dragLastX = 0;
  function pointerDown(x) {
    if (state === STATE_PLAY) {
      dragging = true;
      dragLastX = x;
      player.targetX = player.x;
    } else {
      tryStart();
    }
  }
  function pointerMove(x) {
    if (dragging && state === STATE_PLAY) {
      // 델타 누적: 벽에서 클램프돼도 반대로 끌면 즉시 반응
      player.targetX = Math.max(18, Math.min(W - 18, player.targetX + (x - dragLastX)));
      dragLastX = x;
    }
  }
  function pointerUp() { dragging = false; }

  // preventDefault를 걸지 않는다 — 세로 팬이 문서 완충지대 스크롤로 소비되어야
  // 인앱 브라우저 시트가 끌기를 가로채지 않는다 (가로 드래그는 그대로 우리에게 온다)
  canvas.addEventListener('touchstart', function (e) {
    pointerDown(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    pointerMove(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('touchend', function () { pointerUp(); }, { passive: true });
  canvas.addEventListener('touchcancel', function () { pointerUp(); });

  canvas.addEventListener('mousedown', function (e) { pointerDown(e.clientX); });
  canvas.addEventListener('mousemove', function (e) { pointerMove(e.clientX); });
  canvas.addEventListener('mouseup', pointerUp);

  function tryStart() {
    if (state === STATE_OVER && performance.now() - overAt < 600) return; // 오터치 방지
    document.getElementById('over-panel').classList.add('hidden');
    reset();
    state = STATE_PLAY;
  }

  // ---------- 패널 버튼 ----------
  document.getElementById('retry-btn').addEventListener('click', function () { tryStart(); });
  document.getElementById('share-btn').addEventListener('click', function () { shareResult(); });
  var nameInput = document.getElementById('name-input');
  nameInput.value = loadName();
  nameInput.addEventListener('input', function () {
    var v = nameInput.value.slice(0, 8);
    saveName(v);
    if (myRankRow) { myRankRow.n = v || 'You'; saveRanks(); renderRanks(); }
  });

  // ---------- 업데이트 ----------
  function update(dt) {
    if (state !== STATE_PLAY) {
      if (state === STATE_OVER) deathAnim += dt;
      return;
    }

    score += dt;
    if (introT > 0) introT -= dt;

    // 이동: 관성 — 밀면 가속, 놓으면 미끄러지며 멈춘다
    var ACCEL = 2600, MAXV = 560;
    var input = 0;
    if (keys.left) input -= 1;
    if (keys.right) input += 1;
    if (input !== 0) {
      player.vx += input * ACCEL * dt;
      player.targetX = player.x; // 키 조작 중엔 터치 목표 무시
    } else if (dragging) {
      // 손가락 따라가되 스프링처럼 미끄러지는 감속
      var want = Math.max(-MAXV * 1.4, Math.min(MAXV * 1.4, (player.targetX - player.x) * 10));
      player.vx += (want - player.vx) * Math.min(1, dt * 12);
    } else {
      // 입력 없음: 관성으로 주-욱 미끄러지다 멈춤
      player.vx *= Math.exp(-dt * 3.2);
    }
    player.vx = Math.max(-MAXV * 1.4, Math.min(MAXV * 1.4, player.vx));
    player.x += player.vx * dt;
    if (player.x < 18) { player.x = 18; player.vx = 0; }
    if (player.x > W - 18) { player.x = W - 18; player.vx = 0; }
    if (Math.abs(player.vx) > 20) {
      player.face = player.vx > 0 ? 1 : -1;
      player.walk += Math.abs(player.vx * dt) * 0.09;
    }

    // 똥 생성: 물결 리듬 (후두둑 쏟아지고 잠깐 쉼)
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (burstLeft > 0) {
        spawnPoop();
        burstLeft--;
        spawnTimer = burstLeft > 0 ? burstGap() : waveGap();
      } else {
        burstLeft = waveSize();
        spawnPoop();
        burstLeft--;
        spawnTimer = burstLeft > 0 ? burstGap() : waveGap();
      }
    }

    // 똥 낙하 + 충돌
    var groundY = H - GROUND_H;
    var headY = groundY - PLAYER_H + 12; // 머리 중심
    var bodyY = groundY - PLAYER_H / 2;
    for (var i = poops.length - 1; i >= 0; i--) {
      var p = poops[i];
      p.vy = Math.min(p.vy + p.g * dt, maxFall());
      p.y += p.vy * dt;
      p.wob += dt * 6;

      // 충돌: 머리/몸통 두 점과 원 거리
      var hit =
        dist2(p.x, p.y, player.x, headY) < sq(p.r + PLAYER_HIT_R) ||
        dist2(p.x, p.y, player.x, bodyY) < sq(p.r + PLAYER_HIT_R - 3);
      if (hit) {
        gameOver();
        return;
      }

      if (p.y > groundY - 4) {
        splats.push({ x: p.x, y: groundY + Math.random() * 30 + 4, r: p.r, t: 0 });
        if (splats.length > 40) splats.shift();
        poops.splice(i, 1);
      }
    }
    for (var s = 0; s < splats.length; s++) splats[s].t += dt;

    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }

  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function sq(v) { return v * v; }

  function gameOver() {
    state = STATE_OVER;
    overAt = performance.now();
    deathAnim = 0;
    shake = 12;
    lastScore = score;
    if (score > best) {
      best = score;
      isNewBest = true;
      try { localStorage.setItem('poopDodgeBest', String(best)); } catch (e) {}
    }
    recordRank(score);
    showOverPanel();
  }

  function showOverPanel() {
    document.getElementById('over-score').textContent = 'Survived ' + lastScore.toFixed(1) + 's';
    var sub = document.getElementById('over-sub');
    sub.className = '';
    if (challengeS > 0) {
      if (lastScore > challengeS) {
        sub.textContent = '🏆 Challenge won! You beat ' + challengeS.toFixed(1) + 's';
        sub.className = 'win';
      } else {
        sub.textContent = 'Challenge failed… target was ' + challengeS.toFixed(1) + 's';
        sub.className = 'lose';
      }
    } else if (isNewBest) {
      sub.textContent = '🎉 New record!';
      sub.className = 'newbest';
    } else {
      sub.textContent = 'Best ' + best.toFixed(1) + 's';
    }
    document.getElementById('share-fallback').classList.add('hidden');
    document.getElementById('over-panel').classList.remove('hidden');
  }

  // ---------- 그리기 ----------
  function drawPoop(x, y, r, wob) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(wob) * 0.15);
    ctx.fillStyle = '#7a4a21';
    // 3단 소프트 아이스크림 모양
    blob(0, r * 0.45, r, r * 0.55);
    blob(0, 0, r * 0.78, r * 0.5);
    blob(0, -r * 0.42, r * 0.52, r * 0.42);
    // 꼭지
    ctx.beginPath();
    ctx.moveTo(-r * 0.18, -r * 0.72);
    ctx.quadraticCurveTo(r * 0.05, -r * 1.15, r * 0.3, -r * 0.6);
    ctx.fill();
    // 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.1, r * 0.2, r * 0.32, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // 눈 (귀엽게)
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.05, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.25, r * 0.05, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1a0c';
    ctx.beginPath(); ctx.arc(-r * 0.22, r * 0.08, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.28, r * 0.08, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function blob(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStickman(x, groundY, dead) {
    var h = PLAYER_H;
    var headR = 13;
    var hipY = groundY - h * 0.42;
    var neckY = groundY - h + headR * 2 + 4;
    var headCY = groundY - h + headR;
    var swing = dead ? 0 : Math.sin(player.walk);

    ctx.save();
    ctx.translate(x, 0);
    if (dead) {
      // 뻗은 연출: 옆으로 기울어짐
      ctx.translate(0, groundY);
      ctx.rotate(Math.min(deathAnim * 3, Math.PI / 2) * (player.face >= 0 ? 1 : -1));
      ctx.translate(0, -groundY);
    }

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    // 다리
    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.lineTo(-8 - swing * 6, groundY);
    ctx.moveTo(0, hipY);
    ctx.lineTo(8 + swing * 6, groundY);
    ctx.stroke();
    // 몸통
    ctx.beginPath();
    ctx.moveTo(0, hipY);
    ctx.lineTo(0, neckY);
    ctx.stroke();
    // 팔 (달릴 때 흔들, 죽으면 만세)
    ctx.beginPath();
    if (dead) {
      ctx.moveTo(0, neckY + 6); ctx.lineTo(-14, neckY - 12);
      ctx.moveTo(0, neckY + 6); ctx.lineTo(14, neckY - 12);
    } else {
      ctx.moveTo(0, neckY + 6); ctx.lineTo(-12 + swing * 5, neckY + 22);
      ctx.moveTo(0, neckY + 6); ctx.lineTo(12 - swing * 5, neckY + 22);
    }
    ctx.stroke();
    // 머리
    ctx.beginPath();
    ctx.arc(0, headCY, headR, 0, Math.PI * 2);
    ctx.fillStyle = '#f5efe0';
    ctx.fill();
    ctx.stroke();
    // 얼굴
    if (dead) {
      // X X 눈
      ctx.lineWidth = 2;
      xEye(-5, headCY - 2); xEye(5, headCY - 2);
      ctx.beginPath();
      ctx.arc(0, headCY + 6, 3, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(player.face * 4 - 3, headCY - 3, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.face * 4 + 3, headCY - 3, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.face * 3, headCY + 3, 4, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }
  function xEye(ox, oy) {
    ctx.beginPath();
    ctx.moveTo(ox - 3, oy - 3); ctx.lineTo(ox + 3, oy + 3);
    ctx.moveTo(ox + 3, oy - 3); ctx.lineTo(ox - 3, oy + 3);
    ctx.stroke();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // 하늘
    ctx.fillStyle = '#f5efe0';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    var groundY = H - GROUND_H;

    // 바닥
    ctx.fillStyle = '#d9cba8';
    ctx.fillRect(-20, groundY, W + 40, GROUND_H + 20);
    ctx.strokeStyle = '#b7a577';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-20, groundY);
    ctx.lineTo(W + 20, groundY);
    ctx.stroke();

    // 바닥 자국
    for (var s = 0; s < splats.length; s++) {
      var sp = splats[s];
      var a = Math.max(0, 0.55 - sp.t * 0.08);
      if (a <= 0) continue;
      ctx.fillStyle = 'rgba(122,74,33,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, sp.r * 1.1, sp.r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 똥
    for (var i = 0; i < poops.length; i++) {
      var p = poops[i];
      drawPoop(p.x, p.y, p.r, p.wob);
    }

    // 졸라맨
    drawStickman(player.x, groundY, state === STATE_OVER);

    // UI
    ctx.textAlign = 'center';
    if (state === STATE_PLAY) {
      ctx.fillStyle = '#222';
      ctx.font = 'bold 42px -apple-system, sans-serif';
      ctx.fillText(score.toFixed(1) + 's', W / 2, 64);
      ctx.font = '15px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(34,34,34,0.5)';
      ctx.fillText('BEST ' + best.toFixed(1) + 's', W / 2, 88);
      if (challengeS > 0) {
        var beat = score > challengeS;
        ctx.fillStyle = beat ? '#1d8a3c' : '#b3543a';
        ctx.font = 'bold 15px -apple-system, sans-serif';
        ctx.fillText(beat ? '🏆 Challenge beaten!' : 'CHALLENGE ' + challengeS.toFixed(1) + 's', W / 2, 112);
      }
      // 시작 직후 급박한 조작 안내 — 잠깐 번쩍이다 사라진다
      if (introT > 0) {
        var ia = Math.min(1, introT / 0.35);                       // 끝에서 페이드아웃
        var blink = 0.55 + 0.45 * Math.sin(performance.now() / 90); // 다급하게 깜빡임
        var osc = Math.abs(Math.sin(performance.now() / 130)) * 14; // 화살표가 바깥으로 튐
        ctx.save();
        ctx.globalAlpha = ia * blink;
        ctx.fillStyle = '#d1342a';
        ctx.font = 'bold 32px -apple-system, sans-serif';
        ctx.fillText('SWIPE LEFT & RIGHT!', W / 2, H * 0.42);
        ctx.font = 'bold 44px -apple-system, sans-serif';
        ctx.fillText('◀', W / 2 - W * 0.3 - osc, H * 0.42 + 54);
        ctx.fillText('▶', W / 2 + W * 0.3 + osc, H * 0.42 + 54);
        ctx.restore();
      }
    } else if (state === STATE_TITLE) {
      ctx.fillStyle = '#222';
      // 화면 폭에 맞게 타이틀 크기 조절
      var ts = 52;
      ctx.font = 'bold ' + ts + 'px -apple-system, sans-serif';
      while (ts > 24 && ctx.measureText('💩 POOP DODGE').width > W * 0.92) {
        ts -= 2;
        ctx.font = 'bold ' + ts + 'px -apple-system, sans-serif';
      }
      ctx.fillText('💩 POOP DODGE', W / 2, H * 0.3);
      ctx.font = '20px -apple-system, sans-serif';
      ctx.fillText('Dodge the falling poop!', W / 2, H * 0.3 + 42);
      ctx.font = '17px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(34,34,34,0.6)';
      ctx.fillText('Drag with your finger, or ← → keys', W / 2, H * 0.3 + 74);
      if (best > 0) {
        ctx.fillText('Best: ' + best.toFixed(1) + 's', W / 2, H * 0.3 + 102);
      }
      if (challengeS > 0) {
        ctx.fillStyle = '#b3543a';
        ctx.font = 'bold 18px -apple-system, sans-serif';
        ctx.fillText('⚔️ CHALLENGE: beat ' + challengeS.toFixed(1) + 's!', W / 2, H * 0.3 + 136);
      }
      blinkText('TAP TO START!', H * 0.62);
    } else if (state === STATE_OVER) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
  }

  function blinkText(text, y) {
    var a = 0.55 + 0.45 * Math.sin(performance.now() / 350);
    ctx.save();
    ctx.fillStyle = '#222';
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.fillText(text, W / 2, y);
    ctx.restore();
  }

  // ---------- 루프 ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  // 인앱 브라우저 시트 닫힘 방지: 문서 스크롤을 완충지대 중간(120px)에 걸어 둔다.
  // 제스처 도중에는 건드리지 않고, 새 터치 시작 시와 스크롤이 잠잠해진 뒤 다시 건다.
  var SE = document.scrollingElement || document.documentElement;
  var PIN = 120, pinT = null;
  function pinScroll() {
    var max = SE.scrollHeight - SE.clientHeight;
    if (max <= 0) return;
    SE.scrollTop = Math.min(PIN, Math.max(1, max - 1));
  }
  document.addEventListener('touchstart', pinScroll, { passive: true });
  window.addEventListener('scroll', function () {
    clearTimeout(pinT); pinT = setTimeout(pinScroll, 250);
  }, { passive: true });
  pinScroll();

  reset();
  requestAnimationFrame(loop);

  // 헤드리스 테스트용 훅 (#debug 해시로 열었을 때만)
  if (location.hash === '#debug') {
    window.__game = {
      get state() { return state; },
      get score() { return score; },
      get poops() { return poops; },
      get player() { return player; },
      get W() { return W; },
      get H() { return H; }
    };
  }
})();
</script>
</body>
</html>

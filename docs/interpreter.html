<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>마주보기 통역 · Face-to-Face Interpreter</title>
<style>
  :root{
    --bg:#0e1117; --panel:#151a23; --line:#2a3242;
    --me:#2dd4bf; --you:#fbbf24; --text:#e8edf5; --dim:#8b95a7; --sec:#b7c2d4; --bad:#f87171;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
       overscroll-behavior:none;}
  /* in-app browser sheet-drag buffer: app fixed, document gets scroll slack */
  #scrollpad{height:calc(100% + 240px);}
  #app{position:fixed; inset:0; display:flex; flex-direction:column; touch-action:pan-y;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

  .panel{flex:1 1 0; min-height:0; display:flex; flex-direction:column; background:var(--panel); overflow:hidden;}
  .panel.flip{transform:rotate(180deg);}

  .divider{height:2px; background:var(--line); position:relative; flex:none;}
  .divider span{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    font-size:10px; color:var(--dim); padding:2px 10px; white-space:nowrap; letter-spacing:.5px;}

  .langrow{flex:none; display:flex; gap:6px; justify-content:center; align-items:center; padding:8px 10px 2px;}
  .langrow .hint{font-size:10px; color:var(--dim); margin-right:2px;}
  .chip{border:1px solid var(--line); background:transparent; color:var(--dim);
        border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600;}
  .panel[data-side="you"] .chip.on{background:var(--you); border-color:var(--you); color:#1c1917;}
  .panel[data-side="me"]  .chip.on{background:var(--me);  border-color:var(--me);  color:#042f2e;}

  .feed{flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:flex-end;
        padding:4px 16px; overflow:hidden;}
  .msg{margin-top:8px; line-height:1.28; word-break:keep-all; overflow-wrap:anywhere;}
  .msg.old1{font-size:15px; color:var(--dim); opacity:.75;}
  .msg.old2{font-size:13px; color:var(--dim); opacity:.45;}
  .msg.big{font-weight:800;}
  .msg .second{display:block; font-size:58%; font-weight:600; color:var(--sec); margin-top:7px;}
  .msg .orig{display:block; font-size:12px; font-weight:400; color:var(--dim); margin-top:5px;}
  .msg .warn{color:var(--bad);}
  .msg.livemsg{animation:livepulse 1.4s ease-in-out infinite;}
  @keyframes livepulse{0%,100%{opacity:1;} 50%{opacity:.55;}}
  .mine{font-size:12px; color:var(--dim); text-align:right; font-weight:400;}
  .placeholder{color:var(--dim); font-size:14px; text-align:center; margin:auto 0; opacity:.8;}

  .interim{flex:none; min-height:20px; padding:2px 16px; font-size:14px; color:var(--dim);
           font-style:italic; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .interim.live{color:var(--text);}

  .ctrl{flex:none; display:flex; align-items:center; justify-content:center; gap:14px; padding:6px 14px 14px;}
  .status{flex:1 1 0; font-size:12px; color:var(--dim); text-align:right;}
  .spacer{flex:1 1 0; display:flex; align-items:center;}
  .mic{width:72px; height:72px; border-radius:50%; border:none; flex:none;
       font-size:30px; color:#0b0f14; display:flex; align-items:center; justify-content:center;
       box-shadow:0 4px 14px rgba(0,0,0,.45); transition:transform .1s;}
  .mic:active{transform:scale(.93);}
  .panel[data-side="me"]  .mic{background:var(--me);}
  .panel[data-side="you"] .mic{background:var(--you);}
  .mic.rec{background:#ef4444 !important; color:#fff; animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55);} 50%{box-shadow:0 0 0 16px rgba(239,68,68,0);}}
  .kbd{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:transparent;
       color:var(--dim); font-size:18px;}

  .typerow{flex:none; display:none; gap:8px; padding:0 14px 12px;}
  .typerow.show{display:flex;}
  .typerow input{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px;
                 color:var(--text); font-size:16px; padding:10px 12px; min-width:0;}
  .typerow button{border:none; border-radius:10px; padding:0 16px; font-size:15px; font-weight:700; color:#0b0f14;}
  .panel[data-side="me"]  .typerow button{background:var(--me);}
  .panel[data-side="you"] .typerow button{background:var(--you);}
</style>
</head>
<body>
<div id="scrollpad"></div>
<div id="app"></div>

<script>
(function(){
  'use strict';

  var LANGS = {
    ko:{label:'한국어', sr:'ko-KR',
        tap:'마이크를 탭하고 말하세요', listen:'듣는 중… 탭하면 정지', read:'상대방의 말이 여기에 크게 표시됩니다',
        fail:'번역 실패 · 원문 표시', type:'메시지 입력…', send:'전송', reads:'내가 읽을 언어(2개까지)', nosr:'이 브라우저는 음성 인식을 지원하지 않아요. 키보드로 입력하세요.'},
    en:{label:'English', sr:'en-US',
        tap:'Tap the mic & speak', listen:'Listening… tap to stop', read:'What the other person says appears here',
        fail:'Translation failed · original shown', type:'Type a message…', send:'Send', reads:'I read in (up to 2)', nosr:'Speech recognition not supported here. Use the keyboard.'},
    ru:{label:'Русский', sr:'ru-RU',
        tap:'Нажмите на микрофон и говорите', listen:'Слушаю… нажмите, чтобы остановить', read:'Слова собеседника появятся здесь',
        fail:'Ошибка перевода · показан оригинал', type:'Введите сообщение…', send:'Отпр.', reads:'Я читаю на (до 2)', nosr:'Распознавание речи не поддерживается. Используйте клавиатуру.'}
  };
  var ORDER = ['ko','en','ru'];
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  var app = document.getElementById('app');
  var sides = {};

  function el(tag, cls, parent){ var e=document.createElement(tag); if(cls) e.className=cls; if(parent) parent.appendChild(e); return e; }

  function beep(freq, dur){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!beep.ctx) beep.ctx = new AC();
      var c = beep.ctx, o = c.createOscillator(), g = c.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.08, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.start(); o.stop(c.currentTime + dur);
    }catch(e){}
  }

  function fetchTimeout(url, ms){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    if(ctrl) setTimeout(function(){ ctrl.abort(); }, ms);
    return fetch(url, ctrl ? {signal:ctrl.signal} : {});
  }

  // provider 1: Google gtx — fast but rate-limits (429) under bursty use
  var gtxBlockedUntil = 0;
  function viaGtx(text, sl, tl){
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl
            + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
    return fetchTimeout(url, 7000).then(function(r){
      if(r.status === 429){ gtxBlockedUntil = Date.now() + 60000; throw new Error('429'); }
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(function(j){
      var out = (j && j[0]) ? j[0].map(function(s){return s[0]||'';}).join('') : '';
      if(!out) throw new Error('empty');
      return out;
    });
  }

  // provider 2: MyMemory — fallback while gtx is cooling down
  function viaMyMemory(text, sl, tl){
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text)
            + '&langpair=' + sl + '%7C' + tl;
    return fetchTimeout(url, 7000).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(function(j){
      var out = j && j.responseData && j.responseData.translatedText;
      if(!out || j.responseStatus != 200 || /MYMEMORY WARNING/i.test(out)) throw new Error('mm');
      return out;
    });
  }

  var cache = {}; var cacheKeys = [];
  function translate(text, sl, tl){
    if(sl === tl) return Promise.resolve(text);
    var key = sl + '|' + tl + '|' + text;
    if(cache[key] !== undefined) return Promise.resolve(cache[key]);
    var first = (Date.now() > gtxBlockedUntil) ? viaGtx : viaMyMemory;
    var second = (first === viaGtx) ? viaMyMemory : viaGtx;
    return first(text, sl, tl)
      .catch(function(){ return second(text, sl, tl); })
      .then(function(out){
        cache[key] = out; cacheKeys.push(key);
        if(cacheKeys.length > 300) delete cache[cacheKeys.shift()];
        return out;
      });
  }

  // translate into every listener language; per-language fallback to original
  function translateAll(text, sl, langs){
    return Promise.all(langs.map(function(tl){
      return translate(text, sl, tl).then(function(out){ return {lang:tl, text:out, ok:true}; })
        .catch(function(){ return {lang:tl, text:text, ok:false}; });
    }));
  }

  function bigSize(t){
    var n = t.length;
    if(n <= 14) return 'clamp(28px, 8.5vw, 44px)';
    if(n <= 40) return 'clamp(22px, 6.5vw, 34px)';
    if(n <= 90) return 'clamp(18px, 5vw, 26px)';
    return 'clamp(15px, 4.2vw, 21px)';
  }

  function makeSide(id, defRead, flip){
    var p = el('div','panel'+(flip?' flip':''), app);
    p.dataset.side = id;

    var langrow = el('div','langrow',p);
    var hint = el('span','hint',langrow);
    var chips = {};
    ORDER.forEach(function(code){
      var b = el('button','chip',langrow);
      b.type='button'; b.textContent = LANGS[code].label;
      b.addEventListener('click', function(){ toggleLang(s, code); });
      chips[code] = b;
    });

    var feed = el('div','feed',p);
    var interim = el('div','interim',p);

    var ctrl = el('div','ctrl',p);
    var spacer = el('div','spacer',ctrl);
    var kbd = el('button','kbd',spacer); kbd.type='button'; kbd.textContent='⌨';
    var mic = el('button','mic',ctrl); mic.type='button'; mic.textContent='🎤';
    var status = el('div','status',ctrl);

    var typerow = el('div','typerow',p);
    var input = el('input','',typerow); input.type='text'; input.autocomplete='off';
    var send = el('button','',typerow); send.type='button';

    var s = {
      id:id, read:defRead.slice(), panel:p, chips:chips, hint:hint, feed:feed, interim:interim,
      mic:mic, status:status, typerow:typerow, input:input, send:send,
      active:false, rec:null, msgs:[],
      live:null, liveSeq:0,          // incoming live (pre-final) translation shown on this side
      pendingLive:null, liveTimer:null // outgoing interim awaiting translation
    };

    mic.addEventListener('click', function(){ toggleMic(s); });
    kbd.addEventListener('click', function(){
      typerow.classList.toggle('show');
      if(typerow.classList.contains('show')) input.focus();
    });
    function submitTyped(){
      var t = input.value.trim();
      if(!t) return;
      input.value='';
      handleUtterance(s, t);
    }
    send.addEventListener('click', submitTyped);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') submitTyped(); });

    syncLangUI(s);
    return s;
  }

  function other(s){ return s.id==='me' ? sides.you : sides.me; }
  function L(s){ return LANGS[s.read[0]]; }

  function toggleLang(s, code){
    var i = s.read.indexOf(code);
    if(i >= 0){
      if(s.read.length > 1) s.read.splice(i,1);   // keep at least one
    }else{
      s.read.push(code);
      if(s.read.length > 2) s.read.shift();        // at most two
    }
    syncLangUI(s);
    if(s.active){ stopMic(s); startMic(s); }        // re-listen with new primary language
    renderFeed(s);
  }

  function syncLangUI(s){
    ORDER.forEach(function(c){ s.chips[c].classList.toggle('on', s.read.indexOf(c)>=0); });
    s.hint.textContent = L(s).reads + ':';
    s.input.placeholder = L(s).type;
    s.send.textContent = L(s).send;
    s.status.textContent = s.active ? L(s).listen : (SR ? L(s).tap : L(s).nosr);
  }

  function renderBig(d, m, isLive){
    d.style.fontSize = bigSize(m.parts[0].text);
    d.textContent = m.parts[0].text + (isLive ? ' ▏' : '');
    for(var j=1; j<m.parts.length; j++){
      var sec = el('span','second',d);
      sec.textContent = m.parts[j].text;
    }
    if(!isLive){
      if(m.warn){
        var w = el('span','orig warn',d); w.textContent = '⚠ ' + L(sidesOf(d)).fail;
      }else if(m.orig && m.orig !== m.parts[0].text){
        var o = el('span','orig',d); o.textContent = m.orig;
      }
    }
  }
  function sidesOf(node){
    return node.closest('.panel').dataset.side === 'me' ? sides.me : sides.you;
  }

  function renderFeed(s){
    s.feed.innerHTML = '';
    var hasLive = !!s.live;
    if(!s.msgs.length && !hasLive){
      var ph = el('div','placeholder',s.feed);
      ph.textContent = L(s).read;
      return;
    }
    var last = s.msgs.slice(hasLive ? -3 : -4);
    var bigIdx = -1;
    if(!hasLive){
      for(var k=last.length-1; k>=0; k--){ if(!last[k].self){ bigIdx=k; break; } }
    }
    last.forEach(function(m, i){
      var d = el('div','msg',s.feed);
      if(m.self){
        d.classList.add('mine');
        d.textContent = '🗣 ' + m.text;
        return;
      }
      if(i === bigIdx){
        d.classList.add('big');
        renderBig(d, m, false);
      }else{
        d.classList.add(i >= (bigIdx>=0?bigIdx:last.length)-1 ? 'old1' : 'old2');
        d.textContent = m.parts[0].text;
      }
    });
    if(hasLive){
      var ld = el('div','msg big livemsg',s.feed);
      renderBig(ld, s.live, true);
    }
  }

  function pushMsg(s, msg){
    s.msgs.push(msg);
    if(s.msgs.length > 12) s.msgs.splice(0, s.msgs.length-12);
    renderFeed(s);
  }

  // ---- live (pre-final) translation while the speaker is still talking ----
  // throttled to ~1 req/900ms, primary listener language only, to stay under rate limits
  function scheduleLive(s, text){
    var t = other(s);
    s.pendingLive = text;
    if(s.liveTimer) return;                 // debounce: one in-flight window at a time
    s.liveTimer = setTimeout(function(){
      s.liveTimer = null;
      var txt = s.pendingLive;
      if(!txt || txt === s.liveSent) return; // unchanged since last live request
      s.liveSent = txt;
      var id = ++t.liveSeq;
      translateAll(txt, s.read[0], [t.read[0]]).then(function(parts){
        if(id !== t.liveSeq) return;        // superseded by newer interim or a final
        t.live = {parts:parts};
        renderFeed(t);
      });
    }, 900);
  }

  function cancelLive(s){
    s.pendingLive = null; s.liveSent = null;
    if(s.liveTimer){ clearTimeout(s.liveTimer); s.liveTimer = null; }
    var t = other(s);
    t.liveSeq++;
    if(t.live){ t.live = null; renderFeed(t); }
  }

  // speaker s said `text` (final) → translate into the listener's language(s)
  function handleUtterance(s, text){
    cancelLive(s);
    var target = other(s);
    pushMsg(s, {self:true, text:text});
    translateAll(text, s.read[0], target.read).then(function(parts){
      var allFail = parts.every(function(p){ return !p.ok; });
      pushMsg(target, {parts:parts, orig:text, warn:allFail});
    });
  }

  function startMic(s){
    if(!SR) return;
    var o = other(s);
    if(o.active) stopMic(o);       // one recognizer at a time
    var rec = new SR();
    rec.lang = L(s).sr;
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function(ev){
      var interim='', finals=[];
      for(var i=ev.resultIndex; i<ev.results.length; i++){
        var r = ev.results[i];
        if(r.isFinal) finals.push(r[0].transcript.trim());
        else interim += r[0].transcript;
      }
      if(interim){
        s.interim.textContent = interim; s.interim.classList.add('live');
        scheduleLive(s, interim);       // translate while still speaking
      }
      finals.forEach(function(t){
        if(!t) return;
        s.interim.textContent=''; s.interim.classList.remove('live');
        handleUtterance(s, t);
      });
    };
    rec.onerror = function(ev){
      if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){
        s.active = false; syncMicUI(s);
      }
    };
    rec.onend = function(){
      if(s.active && s.rec === rec){
        try{ rec.start(); }catch(e){
          setTimeout(function(){ if(s.active && s.rec===rec){ try{rec.start();}catch(_){} } }, 250);
        }
      }
    };
    s.rec = rec;
    try{ rec.start(); s.active = true; }catch(e){ s.active = false; }
    syncMicUI(s);
    if(s.active) beep(880, .12);
  }

  function stopMic(s){
    s.active = false;
    if(s.rec){ var r=s.rec; s.rec=null; try{ r.onend=null; r.stop(); }catch(e){} }
    s.interim.textContent=''; s.interim.classList.remove('live');
    cancelLive(s);
    syncMicUI(s);
  }

  function toggleMic(s){
    if(!SR){ s.typerow.classList.add('show'); s.input.focus(); return; }
    if(s.active){ stopMic(s); beep(440,.1); } else { startMic(s); }
  }

  function syncMicUI(s){
    s.mic.classList.toggle('rec', s.active);
    s.mic.textContent = s.active ? '■' : '🎤';
    s.status.textContent = s.active ? L(s).listen : (SR ? L(s).tap : L(s).nosr);
  }

  // ---- build UI: top = the other person (flipped), bottom = me ----
  sides.you = makeSide('you', ['ru'], true);
  var div = el('div','divider',app);
  el('span','',div).textContent = '↕ FACE-TO-FACE INTERPRETER ↕';
  sides.me  = makeSide('me', ['ko','en'], false);
  renderFeed(sides.you); renderFeed(sides.me);

  if(!SR){
    sides.me.typerow.classList.add('show');
    sides.you.typerow.classList.add('show');
    syncMicUI(sides.me); syncMicUI(sides.you);
  }

  // keep the sheet-drag buffer engaged
  function anchor(){ window.scrollTo(0,120); }
  anchor();
  var st=null;
  window.addEventListener('scroll', function(){
    clearTimeout(st); st = setTimeout(anchor, 350);
  }, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(anchor, 300); });
})();
</script>
</body>
</html>

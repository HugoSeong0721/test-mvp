name: Fetch TCM research papers

# Runs the paper collector on a daily schedule, fetches any new TCM
# syndrome-differentiation / adaptive-inquiry papers, and commits the growing
# corpus back to the repository so it can be used as a data source by the app.

on:
  schedule:
    # 00:20 UTC every day (= 09:20 KST). GitHub cron is always UTC.
    - cron: "20 0 * * *"
  # Allow manual runs from the Actions tab (handy for the first run / testing).
  workflow_dispatch:

# Needed so the workflow can push the updated corpus back to the repo.
permissions:
  contents: write

concurrency:
  group: fetch-tcm-papers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch new papers
        run: python3 tools/fetch_tcm_papers.py

      - name: Write run summary
        run: |
          if [ -f research/.last_run.json ]; then
            echo "### TCM paper collector" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat research/.last_run.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/papers.json research/papers.md
          if git diff --cached --quiet; then
            echo "No new papers today — nothing to commit."
          else
            added=$(python3 -c "import json;print(json.load(open('research/.last_run.json'))['added'])" 2>/dev/null || echo "?")
            git commit -m "chore(research): add ${added} new TCM paper(s) [skip ci]"
            git push
          fi

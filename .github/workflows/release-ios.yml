name: Release iOS (환율 앱 → App Store Connect)

# 맥 없이 App Store Connect 에 빌드를 올린다. 수동 실행 전용(Actions → Run workflow).
# Xcode 클라우드 서명 + App Store Connect API 키로 인증서·프로파일을 자동으로 만든다.
#
# 필요한 저장소 Secrets (만드는 법: currency_app/flutter/README.md 의 iOS 절)
#   APPLE_TEAM_ID          developer.apple.com → Account → Membership details 의 Team ID (10자리)
#   ASC_KEY_ID             App Store Connect API 키 ID (10자리)
#   ASC_ISSUER_ID          같은 화면 위쪽의 Issuer ID (UUID)
#   ASC_KEY_P8             내려받은 AuthKey_XXXX.p8 파일 내용 전체 (BEGIN/END 줄 포함)
#
# 빌드 번호는 실행 번호(run_number)를 써서 올릴 때마다 자동으로 커진다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: currency_app/flutter
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets 가 비어 있습니다:$missing — README 의 iOS 절 참고"
            exit 1
          fi
        working-directory: .

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Flutter build config
        run: flutter build ios --release --config-only --no-codesign --build-number=${{ github.run_number }}

      # 아카이브는 서명 없이 만든다. 자동 서명으로 아카이브하면 개발용 프로파일이 필요하고,
      # 그건 등록된 기기가 있어야 만들어진다. App Store 배포 서명은 다음 export 단계에서
      # 클라우드 서명이 한 번에 붙인다 (기기 불필요).
      - name: Archive (서명 없이)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tail -n 80
          test -d "$RUNNER_TEMP/Runner.xcarchive"

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "업로드 완료 — App Store Connect → 앱 → TestFlight 에 10~30분 뒤 빌드 ${{ github.run_number }} 가 나타납니다."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
        working-directory: .

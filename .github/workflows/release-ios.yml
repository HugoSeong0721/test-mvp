name: Release iOS (앱 선택 → App Store Connect)

# 맥 없이 App Store Connect 에 빌드를 올린다. 수동 실행 전용(Actions → Run workflow).
# App Store Connect API 키로 배포 인증서·App Store 프로파일을 실행마다 새로 발급해 수동 서명하고,
# 끝나면 지운다 (.github/scripts/asc_signing.py). 기기 등록이 필요 없다.
#   - 자동 서명 아카이브는 개발용 프로파일을 요구 → 등록 기기 없으면 실패
#   - 서명 없이 아카이브 후 export 서명 → Google 광고 SDK 프레임워크가 재서명되지 않아 업로드 거부
#
# 필요한 저장소 Secrets (만드는 법: currency_app/flutter/README.md 의 iOS 절)
#   APPLE_TEAM_ID          developer.apple.com → Account → Membership details 의 Team ID (10자리)
#   ASC_KEY_ID             App Store Connect API 키 ID (10자리)
#   ASC_ISSUER_ID          같은 화면 위쪽의 Issuer ID (UUID)
#   ASC_KEY_P8             내려받은 AuthKey_XXXX.p8 파일 내용 전체 (BEGIN/END 줄 포함)
#
# 빌드 번호는 실행 번호(run_number)를 써서 올릴 때마다 자동으로 커진다 (앱이 달라도 계속 커져서 문제없다).
#
# 앱 추가: 아래 options 에 이름만 넣는다. 규칙: 폴더 <이름>_app/flutter, 번들 ID com.soulfulfill.<이름>.
#   번들 ID 는 developer.apple.com 에 먼저 등록돼 있어야 한다 (Actions `iOS 번들 ID 등록 · 앱 레코드 확인`).
#   (여러 세션이 이 줄에 앱을 더한다 — 충돌 나면 선택지를 전부 살려서 합친다)

on:
  workflow_dispatch:
    inputs:
      app:
        description: "올릴 앱"
        type: choice
        options: [currency, catdoku, mortgage]
        default: currency

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ inputs.app }}_app/flutter
    env:
      # 모든 앱이 com.soulfulfill.<이름> 규칙 (currency·catdoku 도 그대로 맞는다)
      BUNDLE_ID: com.soulfulfill.${{ inputs.app }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets 가 비어 있습니다:$missing — README 의 iOS 절 참고"
            exit 1
          fi
        working-directory: .

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Flutter build config
        run: flutter build ios --release --config-only --no-codesign --build-number=${{ github.run_number }}

      - name: Issue distribution certificate & App Store profile
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          SIGN_DIR="$RUNNER_TEMP/signing"
          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          OUT=$("$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/asc_signing.py" setup "$BUNDLE_ID" "$SIGN_DIR")
          echo "$OUT"
          echo "PROFILE_NAME=$(echo "$OUT" | tail -1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["profile_name"])')" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$(echo "$OUT" | tail -1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["profile_uuid"])')" >> "$GITHUB_ENV"

      - name: Install certificate & profile
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$SIGN_DIR/dist.p12" -k "$KC" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$SIGN_DIR/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

      # Runner 타깃만 수동 배포 서명으로 바꾼다 (패키지 타깃에 프로파일을 주면 빌드가 깨진다)
      - name: Set manual signing on Runner target
        run: |
          python3 - <<'EOF'
          import os, pathlib
          p = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          anchor = f'PRODUCT_BUNDLE_IDENTIFIER = {os.environ["BUNDLE_ID"]};'
          add = (anchor +
                 '\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                 f'\n\t\t\t\tDEVELOPMENT_TEAM = {os.environ["TEAM_ID"]};'
                 f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";'
                 '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                 '\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          n = s.count(anchor)
          assert n == 3, f'Runner 빌드 설정 {n}개 (3개 기대)'
          s = s.replace(anchor, add).replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          p.write_text(s)
          print('Runner: manual signing,', os.environ['PROFILE_NAME'])
          EOF

      - name: Archive (배포 서명)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive | tail -n 80
          test -d "$RUNNER_TEMP/Runner.xcarchive"

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "업로드 완료 — App Store Connect → 앱 → TestFlight 에 10~30분 뒤 빌드 ${{ github.run_number }} 가 나타납니다."

      - name: Revoke temporary certificate & profile
        if: always()
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] || exit 0
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/asc_signing.py" cleanup "$SIGN_DIR"
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
        working-directory: .

name: Build Android (환율 앱)

# currency_app/flutter 가 바뀌면 안드로이드 앱 번들(AAB)과 APK를 만들어
# Actions 아티팩트로 올린다. 내려받아 Play Console에 업로드하면 된다.
#
# 서명: 저장소 Secrets에 아래 4개가 있으면 그 키로 서명(=Play 업로드 가능),
# 없으면 debug 키로 서명해 빌드만 확인한다 (Play 업로드는 불가).
#   ANDROID_KEYSTORE_BASE64  upload-keystore.jks 를 base64 로 인코딩한 문자열
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# 만드는 법은 currency_app/flutter/README.md 참고.

on:
  push:
    branches: [main]
    paths:
      - "currency_app/flutter/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: currency_app/flutter
    env:
      # secrets 는 if 조건에서 바로 못 쓰므로 env 로 한 번 옮긴다
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Restore upload keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "서명 키 복원 완료 — 릴리스 키로 서명합니다."

      - name: Note when unsigned
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning::서명 Secrets 가 없어 debug 키로 서명합니다. 이 빌드는 Play 업로드용이 아닙니다."

      - name: Build app bundle (Play 업로드용)
        run: flutter build appbundle --release

      - name: Build APK (폰에 직접 설치해 볼 용도)
        run: flutter build apk --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: somrate-aab
          path: currency_app/flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: somrate-apk
          path: currency_app/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
